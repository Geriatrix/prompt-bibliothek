tal trip under [budget]. Find the best-value flight options, affordable places to stay, cheap local transport, low-cost attractions, food strategies, free activities, and areas where tourists commonly overspend. Create a realistic daily budget and show me how to save money without making the trip feel cheap or inconvenient.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-09-04","tags":"#reise #urlaub #reiseplanung #budget #reiseroute","source":"Instagram @techs - https://www.instagram.com/p/Dc3xl01D6eJ/","notes":"Braucht [origin], [destination], [duration] und [budget]. Fragt gezielt nach den Stellen, an denen Touristen typischerweise zu viel zahlen.","bild":"prompt_images/Dc3xl01D6eJ_03.jpg"},{"id":208,"title":"Tagesplan f\u00fcr die Reise erstellen","category":"Reise & Planung","prompt":"Act as a professional travel consultant. Build a detailed day-by-day itinerary for my trip to [destination] for [duration]. Include the best time to visit each attraction, realistic travel time between stops, transport options, approximate costs, food recommendations, hidden gems, rest periods, and backup options. Keep each day balanced so I can experience a lot without making the schedule exhausting or unrealistic.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-09-04","tags":"#reise #urlaub #reiseplanung #budget #reiseroute","source":"Instagram @techs - https://www.instagram.com/p/Dc3xl01D6eJ/","notes":"Ruhepausen und realistische Wegzeiten sind ausdr\u00fccklich verlangt \u2013 genau das fehlt in den meisten KI-Reisepl\u00e4nen.","bild":"prompt_images/Dc3xl01D6eJ_04.jpg"},{"id":209,"title":"Geheimtipps statt Touristenfallen","category":"Reise & Planung","prompt":"Act like a well-connected local who has lived in [destination] for more than 20 years. Skip the obvious tourist traps and show me hidden gems, underrated restaurants, local cafes, neighborhoods, markets, scenic areas, cultural experiences, nightlife, and activities most visitors never discover. Organize everything by area and explain what makes each recommendation worth visiting, plus the best time of day to go.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-09-04","tags":"#reise #urlaub #reiseplanung #budget #reiseroute","source":"Instagram @techs - https://www.instagram.com/p/Dc3xl01D6eJ/","notes":"Sortierung nach Stadtteil plus Tageszeit macht die Liste tats\u00e4chlich ablaufbar.","bild":"prompt_images/Dc3xl01D6eJ_05.jpg"},{"id":210,"title":"G\u00fcnstige Reise hochwertig anf\u00fchlen lassen","category":"Reise & Planung","prompt":"Act as a luxury travel consultant who specializes in making limited budgets feel premium. I am visiting [destination] with a total budget of [budget]. Help me maximize the experience through smarter hotel choices, better neighborhoods, strategic upgrades, memorable restaurants, premium-looking experiences, and cheaper alternatives to overpriced tourist options. Show me exactly where spending extra creates the biggest improvement and where paying more is unnecessary.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-09-04","tags":"#reise #urlaub #reiseplanung #budget #reiseroute","source":"Instagram @techs - https://www.instagram.com/p/Dc3xl01D6eJ/","notes":"Gegenst\u00fcck zum reinen Sparprompt: gleiche Summe, bessere Wirkung.","bild":"prompt_images/Dc3xl01D6eJ_06.jpg"},{"id":211,"title":"Kulinarischer Reisef\u00fchrer f\u00fcr ein Ziel","category":"Reise & Planung","prompt":"Act as a food-focused travel planner for [destination]. Create a complete food guide covering must try local dishes, breakfast spots, cafes, street food, lunch places, restaurants, desserts, markets, and neighborhoods known for great food. Build these into a day-by-day food route, include approximate prices and reservation advice, and prioritize places that feel genuinely local rather than overly touristy.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-09-04","tags":"#reise #urlaub #reiseplanung #budget #reiseroute","source":"Instagram @techs - https://www.instagram.com/p/Dc3xl01D6eJ/","notes":"Liefert eine Route statt einer blo\u00dfen Liste, inklusive Hinweis, wo reserviert werden muss.","bild":"prompt_images/Dc3xl01D6eJ_07.jpg"},{"id":212,"title":"Das richtige Viertel zum \u00dcbernachten finden","category":"Reise & Planung","prompt":"Act as a destination expert and help me choose exactly where to stay in [destination]. Compare the best neighborhoods based on my budget, safety, walkability, nightlife, food, atmosphere, public transport, airport access, and distance from major attractions. Rank the top areas for me, explain the trade-offs of each, then recommend the best neighborhood and type of accommodation for my specific trip.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-09-04","tags":"#reise #urlaub #reiseplanung #budget #reiseroute","source":"Instagram @techs - https://www.instagram.com/p/Dc3xl01D6eJ/","notes":"Die Wahl des Viertels entscheidet mehr \u00fcber die Reise als die Wahl des Hotels \u2013 dieser Prompt trennt beides sauber.","bild":"prompt_images/Dc3xl01D6eJ_08.jpg"},{"id":213,"title":"Plan B f\u00fcr Reisepannen","category":"Reise & Planung","prompt":"Act as a travel problem-solver and create a backup plan for my trip to [destination]. Prepare alternatives for bad weather, canceled activities, delayed flights, closed attractions, transport problems, overspending, tourist scams, lost reservations, and sudden itinerary changes. For each problem, give me the fastest practical solution, a backup activity or route, and anything I should prepare before the trip so small problems do not ruin the day.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-09-04","tags":"#reise #urlaub #reiseplanung #budget #reiseroute","source":"Instagram @techs - https://www.instagram.com/p/Dc3xl01D6eJ/","notes":"Vor der Abreise einmal durchlaufen lassen und das Ergebnis aufs Handy legen.","bild":"prompt_images/Dc3xl01D6eJ_09.jpg"},{"id":214,"title":"Schluss mit Gef\u00e4lligkeit: ehrlicher Berater statt Ja-Sager","category":"Rollen & System-Prompts","prompt":"Apply the following rules to every answer in this conversation, starting now, unless I explicitly tell you otherwise.\n\n1. Accuracy over encouragement.\nStop trying to make me feel good. Give me the most honest assessment of my situation, including uncomfortable truths I may be avoiding.\n\n2. Do not agree by default.\nAct as a skeptical expert. Do not automatically accept my assumptions. Identify every weak point in my reasoning, challenge my conclusions, and explain what I am missing.\n\n3. No fluff.\nAnswer the way you would answer someone who needs results, not reassurance. Remove unnecessary politeness, motivational filler, and generic advice. Be direct, practical, and specific.\n\n4. Look for the failure first.\nAnalyze my plan as if you were trying to find the reason it will fail. Name the five biggest weaknesses, rank them by importance, and tell me exactly how to fix each one.\n\n5. Reality check.\nIf my goal is unrealistic, say so clearly. If my strategy is bad, say why. If there is a better approach, give it to me. Do not agree with me just because I sound confident. Optimize for truth and results, not validation.\n\n6. Risk and alternatives.\nAct like a high-level strategist who is paid to tell me what I need to hear, not what I want to hear. Examine my idea objectively, point out what is wrong, expose hidden risks, and give me the strongest alternative. Be blunt, logical, and solution-focused.","model":"ChatGPT","rating":5,"datum":"2026-09-13","postdatum":"2026-09-12","tags":"#systemprompt #ehrlichkeit #kritik #entscheidung #rolle","source":"Instagram - https://www.instagram.com/p/DdK_xQyiRMM/","notes":"Zusammenfassung eines Karussells mit sechs einzelnen Anweisungen (Brutal Honesty, Challenge My Thinking, No-Fluff Advisor, Find the Biggest Mistake, Reality Check, Risk Analysis) zu EINEM zusammenh\u00e4ngenden System-Prompt \u2013 so gew\u00fcnscht am 13.09.2026. Inhaltlich unver\u00e4ndert; von mir erg\u00e4nzt wurden nur der einleitende Satz zur Geltungsdauer und die sechs Zwischen\u00fcberschriften. Am Anfang eines Gespr\u00e4chs oder als Projekt-/Custom-Instruction einsetzen, nicht mitten in einem Verlauf. Wirkt am besten bei Pl\u00e4nen und Entscheidungen; bei reinen Faktenfragen bringt er nichts.","bild":"prompt_images/DdK_xQyiRMM_02.jpg"},{"id":215,"title":"Entscheidungen sauber gegeneinander abw\u00e4gen","category":"Rollen & System-Prompts","prompt":"Whenever I need to make an important decision, help me compare the available options clearly. Evaluate the benefits, drawbacks, risks, opportunity costs, and likely outcomes of each choice. If there's a stronger option I haven't considered, include it and explain why. End with the choice you recommend and the reasoning behind it.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-08-25","tags":"#rolle #dauerauftrag #assistent #arbeitsweise","source":"Instagram @getintoai - https://www.instagram.com/p/DceKSkcGIe_/","notes":"Opportunit\u00e4tskosten und die Pflicht, eine \u00fcbersehene Option nachzureichen, sind der Kern \u2013 sonst vergleicht das Modell nur die Alternativen, die man selbst schon kannte. Als Dauer-Anweisung gedacht: an den Anfang eines Gespr\u00e4chs oder in die Custom Instructions, nicht mitten im Verlauf.","bild":"prompt_images/DceKSkcGIe__02.jpg"},{"id":216,"title":"Assistent, der erst das Ziel versteht","category":"Rollen & System-Prompts","prompt":"Act as my personal assistant from now on. Before completing a request, understand what I'm actually trying to achieve. Ask only questions that are truly necessary, then give me the most practical and efficient solution. If there's a faster or smarter way to reach the same result, point it out. Prioritize accuracy, clarity, and actions I can actually take.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-08-25","tags":"#rolle #dauerauftrag #assistent #arbeitsweise","source":"Instagram @getintoai - https://www.instagram.com/p/DceKSkcGIe_/","notes":"\u201eNur wirklich n\u00f6tige R\u00fcckfragen\u201c bremst die sonst \u00fcbliche Fragerei, ohne das Nachfragen ganz zu verbieten. Als Dauer-Anweisung gedacht: an den Anfang eines Gespr\u00e4chs oder in die Custom Instructions, nicht mitten im Verlauf.","bild":"prompt_images/DceKSkcGIe__03.jpg"},{"id":217,"title":"Rechercheassistent mit Trennung von Fakt und Annahme","category":"Analyse & Recherche","prompt":"Act as my research assistant whenever I give you a topic. Organize the information into clear sections, separate established facts from assumptions or uncertainty, explain difficult ideas in simple language, and highlight the most important takeaways. Finish with useful next steps, questions worth exploring, or resources I should look at next.","model":"ChatGPT","rating":5,"datum":"2026-09-13","postdatum":"2026-08-25","tags":"#rolle #dauerauftrag #assistent #arbeitsweise","source":"Instagram @getintoai - https://www.instagram.com/p/DceKSkcGIe_/","notes":"Die verlangte Trennung von Gesichertem und Vermutetem ist genau die Stelle, an der KI-Recherchen sonst verschwimmen. Als Dauer-Anweisung gedacht: an den Anfang eines Gespr\u00e4chs oder in die Custom Instructions, nicht mitten im Verlauf.","bild":"prompt_images/DceKSkcGIe__04.jpg"},{"id":218,"title":"Problem an der Wurzel statt am Symptom l\u00f6sen","category":"Rollen & System-Prompts","prompt":"Treat the problem I give you as something that needs to be solved in the real world. Identify the likely root cause first, challenge any weak assumptions I'm making, and consider multiple possible solutions. Compare the trade-offs, then recommend the approach that solves the immediate issue without creating bigger problems later.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-08-25","tags":"#rolle #dauerauftrag #assistent #arbeitsweise","source":"Instagram @getintoai - https://www.instagram.com/p/DceKSkcGIe_/","notes":"Erst Ursache, dann L\u00f6sung \u2013 plus die Auflage, keine Folgeprobleme zu bauen. Passt zum Vorgehen bei Fehlersuche im eigenen Code. Als Dauer-Anweisung gedacht: an den Anfang eines Gespr\u00e4chs oder in die Custom Instructions, nicht mitten im Verlauf.","bild":"prompt_images/DceKSkcGIe__05.jpg"},{"id":219,"title":"Drei Wege zur Wahl: einfachster, schnellster, bester","category":"Alltag & Produktivit\u00e4t","prompt":"Act as my life and productivity organizer. Help me manage work, learning, projects, personal responsibilities, travel, finances, and daily tasks without making things unnecessarily complicated. When I give you a problem, show me the simplest option, the fastest option, and the highest-quality option. Then recommend which one makes the most sense for my situation.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-08-25","tags":"#rolle #dauerauftrag #assistent #arbeitsweise","source":"Instagram @getintoai - https://www.instagram.com/p/DceKSkcGIe_/","notes":"Das Dreier-Muster einfachster/schnellster/bester Weg l\u00e4sst sich auch einzeln an jede beliebige Frage anh\u00e4ngen. Als Dauer-Anweisung gedacht: an den Anfang eines Gespr\u00e4chs oder in die Custom Instructions, nicht mitten im Verlauf.","bild":"prompt_images/DceKSkcGIe__06.jpg"},{"id":220,"title":"Texte sch\u00e4rfen, ohne den Sinn zu verbiegen","category":"Schreiben & Text","prompt":"Act as my writing and communication coach. Whenever I give you an email, message, caption, proposal, or piece of writing, improve it without changing the core meaning. Make it clearer, more natural, concise, and persuasive. Adjust the tone for the audience, remove unnecessary wording, and tell me when something could be misunderstood or sound weak.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-08-25","tags":"#rolle #dauerauftrag #assistent #arbeitsweise","source":"Instagram @getintoai - https://www.instagram.com/p/DceKSkcGIe_/","notes":"\u201eOhne den Kerngedanken zu \u00e4ndern\u201c ist die wichtige Schranke; der Hinweis auf missverst\u00e4ndliche Stellen ist der eigentliche Gewinn. Als Dauer-Anweisung gedacht: an den Anfang eines Gespr\u00e4chs oder in die Custom Instructions, nicht mitten im Verlauf.","bild":"prompt_images/DceKSkcGIe__07.jpg"},{"id":221,"title":"Lerncoach, der beim Vorwissen ansetzt","category":"Lernen & Erkl\u00e4ren","prompt":"Act as my personal learning coach. Whenever I want to understand a topic or skill, first identify what I already know and what I actually need to learn. Break the subject into the smallest useful concepts, teach them in the right order, use simple examples, and test me as we go. Focus on practical understanding instead of unnecessary theory.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-08-25","tags":"#rolle #dauerauftrag #assistent #arbeitsweise","source":"Instagram @getintoai - https://www.instagram.com/p/DceKSkcGIe_/","notes":"Beginnt mit einer Standortbestimmung statt bei null, und pr\u00fcft unterwegs ab. Als Dauer-Anweisung gedacht: an den Anfang eines Gespr\u00e4chs oder in die Custom Instructions, nicht mitten im Verlauf.","bild":"prompt_images/DceKSkcGIe__08.jpg"},{"id":222,"title":"Farbanalyse als Vergleichsgrafik aus einem Portr\u00e4t","category":"Portr\u00e4t & Personen","prompt":"Create a personal color analysis graphic using this portrait. Show side-by-side clothing color comparisons to highlight which colors suit the subject best.","model":"ChatGPT","rating":3,"datum":"2026-09-13","postdatum":"2026-08-26","tags":"#portraet #farbanalyse #frisur #makeup #styling #bildanalyse","source":"Instagram @techs - https://www.instagram.com/p/DcgmAgxj4l2/","notes":"Der k\u00fcrzeste der drei Prompts und der mit dem gr\u00f6\u00dften Effekt: das Modell stellt dieselbe Person in mehreren Kleidungsfarben nebeneinander. Ergebnis eignet sich als Einkaufshilfe. Braucht ein Modell, das Bilder erzeugen kann; ein Portr\u00e4tfoto wird mit hochgeladen. Im Post zeigen die Beispiel-Slides, dass sich die drei Analysen auch zu einer einzigen Gesamt\u00fcbersicht verbinden lassen (Farben, Frisur, Make-up bzw. Grooming auf einem Blatt).","bild":"prompt_images/DcgmAgxj4l2_02.jpg"},{"id":223,"title":"Frisurenvergleich aus einem Portr\u00e4t","category":"Portr\u00e4t & Personen","prompt":"Create a hairstyle analysis graphic using this portrait. Show side-by-side hairstyles comparisons to highlight which hairstyles suit the subject best.\n\nMake it visual-first, with short labels only and no paragraphs.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-08-26","tags":"#portraet #farbanalyse #frisur #makeup #styling #bildanalyse","source":"Instagram @techs - https://www.instagram.com/p/DcgmAgxj4l2/","notes":"Der Zusatz \u201evisual-first, nur kurze Beschriftungen, keine Abs\u00e4tze\u201c ist entscheidend \u2013 ohne ihn schreibt das Modell einen Aufsatz statt eine Bildtafel zu bauen. Braucht ein Modell, das Bilder erzeugen kann; ein Portr\u00e4tfoto wird mit hochgeladen. Im Post zeigen die Beispiel-Slides, dass sich die drei Analysen auch zu einer einzigen Gesamt\u00fcbersicht verbinden lassen (Farben, Frisur, Make-up bzw. Grooming auf einem Blatt).","bild":"prompt_images/DcgmAgxj4l2_03.jpg"},{"id":224,"title":"Make-up-Analyse mit Hautunterton","category":"Portr\u00e4t & Personen","prompt":"Create a visual makeup analysis graphic using this portrait. Feature side-by-side comparisons to determine which makeup best suits the subject, and showcase their skin undertone.\n\nThe graphic should be visual-first, using only short labels with no paragraphs.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-08-26","tags":"#portraet #farbanalyse #frisur #makeup #styling #bildanalyse","source":"Instagram @techs - https://www.instagram.com/p/DcgmAgxj4l2/","notes":"Zeigt zus\u00e4tzlich den Hautunterton (warm/neutral/kalt), was die Grundlage f\u00fcr die Farbwahl bei Kleidung und Schmuckmetall ist. Braucht ein Modell, das Bilder erzeugen kann; ein Portr\u00e4tfoto wird mit hochgeladen. Im Post zeigen die Beispiel-Slides, dass sich die drei Analysen auch zu einer einzigen Gesamt\u00fcbersicht verbinden lassen (Farben, Frisur, Make-up bzw. Grooming auf einem Blatt).","bild":"prompt_images/DcgmAgxj4l2_04.jpg"},{"id":225,"title":"Komplette Stilanalyse auf einem Blatt","category":"Portr\u00e4t & Personen","prompt":"Create one complete personal style analysis sheet from the attached portrait. Produce it as a single graphic, not as an essay.\n\nUse the person in the photo as the subject throughout, keeping their actual face, hair texture, skin tone, and build recognisable in every variation you render.\n\nThe sheet must contain these sections:\n\n1. PROFILE \u2014 apparent age range, build, face shape, skin tone and undertone (warm / neutral / cool), natural contrast level (low / medium / high), and a three-word summary of their current style essence.\n\n2. COLOUR \u2014 the season that fits best (e.g. Deep Autumn) with a one-line reason. Then side-by-side renders of the subject wearing the eight colours that suit them best, each labelled, and separately the five to six colours that work against them, also labelled. Add rows for their best neutrals, best accent colours, and best metal (gold / silver / rose gold).\n\n3. HAIR \u2014 side-by-side renders of the five or six haircuts and styles that suit their face shape best, each with a short label, plus three or four to avoid. Mark one as the single best look.\n\n4. FACE \u2014 for a made-up look: best finish, eyes, blush, lips and the matching palettes, plus the looks to avoid. For a bare or groomed look: beard or stubble length, brow shape, and the grooming details worth attention.\n\n5. ACCESSORIES \u2014 glasses shape, watch style, leather tones, and the metals that match the colour profile.\n\n6. VERDICT \u2014 three concrete things to change first, ranked by how much difference they make, and one sentence on why this palette and these shapes work for this particular face.\n\nRules for the output: visual-first. Short labels only, no paragraphs inside the graphic. Every recommendation must be shown on the subject, not described. Keep the layout clean enough to read on a phone.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-08-26","tags":"#portraet #farbanalyse #frisur #makeup #styling #bildanalyse","source":"Instagram @techs - https://www.instagram.com/p/DcgmAgxj4l2/","notes":"ZUSAMMENGESTELLT, nicht aus dem Post: Der Beitrag DcgmAgxj4l2 zeigt eine solche Gesamt\u00fcbersicht nur als Beispielbild (Slide 9, \u201eAI Complete Style Analysis\u201c), liefert aber keinen Prompt dazu. Dieser Text ist am 13.09.2026 aus den drei Einzelprompts #222, #223 und #224 plus den Rubriken der Beispiel-Slides gebaut worden \u2013 also nicht vom Urheber gepr\u00fcft, sondern eine eigene Fassung. Die Abschnitte 4 und 5 decken beide F\u00e4lle ab (mit und ohne Make-up), unpassendes einfach streichen. Braucht ein bilderzeugendes Modell und ein Portr\u00e4tfoto. Bei schwachem Ergebnis besser die drei Einzelprompts nacheinander laufen lassen: ein einzelner Auftrag mit sechs Rubriken \u00fcberfordert die meisten Bildmodelle.","bild":"prompt_images/DcgmAgxj4l2_09.jpg"},{"id":226,"title":"Handyfoto auf Spiegelreflex-Anmutung heben","category":"Fotobearbeitung & Retusche","prompt":"Transform my photo to look like it was taken with a professional full-frame DSLR camera. Keep my face, body, expression, clothing, and identity exactly the same. Add realistic depth of field, natural skin texture, a slight grain, and balanced exposure. Do not beautify or alter any shape.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#foto #retusche #portraet #licht #bildbearbeitung","source":"Instagram - https://www.instagram.com/p/DdPACH3mD2m/","notes":"\u201eSlight grain\u201c ist der Kniff: etwas Korn nimmt dem Ergebnis den glatten KI-Look. Roter Faden des Sets: dem Modell ausdr\u00fccklich verbieten, Gesicht und Proportionen zu \u201everbessern\u201c \u2013 genau daran scheitert das blo\u00dfe \u201ebearbeite mein Foto\u201c.","bild":"prompt_images/DdPACH3mD2m_02.jpg"},{"id":227,"title":"Portr\u00e4t im Magazin-Look","category":"Fotobearbeitung & Retusche","prompt":"Transform my photo into a high-end editorial portrait. Keep my facial structure, body, and skin texture unchanged. Enhance the lighting, composition, contrast, and background separation to make it look like a luxury magazine photoshoot.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#foto #retusche #portraet #licht #bildbearbeitung","source":"Instagram - https://www.instagram.com/p/DdPACH3mD2m/","notes":"Ver\u00e4ndert nur Licht, Bildaufbau, Kontrast und Freistellung \u2013 nicht das Gesicht. Roter Faden des Sets: dem Modell ausdr\u00fccklich verbieten, Gesicht und Proportionen zu \u201everbessern\u201c \u2013 genau daran scheitert das blo\u00dfe \u201ebearbeite mein Foto\u201c.","bild":"prompt_images/DdPACH3mD2m_03.jpg"},{"id":228,"title":"Foto in Abendlicht umsetzen","category":"Fotobearbeitung & Retusche","prompt":"Transform my photo into a natural golden hour photo. Keep my exact identity. Add warm and realistic sunlight, soft shadows, natural skin tones, and a slight depth of field. Avoid artificial shine or exaggerated saturation.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#foto #retusche #portraet #licht #bildbearbeitung","source":"Instagram - https://www.instagram.com/p/DdPACH3mD2m/","notes":"Das Verbot von k\u00fcnstlichem Glanz und \u00fcbertriebener S\u00e4ttigung verhindert den typischen Kitsch-Sonnenuntergang. Roter Faden des Sets: dem Modell ausdr\u00fccklich verbieten, Gesicht und Proportionen zu \u201everbessern\u201c \u2013 genau daran scheitert das blo\u00dfe \u201ebearbeite mein Foto\u201c.","bild":"prompt_images/DdPACH3mD2m_04.jpg"},{"id":229,"title":"Bewerbungsfoto aus einem normalen Bild","category":"Fotobearbeitung & Retusche","prompt":"Create a clean professional photo (headshot) from my photo. Keep my face, hair, and expression identical. Use natural and soft lighting, realistic texture, and a slight blur in the background. No beautification.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#foto #retusche #portraet #licht #bildbearbeitung","source":"Instagram - https://www.instagram.com/p/DdPACH3mD2m/","notes":"Brauchbar f\u00fcr Bewerbung, LinkedIn oder die Website \u2013 vorausgesetzt, das Ausgangsfoto ist scharf genug. Roter Faden des Sets: dem Modell ausdr\u00fccklich verbieten, Gesicht und Proportionen zu \u201everbessern\u201c \u2013 genau daran scheitert das blo\u00dfe \u201ebearbeite mein Foto\u201c.","bild":"prompt_images/DdPACH3mD2m_05.jpg"},{"id":230,"title":"Schlechtes Licht retten, ohne das Gesicht zu ver\u00e4ndern","category":"Fotobearbeitung & Retusche","prompt":"Fix the lighting in my photo without redoing my face. Keep my identity, features, and skin texture exactly the same. Balance the harsh shadows, recover the dark or overexposed parts, and make the lighting look natural, as if the photo had been taken in a well-lit environment. No smoothing or beautifying.","model":"ChatGPT","rating":5,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#foto #retusche #portraet #licht #bildbearbeitung","source":"Instagram - https://www.instagram.com/p/DdPACH3mD2m/","notes":"Der n\u00fctzlichste Prompt des Sets f\u00fcr Alltagsfotos: harte Schatten und abgesoffene Stellen ausgleichen, sonst nichts. Roter Faden des Sets: dem Modell ausdr\u00fccklich verbieten, Gesicht und Proportionen zu \u201everbessern\u201c \u2013 genau daran scheitert das blo\u00dfe \u201ebearbeite mein Foto\u201c.","bild":"prompt_images/DdPACH3mD2m_06.jpg"},{"id":231,"title":"Unruhigen Hintergrund gegen neutralen tauschen","category":"Fotobearbeitung & Retusche","prompt":"Replace the messy background in my photo with a professional and neutral background (a soft solid tone or a subtle studio blur). Keep my face, hair, clothing, and the lighting on me exactly the same, and make the transition between me and the new background look realistic, without artificial edges around the hair.","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#foto #retusche #portraet #licht #bildbearbeitung","source":"Instagram - https://www.instagram.com/p/DdPACH3mD2m/","notes":"Der Hinweis auf saubere Haarkanten ist entscheidend \u2013 dort verr\u00e4t sich ein Freisteller sonst sofort. Roter Faden des Sets: dem Modell ausdr\u00fccklich verbieten, Gesicht und Proportionen zu \u201everbessern\u201c \u2013 genau daran scheitert das blo\u00dfe \u201ebearbeite mein Foto\u201c.","bild":"prompt_images/DdPACH3mD2m_07.jpg"},{"id":232,"title":"Altes oder besch\u00e4digtes Foto restaurieren","category":"Fotobearbeitung & Retusche","prompt":"Restore this old or damaged photo. Remove scratches, stains, and fading, and enhance sharpness without inventing facial details that can't be seen in the original. Keep the appearance and identity of the people faithful to the real photo. If it's a black and white photo, ask me first if I want to colorize it or keep it in B&W.","model":"ChatGPT","rating":5,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#foto #retusche #portraet #licht #bildbearbeitung","source":"Instagram - https://www.instagram.com/p/DdPACH3mD2m/","notes":"\u201eKeine Gesichtsdetails erfinden, die im Original nicht zu sehen sind\u201c ist bei alten Familienfotos die wichtigste Auflage \u2013 sonst bekommt Oma ein fremdes Gesicht. Passt zu den Fotos in der eigenen Dokumentenablage.","bild":"prompt_images/DdPACH3mD2m_08.jpg"},{"id":233,"title":"Buchungszeitpunkt f\u00fcr eine Flugstrecke bestimmen","category":"Reise & Planung","prompt":"Act as an airline revenue management insider who spent 20 years building the exact pricing systems travelers fight against every day. Decode the full demand timing pattern for flights between [origin] and [destination] during [period]. Tell me the precise day, time, and booking window where the airline's pricing algorithm is weakest and my chances of paying the absolute minimum are strongest.\n\nRoute: [paste]\nTravel period: [paste]","model":"ChatGPT","rating":3,"datum":"2026-09-13","postdatum":"2026-08-29","tags":"#flug #fluege #reise #preise #meilen #buchung","source":"Instagram @techs - https://www.instagram.com/p/Dco2pVdD_fN/","notes":"Das Modell kennt keine Echtzeitpreise \u2013 es liefert Muster und Faustregeln, keine Tagesaktualit\u00e4t. Ergebnis als Suchfenster benutzen, nicht als Prognose.","bild":"prompt_images/Dco2pVdD_fN_02.jpg"},{"id":234,"title":"Strecke aus Einzeltickets zusammenbauen","category":"Reise & Planung","prompt":"Act as an airfare construction expert who has legally built routes from separate ticket combinations producing total costs 60 percent below any single itinerary booking the same journey. Construct every possible ticket combination between [origin] and [destination] using separate segments, hidden city options, and any routing that costs less than every complete itinerary currently shown on every booking platform.\n\nOrigin: [city]\nDestination: [city]\nTravel dates: [range]","model":"ChatGPT","rating":2,"datum":"2026-09-13","postdatum":"2026-08-29","tags":"#flug #fluege #reise #preise #meilen #buchung","source":"Instagram @techs - https://www.instagram.com/p/Dco2pVdD_fN/","notes":"ACHTUNG: \u201eHidden City\u201c (Zwischenstopp als eigentliches Ziel, letztes Teilst\u00fcck verfallen lassen) verst\u00f6\u00dft gegen die Bef\u00f6rderungsbedingungen der meisten Airlines; die Lufthansa hat deswegen in Deutschland gegen Passagiere geklagt. Au\u00dferdem: bei getrennten Tickets haftet niemand f\u00fcr verpasste Anschl\u00fcsse, und aufgegebenes Gep\u00e4ck wird nicht durchgecheckt. Die Aufteilung in Einzeltickets ist unproblematisch, der Hidden-City-Teil nicht \u2013 die \u201e60 Prozent\u201c sind Werbetext.","bild":"prompt_images/Dco2pVdD_fN_03.jpg"},{"id":235,"title":"Meilen und Punkte \u00fcber Programme hinweg nutzen","category":"Reise & Planung","prompt":"Act as a loyalty program arbitrage specialist who has moved points between programs, combined balances across accounts, and redeemed miles through partner airlines to reach award space most travelers never know exists. Design my complete points arbitrage strategy for [upcoming trip] using every balance I currently hold.\n\nMy complete balances: [paste]\nMy upcoming trip: [paste]","model":"ChatGPT","rating":3,"datum":"2026-09-13","postdatum":"2026-08-29","tags":"#flug #fluege #reise #preise #meilen #buchung","source":"Instagram @techs - https://www.instagram.com/p/Dco2pVdD_fN/","notes":"Der brauchbare Kern: Partner-Airlines statt der eigenen Fluggesellschaft abfragen, dort ist Pr\u00e4mienverf\u00fcgbarkeit oft besser. Umbuchungsverh\u00e4ltnisse und Transferpartner \u00e4ndern sich st\u00e4ndig \u2013 vom Modell genannte Werte vor dem Transfer selbst pr\u00fcfen, Transfers sind meist unumkehrbar.","bild":"prompt_images/Dco2pVdD_fN_04.jpg"},{"id":236,"title":"Buchungsklassen hinter dem Ticketpreis verstehen","category":"Reise & Planung","prompt":"Act as a fare class specialist who understands every letter code hiding behind every ticket price and knows exactly which classes carry upgrade eligibility, change flexibility, and mileage earning that the displayed price completely fails to communicate. Price, flexibility, upgrade probability, and mileage earning for my specific travel profile.\n\nMy route: [paste]\nMy travel dates: [paste]\nMy travel profile: [paste]","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-08-29","tags":"#flug #fluege #reise #preise #meilen #buchung","source":"Instagram @techs - https://www.instagram.com/p/Dco2pVdD_fN/","notes":"N\u00fctzlich beim Vergleich zweier fast gleich teurer Tickets: der Buchstabe entscheidet \u00fcber Umbuchbarkeit, Meilengutschrift und Upgrade-Chance.","bild":"prompt_images/Dco2pVdD_fN_05.jpg"},{"id":237,"title":"Zusatzgeb\u00fchren einer Buchung durchgehen","category":"Reise & Planung","prompt":"Act as an airline ancillary revenue specialist who knows every fee airlines generate beyond the base fare and every legitimate method travelers use to eliminate each one. Map every ancillary fee I will face on [itinerary] across every airline involved and give me the specific credit card benefit, status match, loophole, or strategy that legally eliminates each fee.\n\nMy itinerary: [paste]\nMy credit cards: [paste]\nMy current status: [paste]","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-08-29","tags":"#flug #fluege #reise #preise #meilen #buchung","source":"Instagram @techs - https://www.instagram.com/p/Dco2pVdD_fN/","notes":"Sitzplatz, Gep\u00e4ck, Umbuchung, Priority \u2013 die Aufstellung lohnt sich vor allem bei Billigfliegern, wo die Zusatzkosten den Grundpreis \u00fcbersteigen k\u00f6nnen. Kreditkartenvorteile sind stark vom Land abh\u00e4ngig, US-Tipps gelten hier oft nicht.","bild":"prompt_images/Dco2pVdD_fN_06.jpg"},{"id":238,"title":"Geld zur\u00fcckholen, wenn der Preis nach der Buchung f\u00e4llt","category":"Reise & Planung","prompt":"Act as a consumer rights travel specialist who has clawed back hundreds of dollars for travelers after booking by knowing exactly which airlines honor price drop guarantees, which credit cards provide price protection on travel purchases, and the precise claim process that airlines approve versus the ones they quietly deny.\n\nMy booked flight: [paste]\nMy credit cards: [paste]","model":"ChatGPT","rating":3,"datum":"2026-09-13","postdatum":"2026-08-29","tags":"#flug #fluege #reise #preise #meilen #buchung","source":"Instagram @techs - https://www.instagram.com/p/Dco2pVdD_fN/","notes":"In Europa gibt es kaum Preisgarantien wie in den USA; daf\u00fcr greifen hier die Fluggastrechte nach EU-Verordnung 261/2004 bei Versp\u00e4tung und Annullierung. Danach also besser gezielt fragen.","bild":"prompt_images/Dco2pVdD_fN_07.jpg"},{"id":239,"title":"Fertige Code-Kombinationen f\u00fcr acht Aufgaben","category":"Fotobearbeitung & Retusche","prompt":"Best rule: combine a few relevant codes rather than throwing every code into one prompt. Upload the image and paste one line:\n\nOld Photo Restoration:\n/restore /repair /removeScratches /removeDust /repairdamage /restoreDetails /colorrestore /naturalskin /preserveidentity /8k\n\nPhoto Enhancement:\n/enhance /8k /sharp /natural /colorful /fixlighting /preserveidentity\n\nNatural Portrait:\n/beautify /naturalskin /softlighting /sharp /professional /natural /preserveidentity\n\nRemove Clutter:\n/cleanup /removeclutter /removeunwantedobjects /cleanbackground /enhance /8k\n\nPremium Product:\n/premiumshowcase /productphoto /studioquality /luxury /softlighting /sharp /8k\n\nMaximum Restoration:\n/restore /repair /enhance /deblur /denoise /removeScratches /removeDust /recoverDetails /colorrestore /fixlighting /naturalskin /preserveidentity /8k\n\nNatural 8K Restoration:\n/restore /enhance /8k /colorful /natural /preserveidentity\n\nProfessional Beauty:\n/beautify /naturalskin /softlighting /professional /sharp /natural /preserveidentity","model":"ChatGPT","rating":5,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#shortcut #foto #bildbearbeitung #codes","source":"Instagram @DigiBott - https://www.instagram.com/p/DdNlUd5CcJw/","notes":"Der wichtigste Eintrag des Sets: fertige Zeilen zum Kopieren. Die Regel des Urhebers lautet ausdr\u00fccklich, wenige passende Codes zu kombinieren statt alle hineinzuwerfen. /preserveidentity steht in fast jeder Zeile \u2014 das ist die Bremse gegen ein ver\u00e4ndertes Gesicht.","bild":"prompt_images/DdNlUd5CcJw_02.jpg"},{"id":240,"title":"Codes: Restaurieren und Reparieren","category":"Fotobearbeitung & Retusche","prompt":"/restore / adowrecovery /highlightrecovery /balancedlighting /softlighting /naturallighting /studiolighting /cinematiclighting /goldenhour /windowlight /rimlight /backlight","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#shortcut #foto #bildbearbeitung #codes","source":"Instagram @DigiBott - https://www.instagram.com/p/DdNlUd5CcJw/","notes":"/shadowrecovery und /highlightrecovery arbeiten wie die gleichnamigen Regler in Lightroom \u2014 abgesoffene und ausgefressene Stellen zur\u00fcckholen.","bild":"prompt_images/DdNlUd5CcJw_07.jpg"},{"id":249,"title":"Codes: Gesicht und Portr\u00e4t","category":"Portr\u00e4t & Personen","prompt":"/beautify /portrait /faceretouch /facialenhancement /naturalbeauty /naturalskin /skinretouch /skinEnhancement /clearskin /smoothskin /softskin /flawlessskin /eyeenhancement /sharpeyes /brighteyes /eyedetail /teethwhitening /lipenhancement /hairenhancement /naturalMakeup /professionalportrait /headshot","model":"ChatGPT","rating":3,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#shortcut #foto #bildbearbeitung #codes","source":"Instagram @DigiBott - https://www.instagram.com/p/DdNlUd5CcJw/","notes":"/flawlessskin und /smoothskin f\u00fchren schnell zum Plastik-Look. /naturalskin zusammen mit /gentleretouch liefert brauchbarere Ergebnisse.","bild":"prompt_images/DdNlUd5CcJw_07.jpg"},{"id":250,"title":"Codes: Kino-Anmutung","category":"Fotobearbeitung & Retusche","prompt":"/cinematic /filmic /movie /dramatic /noir /epic /atmospheric /moody /storytelling /anamorphic /filmgrain /vintagefilm","model":"ChatGPT","rating":3,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#shortcut #foto #bildbearbeitung #codes","source":"Instagram @DigiBott - https://www.instagram.com/p/DdNlUd5CcJw/","notes":"/filmgrain gegen den glatten KI-Look, /anamorphic f\u00fcr das breite Kinoformat mit den typischen Lichtreflexen.","bild":"prompt_images/DdNlUd5CcJw_08.jpg"},{"id":251,"title":"Codes: Produkt- und Werbefotos","category":"Fotobearbeitung & Retusche","prompt":"/productphoto /productshot /productphotography /premiumshowcase /productshowcase /heroshot /hero /commercialproduct /ecommerce /catalog /advertising /luxuryproduct /minimalproduct /cleanproduct /floatingproduct /levitation","model":"ChatGPT","rating":3,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#shortcut #foto #bildbearbeitung #codes","source":"Instagram @DigiBott - https://www.instagram.com/p/DdNlUd5CcJw/","notes":"F\u00fcr Verkaufsanzeigen n\u00fctzlich: /cleanproduct plus /whitebackground ergibt das \u00fcbliche Marktplatz-Format.","bild":"prompt_images/DdNlUd5CcJw_08.jpg"},{"id":252,"title":"Codes: Unsch\u00e4rfe, Rauschen, Artefakte","category":"Fotobearbeitung & Retusche","prompt":"/deblur /fixblur /motiondeblur /focusfix /denoise /noisereduction /removegrain /fixpixelation /depixelate /removeartifacts /removecompression /fixcompression /removejpegArtifacts /cleanedges","model":"ChatGPT","rating":3,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#shortcut #foto #bildbearbeitung #codes","source":"Instagram @DigiBott - https://www.instagram.com/p/DdNlUd5CcJw/","notes":"/removejpegArtifacts hilft bei Bildern, die mehrfach durch Messenger geschickt wurden.","bild":"prompt_images/DdNlUd5CcJw_09.jpg"},{"id":253,"title":"Codes: Farbe und Kolorierung","category":"Fotobearbeitung & Retusche","prompt":"/colorful /colorrestore /colorize /colorcorrection /colorbalance /colorgrade /naturalcolors /vibrantcolors /richcolors /warmcolors /coolcolors /accuratecolors /fixwhitebalance /whitebalance /vibrance /saturation /contrast","model":"ChatGPT","rating":3,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#shortcut #foto #bildbearbeitung #codes","source":"Instagram @DigiBott - https://www.instagram.com/p/DdNlUd5CcJw/","notes":"/colorize f\u00e4rbt Schwarzwei\u00dfbilder ein \u2014 die Farben sind geraten, nicht belegt. Bei Familienfotos vorher \u00fcberlegen, ob man das Original nicht lieber unver\u00e4ndert l\u00e4sst.","bild":"prompt_images/DdNlUd5CcJw_09.jpg"},{"id":254,"title":"Codes: Hintergrund","category":"Fotobearbeitung & Retusche","prompt":"/removebackground /backgroundremove /replacebackground /changebackground /blurbackground /bokehbackground /cleanbackground /minimalbackground /whitebackground /blackbackground /transparentbackground /studiobackground /gradientbackground /luxurybackground /naturebackground /citybackground","model":"ChatGPT","rating":3,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#shortcut #foto #bildbearbeitung #codes","source":"Instagram @DigiBott - https://www.instagram.com/p/DdNlUd5CcJw/","notes":"/transparentbackground ist der Freisteller f\u00fcr weitere Montagen.","bild":"prompt_images/DdNlUd5CcJw_10.jpg"},{"id":255,"title":"Codes: Objekte bearbeiten","category":"Fotobearbeitung & Retusche","prompt":"/addobject /removeobject /replaceobject /changeobject /resizeobject /repositionobject /rotateobject /recolorobject /restyleobject /duplicateobject /isolateobject","model":"ChatGPT","rating":3,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#shortcut #foto #bildbearbeitung #codes","source":"Instagram @DigiBott - https://www.instagram.com/p/DdNlUd5CcJw/","notes":"Einzelne Gegenst\u00e4nde im Bild verschieben, tauschen oder freistellen, ohne den Rest anzufassen.","bild":"prompt_images/DdNlUd5CcJw_10.jpg"},{"id":256,"title":"Codes: Reportage-Anmutung","category":"Fotobearbeitung & Retusche","prompt":"/bts /behindthescenes /candid /authentic /raw /documentary /photoshoot /studiosetup /creatorlife /working","model":"ChatGPT","rating":3,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#shortcut #foto #bildbearbeitung #codes","source":"Instagram @DigiBott - https://www.instagram.com/p/DdNlUd5CcJw/","notes":"Gegenmittel zum gestellten Look: /candid und /raw nehmen dem Bild das Posierte.","bild":"prompt_images/DdNlUd5CcJw_10.jpg"},{"id":257,"title":"Codes: K\u00f6rper, Kleidung, Ganzk\u00f6rper","category":"Portr\u00e4t & Personen","prompt":"/fullbody /bodyenhancement /clothingenhancement /outfitchange /outfitrestore /fabricdetail /shoedetail /hairdetail /poseenhancement /proportional /naturalproportions","model":"ChatGPT","rating":3,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#shortcut #foto #bildbearbeitung #codes","source":"Instagram @DigiBott - https://www.instagram.com/p/DdNlUd5CcJw/","notes":"/naturalproportions ist hier die Bremse \u2014 ohne sie ver\u00e4ndern Bildmodelle gern still die K\u00f6rperma\u00dfe.","bild":"prompt_images/DdNlUd5CcJw_11.jpg"},{"id":258,"title":"Codes: Social Media und Vorschaubilder","category":"Poster & Grafikdesign","prompt":"/socialmedia /instagram /reelcover /youtube /youtubethumbnail /thumbnail /clickworthy /eyecatching /viral /creatorstyle /contentcreator /vlogstyle","model":"ChatGPT","rating":3,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#shortcut #foto #bildbearbeitung #codes","source":"Instagram @DigiBott - https://www.instagram.com/p/DdNlUd5CcJw/","notes":"Formate und Bildsprache f\u00fcr Vorschaubilder. /clickworthy und /viral sind Geschmackssache und k\u00f6nnen ins Rei\u00dferische kippen.","bild":"prompt_images/DdNlUd5CcJw_11.jpg"},{"id":259,"title":"Codes: Details bewahren","category":"Fotobearbeitung & Retusche","prompt":"/preservedetails /preservehair /preserveclothing /preservetexture /preservebackground /preservecomposition /preserveoriginalcolors /preserveoriginalfeatures","model":"ChatGPT","rating":4,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#shortcut #foto #bildbearbeitung #codes","source":"Instagram @DigiBott - https://www.instagram.com/p/DdNlUd5CcJw/","notes":"Feinere Bremsen als /preserveidentity: gezielt festhalten, was unver\u00e4ndert bleiben soll \u2014 etwa /preserveoriginalcolors bei einem Bild, dessen Farbstich zum Original geh\u00f6rt.","bild":"prompt_images/DdNlUd5CcJw_11.jpg"},{"id":260,"title":"Codes: Letzter Schliff","category":"Fotobearbeitung & Retusche","prompt":"/cleanup /polish /refine /perfectedges /smoothedges /removeimperfections /removeblemishes /cleantexture /cleanimage","model":"ChatGPT","rating":3,"datum":"2026-09-13","postdatum":"2026-09-13","tags":"#shortcut #foto #bildbearbeitung #codes","source":"Instagram @DigiBott - https://www.instagram.com/p/DdNlUd5CcJw/","notes":"Zum Abschluss einer Bearbeitung. /removeimperfections gro\u00dfz\u00fcgig einzusetzen kostet Hautstruktur \u2014 sparsam dosieren.","bild":"prompt_images/DdNlUd5CcJw_11.jpg"},{"id":261,"title":"Die eine Aufgabe finden, die KI wirklich abnehmen soll","category":"Agenten & Automatisierung","prompt":"I want to find one thing AI could take off my plate that would genuinely make my life easier. Not a productivity hack, something I'd actually feel. Interview me about my week: what I do, what I dread, what I keep putting off, what I'm the only one who remembers to do. Ask one question at a time. When you've got enough, tell me the one thing you'd pick. Describe in plain English what you'd build to handle it. Ask me any clarifying questions and wait for my feedback, then tell me the first step to building this out. Do not anchor yourself in 2019 ways of working. Consider appropriate tech assumptions moving into 2027 and work backward from there, and from what you know about me.","model":"Copilot","rating":5,"datum":"2026-09-14","postdatum":"","tags":"#copilot #automatisierung #interview #arbeitsalltag","source":"Screenshot von Thorsten","notes":"Interview statt Liste: das Modell fragt \u2014 eine Frage nach der anderen \u2014 die eigene Woche ab und w\u00e4hlt dann selbst die eine Aufgabe aus, die sich zu automatisieren lohnt. Drei Auflagen tragen den Prompt: \u201eeine Frage auf einmal\u201c verhindert den \u00fcblichen Fragenblock, \u201ewarte auf meine R\u00fcckmeldung\u201c stoppt vor dem Losbauen, und die Vorgabe, nicht in Arbeitsweisen von 2019 zu denken sondern von 2027 r\u00fcckw\u00e4rts zu rechnen, h\u00e4lt die Vorschl\u00e4ge weg von Makro- und Vorlagen-Denken. Setzt voraus, dass das Modell etwas \u00fcber einen wei\u00df (Copilot mit Zugriff auf Postfach, Kalender und Dateien) \u2014 sonst r\u00e4t es. Verwandt mit #189, das dasselbe Ziel per Aufstellung statt per Gespr\u00e4ch angeht.","bild":null},{"id":262,"title":"Wochen-Cockpit aus Microsoft 365","category":"Alltag & Produktivit\u00e4t","prompt":"Act as my executive assistant and project manager. Please review all of my Microsoft 365 data from the past 7 days (including Outlook emails, Teams chats, Teams channel messages, Loop components, and To-Do/Planner tasks) to create a structured \"Weekly Command Centre Dashboard\" for me.\nOrganise the dashboard into the following clear sections:\n1. CRITICAL/TOP PRIORITIES: High-impact items, urgent requests, or escalations from the past week.\n2. MEDIUM PRIORITIES: Important tasks, ongoing projects, and follow-ups that need attention soon but are not burning.\n3. NOISE (CAN SAFELY IGNORE): Low-priority updates, FYIs, newsletters, or threads where I am CC'd and no action is required.\nFor EVERY item in the Top and Medium Priority sections, provide a clean table or bulleted list with:\n- Action Needed: (What exactly needs to be done)\n- Who's Involved: (The key stakeholders, senders, or taggers)\n- What to Do Next: (The immediate next step for me)\n4. MISSED DEADLINES & OVERDUE ITEMS: Highlight any tasks or explicit commitments I made in the last 7 days that have a passed due date or were flagged as urgent and missed.\n5. 3-DAY FOCUSED ACTION PLAN: Based on the above, build me a realistic daily focus schedule for the next 3 working days (Day 1, Day 2, Day 3) to clear the critical backlog and tackle top priorities.\nPlease present this information in a highly scannable, structured format using tables and bullet points. Keep it concise and actionable.","model":"Microsoft 365 Copilot","rating":0,"datum":"2026-09-14","postdatum":"","tags":"#copilot #microsoft365 #outlook #teams #produktivitaet","source":"ivee.jobs \u2013 Microsoft Copilot Prompt Pack (PDF, Dokument #251) - Owners Inbox/Arbeit/2026-06-26_Microsoft_Copilot_Prompt_Pack_ivee.pdf","notes":"Montags laufen lassen: Wochen\u00fcberblick \u00fcber Mails, Teams-Chats, Loop und Aufgaben der letzten 7 Tage, sortiert nach Priorit\u00e4t, mit \u00fcberf\u00e4lligen Punkten und 3-Tage-Plan. Braucht Copilot in Microsoft 365 mit Datenzugriff.","bild":null},{"id":263,"title":"Posteingang sichten mit Antwortentw\u00fcrfen","category":"Alltag & Produktivit\u00e4t","prompt":"Act as my executive communications assistant. Please scan my Outlook inbox from the last 5 days to identify the 5 most important email conversations that urgently require a reply from me.\nPrioritise emails that are time-sensitive, contain upcoming deadlines, or are sent by senior stakeholders, executives, and key clients.\nFor each of these 5 conversations, provide the following structured breakdown:\n1. [Sender Name] | Subject: [Email Subject Line]\n- Summary: A 1-sentence summary of the context and why it is important.\n- Urgency Level: (e.g., High \u2013 Senior Stakeholder, Time-Sensitive, etc.)\n- Draft Reply: Write a response that matches a professional, concise, and collaborative tone. Keep the reply strictly under 120 words.\n- Next Step: A single, clear action item or call-to-action included at the end of the draft.\nPlease present these 5 items clearly so I can review, tweak, and send them quickly.","model":"Microsoft 365 Copilot","rating":0,"datum":"2026-09-14","postdatum":"","tags":"#copilot #microsoft365 #outlook #teams #produktivitaet","source":"ivee.jobs \u2013 Microsoft Copilot Prompt Pack (PDF, Dokument #251) - Owners Inbox/Arbeit/2026-06-26_Microsoft_Copilot_Prompt_Pack_ivee.pdf","notes":"Mitte der Woche: die 5 wichtigsten offenen Mail-Verl\u00e4ufe der letzten 5 Tage, je mit Kurzfassung, Dringlichkeit und Antwortentwurf unter 120 W\u00f6rtern. Zeitfenster \u201e5 days\u201c nach Bedarf auf \u201e7 days\u201c oder \u201etoday\u201c \u00e4ndern.","bild":null},{"id":264,"title":"Besprechungs-Auswertung aus Teams","category":"Alltag & Produktivit\u00e4t","prompt":"Act as an elite project manager and meeting scribe. Please analyse my recent Microsoft Teams meeting transcripts, meeting notes, and follow-up messages from the past [X days \u2013 insert \"3 days\" or \"1 week\"] to extract core intelligence and action items.\nPlease build a \"Meeting Intelligence Dashboard\" structured exactly as follows:\n1. EXECUTIVE SUMMARY: A highly concise, bulleted summary of the main topics, themes, and contexts discussed across these meetings.\n2. KEY DECISIONS MADE: A clear list of what was officially agreed upon, finalised, or greenlit during these discussions.\n3. MASTER ACTION LIST: A structured table containing: Task (the exact, specific deliverable or action required), Owner (the person assigned), and Deadline (the agreed-upon due date, or \"Not Specified\").\n4. OWNERLESS OVERLOOKS: Flag any critical action items, tasks, or follow-ups that were discussed but have NO clear owner assigned to them yet.\n5. MY IMMEDIATE FOLLOW-UPS: Suggest exactly 3 high-priority follow-up actions that I personally should take today to maintain momentum, clarify the ownerless items, or unblock the team.\nPlease present this information in a clean, highly scannable format using bold headers and tables where appropriate.","model":"Microsoft 365 Copilot","rating":0,"datum":"2026-09-14","postdatum":"","tags":"#copilot #microsoft365 #outlook #teams #produktivitaet","source":"ivee.jobs \u2013 Microsoft Copilot Prompt Pack (PDF, Dokument #251) - Owners Inbox/Arbeit/2026-06-26_Microsoft_Copilot_Prompt_Pack_ivee.pdf","notes":"Nach vollen Besprechungstagen: Zusammenfassung, Beschl\u00fcsse, Aufgabenliste mit Verantwortlichen und Fristen, Aufgaben ohne Verantwortlichen, 3 n\u00e4chste Schritte. Vorher in Teams die Transkription einschalten (Einstellungen > Besprechungen > Transkription).","bild":null},{"id":265,"title":"Foto analysieren: die 3 wirksamsten Verbesserungen","category":"Fotobearbeitung & Retusche","prompt":"Look at this photograph like a photographer reviewing an image before final delivery. Don't immediately edit it. First identify why the photo isn't as striking as it could be. Look at composition, subject placement, light, tonal range, colors, depth, background, visual distractions, and the viewer's eye path. Identify the 3 changes that would create the biggest improvement and apply only those changes. Preserve anything that already works. The final image should feel noticeably better but still look like the original photograph.","model":"ChatGPT","rating":0,"datum":"2026-09-22","postdatum":"","tags":"#fotobearbeitung #bildbearbeitung #chatgpt #fotografie","source":"Instagram @theaiguyhere - https://www.instagram.com/p/DdTuaZdiOdo/","notes":"Eigenes Foto hochladen. Erst Diagnose, dann nur drei gezielte Eingriffe \u2014 gut als Einstieg vor den anderen Prompts dieser Reihe.","bild":"prompt_images/DdTuaZdiOdo_02.jpg"},{"id":266,"title":"Licht wie mit Profi-Ausleuchtung","category":"Fotobearbeitung & Retusche","prompt":"Rework the lighting of this photograph as if I had access to a professional lighting setup when the photo was taken. Determine where the light appears to come from and preserve that direction. Improve the relationship between highlights, midtones, and shadows, add believable dimensionality to the subject, and reduce distracting areas that compete for attention. Do not create lighting that contradicts the environment. Keep reflections, shadows, and skin tones physically believable.","model":"ChatGPT","rating":0,"datum":"2026-09-22","postdatum":"","tags":"#fotobearbeitung #bildbearbeitung #chatgpt #fotografie","source":"Instagram @theaiguyhere - https://www.instagram.com/p/DdTuaZdiOdo/","notes":"Beh\u00e4lt die vorhandene Lichtrichtung bei \u2014 f\u00fcr flach oder ung\u00fcnstig beleuchtete Fotos.","bild":"prompt_images/DdTuaZdiOdo_03.jpg"},{"id":267,"title":"Objektiv-Look ohne Szene zu ver\u00e4ndern","category":"Fotobearbeitung & Retusche","prompt":"Give this photograph the visual character of a carefully chosen professional lens without changing the actual scene. Improve natural subject separation, perspective, depth, falloff, and background rendering where appropriate. Keep the subject sharp and preserve important environmental details. Do not apply a generic blur to the background. Any depth effect should follow realistic distance and geometry. The final image should feel optically refined, as though the original photograph had been captured with better camera and lens choices.","model":"ChatGPT","rating":0,"datum":"2026-09-22","postdatum":"","tags":"#fotobearbeitung #bildbearbeitung #chatgpt #fotografie","source":"Instagram @theaiguyhere - https://www.instagram.com/p/DdTuaZdiOdo/","notes":"Freistellung und Tiefenwirkung wie mit guter Festbrennweite \u2014 ausdr\u00fccklich ohne pauschalen Hintergrund-Weichzeichner.","bild":"prompt_images/DdTuaZdiOdo_04.jpg"},{"id":268,"title":"Bearbeitung nach Profi-Genre (Kampagnen-Look)","category":"Fotobearbeitung & Retusche","prompt":"Treat this image as if it were photographed for a professional campaign. Determine what genre best suits the photograph, such as fashion, travel, portrait, lifestyle, product, editorial, or documentary, and edit it according to the visual standards of that genre. Refine the crop, tonal structure, colors, texture, contrast, and overall finish accordingly. Don't force a style that conflicts with the subject. The final image should look deliberately photographed and professionally finished rather than simply filtered.","model":"ChatGPT","rating":0,"datum":"2026-09-22","postdatum":"","tags":"#fotobearbeitung #bildbearbeitung #chatgpt #fotografie","source":"Instagram @theaiguyhere - https://www.instagram.com/p/DdTuaZdiOdo/","notes":"Das Modell w\u00e4hlt das passende Genre selbst; Beschnitt, Farben und Kontrast folgen dessen Standards.","bild":"prompt_images/DdTuaZdiOdo_05.jpg"},{"id":269,"title":"Verlorene Details zur\u00fcckholen","category":"Fotobearbeitung & Retusche","prompt":"Examine this image for information that is visually weak because of exposure, shadows, highlights, haze, low contrast, noise, or poor tonal separation. Recover as much useful detail as the original photograph reasonably contains without inventing fake texture or excessive sharpness. Protect highlights that should remain soft and shadows that should remain naturally dark. Improve fine detail selectively rather than sharpening the entire image. The final result should look cleaner and more detailed while remaining faithful to the original capture.","model":"ChatGPT","rating":0,"datum":"2026-09-22","postdatum":"","tags":"#fotobearbeitung #bildbearbeitung #chatgpt #fotografie","source":"Instagram @theaiguyhere - https://www.instagram.com/p/DdTuaZdiOdo/","notes":"F\u00fcr unter- oder \u00fcberbelichtete, dunstige oder verrauschte Aufnahmen; ohne erfundene Texturen.","bild":"prompt_images/DdTuaZdiOdo_06.jpg"},{"id":270,"title":"Bildstimmung verst\u00e4rken (visuelle Geschichte)","category":"Fotobearbeitung & Retusche","prompt":"Decide what story or emotion this photograph naturally suggests, then edit the image to strengthen that story without changing the underlying scene. Use composition, crop, contrast, color, light, shadow, texture, and atmosphere to reinforce the intended feeling. Remove visual elements that contradict the mood when possible, but don't manufacture an unrealistic environment. Give the image a clear emotional direction such as intimate, powerful, peaceful, adventurous, mysterious, elegant, or nostalgic based on what suits the photograph best.","model":"ChatGPT","rating":0,"datum":"2026-09-22","postdatum":"","tags":"#fotobearbeitung #bildbearbeitung #chatgpt #fotografie","source":"Instagram @theaiguyhere - https://www.instagram.com/p/DdTuaZdiOdo/","notes":"Stimmung kann man auch vorgeben, z. B. \u201enostalgic\u201c statt der Auswahl durch das Modell.","bild":"prompt_images/DdTuaZdiOdo_07.jpg"},{"id":271,"title":"Druckreif f\u00fcr Magazin oder Wandbild","category":"Fotobearbeitung & Retusche","prompt":"Prepare this photograph as if it were going to be printed in a high-quality magazine or displayed as professional wall art. Prioritize tonal transitions, fine detail, accurate colors, controlled contrast, clean edges, natural textures, and visual balance. Look for artifacts that may become obvious at larger sizes and correct them carefully. Avoid edits that only look impressive on a phone screen. The final image should remain sophisticated, detailed, and believable when viewed closely.","model":"ChatGPT","rating":0,"datum":"2026-09-22","postdatum":"","tags":"#fotobearbeitung #bildbearbeitung #chatgpt #fotografie","source":"Instagram @theaiguyhere - https://www.instagram.com/p/DdTuaZdiOdo/","notes":"Vor Fotobuch, Leinwand oder Poster \u2014 achtet auf Artefakte, die erst in gro\u00df auffallen.","bild":"prompt_images/DdTuaZdiOdo_08.jpg"},{"id":272,"title":"Foto-Codes: Perspektive","category":"Portr\u00e4t & Personen","prompt":"/FORCEDPERSPECTIVE /GIANTPERSPECTIVE /MICROWORLD /REFLECTIONHACK /THROUGHOBJECT /FRAMEWITHINFRAME /FOREGROUNDFRAME /GROUNDREFLECTION /PARALLAXSHOT","model":"ChatGPT","rating":0,"datum":"2026-09-22","postdatum":"","tags":"#fotocodes #kamerawinkel #portrait #chatgpt #bildgenerierung","source":"Instagram @coderss_world - https://www.instagram.com/p/DdV56qvDY58/","notes":"Eigenes Foto hochladen und einen Code dazuschreiben, z. B. \u201e/MICROWORLD\u201c (Mini-Ich auf dem B\u00fccherstapel) oder \u201e/THROUGHOBJECT\u201c (durch einen Ring fotografiert). Keine echten ChatGPT-Befehle \u2014 das Modell liest das Wort als Stilbeschreibung; ausgeschrieben (\u201eshot through a ring, blurred foreground\u201c) wirkt es genauso gut oder besser.","bild":"prompt_images/DdV56qvDY58_02.jpg"},{"id":273,"title":"Foto-Codes: Kamerawinkel","category":"Portr\u00e4t & Personen","prompt":"/TOPANGLE /LOWANGLE /WIDEANGLE /OVERHEAD /BIRDSVIEW /WORMSVIEW /CLOSEUP /THREEQUARTER /DUTCHANGLE","model":"ChatGPT","rating":0,"datum":"2026-09-22","postdatum":"","tags":"#fotocodes #kamerawinkel #portrait #chatgpt #bildgenerierung","source":"Instagram @coderss_world - https://www.instagram.com/p/DdV56qvDY58/","notes":"Gleiches Foto, anderer Kamerastandpunkt: von oben, von unten, Froschperspektive, gekippte Kamera (Dutch Angle). Keine echten Befehle \u2014 das Wort wirkt als Beschreibung.","bild":"prompt_images/DdV56qvDY58_03.jpg"},{"id":274,"title":"Foto-Codes: Bewegung","category":"Portr\u00e4t & Personen","prompt":"/FREEZEACTION /MOTIONBLUR /TRACKINGSHOT /PULLIN /PULLOUT /EXTREMEPOV /VIRALSHOT /DYNAMICSHOT /CINEMATICPOV","model":"ChatGPT","rating":0,"datum":"2026-09-22","postdatum":"","tags":"#fotocodes #kamerawinkel #portrait #chatgpt #bildgenerierung","source":"Instagram @coderss_world - https://www.instagram.com/p/DdV56qvDY58/","notes":"Macht aus einem statischen Foto eine Actionszene: eingefrorener Sprung, Bewegungsunsch\u00e4rfe, Mitzieher, Zoom-Effekt. Keine echten Befehle \u2014 das Wort wirkt als Beschreibung.","bild":"prompt_images/DdV56qvDY58_04.jpg"},{"id":275,"title":"Foto-Codes: Virale Effekte","category":"Portr\u00e4t & Personen","prompt":"/PORTALSHOT /CLONEEFFECT /GIANTPERSPECTIVE /OBJECTTRANSITION /MIRRORPORTAL /SKYFALL /REALITYBEND /DOORREVEAL /SCROLLSTOPPER","model":"ChatGPT","rating":0,"datum":"2026-09-22","postdatum":"","tags":"#fotocodes #kamerawinkel #portrait #chatgpt #bildgenerierung","source":"Instagram @coderss_world - https://www.instagram.com/p/DdV56qvDY58/","notes":"Fantasie-Montagen: Portal, mehrfacher Klon, Riese \u00fcber der Stadt, T\u00fcr in eine andere Landschaft, Sturz durch die Wolken. Keine echten Befehle \u2014 das Wort wirkt als Beschreibung.","bild":"prompt_images/DdV56qvDY58_05.jpg"},{"id":276,"title":"Foto-Codes: Licht & Farbe","category":"Portr\u00e4t & Personen","prompt":"/GOLDENHOUR /BLUEHOUR /CINEMATICCOLOR /VINTAGECOLOR /PASTELCOLOR /WARMCOLOR /COOLCOLOR /MOODYCOLOR /VIBRANTCOLOR","model":"ChatGPT","rating":0,"datum":"2026-09-22","postdatum":"","tags":"#fotocodes #kamerawinkel #portrait #chatgpt #bildgenerierung","source":"Instagram @coderss_world - https://www.instagram.com/p/DdV56qvDY58/","notes":"\u00c4ndert nur Stimmung, Tageszeit und Farblook \u2014 Person und Pose bleiben gleich. Keine echten Befehle \u2014 das Wort wirkt als Beschreibung.","bild":"prompt_images/DdV56qvDY58_06.jpg"},{"id":277,"title":"Foto-Codes: Filmische Bildgestaltung","category":"Portr\u00e4t & Personen","prompt":"/LEADINGLINES /VANISHINGPOINT /FRAMEWITHINFRAME /FOREGROUNDDEPTH /SYMMETRICALSHOT /NEGATIVESPACE /REFLECTIONSHOT /SILHOUETTE /EPICPERSPECTIVE","model":"ChatGPT","rating":0,"datum":"2026-09-22","postdatum":"","tags":"#fotocodes #kamerawinkel #portrait #chatgpt #bildgenerierung","source":"Instagram @coderss_world - https://www.instagram.com/p/DdV56qvDY58/","notes":"Klassische Kompositionsregeln aus der Filmsprache: Fluchtlinien, Symmetrie, Rahmen im Rahmen, viel Freiraum, Silhouette. Keine echten Befehle \u2014 das Wort wirkt als Beschreibung.","bild":"prompt_images/DdV56qvDY58_07.jpg"},{"id":278,"title":"Foto-Codes: Objektiv & Sch\u00e4rfentiefe","category":"Portr\u00e4t & Personen","prompt":"/24MMWIDE /35MMSTREET /50MMNATURAL /85MMPORTRAIT /105MMCLOSE /MACROLOOK /SHALLOWDOF /DEEPPERSPECTIVE /ANAMORPHIC","model":"ChatGPT","rating":0,"datum":"2026-09-22","postdatum":"","tags":"#fotocodes #kamerawinkel #portrait #chatgpt #bildgenerierung","source":"Instagram @coderss_world - https://www.instagram.com/p/DdV56qvDY58/","notes":"Brennweiten-Look von Weitwinkel (24 mm) bis Tele-Portr\u00e4t (105 mm), Makro, geringe Sch\u00e4rfentiefe, anamorphotische Lichtstreifen. Keine echten Befehle \u2014 das Wort wirkt als Beschreibung. Auf dem Slide steht \u201e/35MMISTREET\u201c (Tippfehler), hier korrigiert.","bild":"prompt_images/DdV56qvDY58_08.jpg"}];
const KATEGORIEN = ["Fotobearbeitung & Retusche", "Portr\u00e4t & Personen", "Interior & Raumdesign", "Poster & Grafikdesign", "Schreiben & Text", "Alltag & Produktivit\u00e4t", "Reise & Planung", "Rollen & System-Prompts", "Analyse & Recherche", "Agenten & Automatisierung", "Video & Bewegtbild", "Lernen & Erkl\u00e4ren"];

/* Als SVG statt als Sonderzeichen: das Kopier-Glyph fehlt in vielen Schriften. */
const KOPIER_ICON =
  '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
  'stroke-width="1.4" stroke-linejoin="round" aria-hidden="true">' +
  '<rect x="5.2" y="5.2" width="8.3" height="8.3" rx="1.4"/>' +
  '<path d="M10.8 3.4V2.9a1.4 1.4 0 0 0-1.4-1.4H3.9a1.4 1.4 0 0 0-1.4 1.4v5.5a1.4 1.4 0 0 0 1.4 1.4h.5"/>' +
  '</svg>';

let katFilter = '', modellFilter = '';

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* Platzhalter wie [LOCATION] oder [BUDGET] sind das, was beim Einsetzen
   ersetzt werden muss — deshalb farbig statt als Fliesstext. */
const mitPlatzhaltern = t => esc(t).replace(/\[[^\]\n]{1,60}\]/g, m => '<span class="ph">' + m + '</span>');

function baueFilter() {
  const zKat = {}, zMod = {};
  PROMPTS.forEach(p => {
    zKat[p.category] = (zKat[p.category] || 0) + 1;
    if (p.model) zMod[p.model] = (zMod[p.model] || 0) + 1;
  });
  const modelle = Object.keys(zMod).sort();

  const chip = (wert, text, anzahl, aktiv, art) =>
    '<button type="button" class="chip" data-art="' + art + '" data-wert="' + esc(wert) +
    '" aria-pressed="' + aktiv + '">' + esc(text) + '<span class="n">' + anzahl + '</span></button>';

  document.getElementById('filter-kat').innerHTML =
    '<span class="reihe-titel">Thema</span>' +
    chip('', 'Alle', PROMPTS.length, katFilter === '', 'kat') +
    KATEGORIEN.filter(k => zKat[k]).map(k => chip(k, k, zKat[k], katFilter === k, 'kat')).join('');

  document.getElementById('filter-modell').innerHTML =
    '<span class="reihe-titel">Modell</span>' +
    chip('', 'Alle', PROMPTS.length, modellFilter === '', 'modell') +
    modelle.map(m => chip(m, m, zMod[m], modellFilter === m, 'modell')).join('');
}

function kurzDatum(wert) {
  if (!wert) return '';
  const teile = wert.slice(0, 10).split('-');
  return teile.length === 3 ? teile[2] + '.' + teile[1] + '.' + teile[0] : '';
}

// Zwei verschiedene Daten: postdatum = Veroeffentlichung der Quelle,
// datum = Aufnahme in diese Sammlung.
function datumsZeile(p) {
  const post = kurzDatum(p.postdatum), imp = kurzDatum(p.datum);
  let s = '';
  if (post) s += '<span class="datum" title="Veröffentlichung der Quelle">📅 ' + post + '</span>';
  if (imp) s += '<span class="datum" title="In die Sammlung aufgenommen">📥 ' + imp + '</span>';
  return s;
}

function karte(p) {
  const tags = (p.tags || '').split(',').map(t => t.trim()).filter(Boolean);
  const linkTreffer = (p.source || '').match(/https?:\/\/\S+/);
  let quelle = '';
  if (p.source) {
    quelle = linkTreffer
      ? esc(p.source.replace(linkTreffer[0], '')) +
        '<a href="' + esc(linkTreffer[0]) + '" target="_blank" rel="noopener">' + esc(linkTreffer[0]) + '</a>'
      : esc(p.source);
  }
  return '<article class="karte">' +
    '<div class="karte-kopf"><h3>' + esc(p.title) + '</h3>' +
    '<button type="button" class="kopieren" data-id="' + p.id + '" aria-label="Prompt kopieren" title="In die Zwischenablage">' + KOPIER_ICON + '</button></div>' +
    (p.bild ? '<img class="bild" src="' + p.bild + '" alt="Beispiel zu ' + esc(p.title) + '" loading="lazy">' : '') +
    '<pre class="text">' + mitPlatzhaltern(p.prompt) + '</pre>' +
    '<div class="zeile">' +
      (p.model ? '<span class="modell">' + esc(p.model) + '</span>' : '') +
      (p.rating ? '<span class="sterne" title="' + p.rating + ' von 5">' +
        '★'.repeat(p.rating) + '</span>' : '') +
      datumsZeile(p) +
      tags.map(t => '<span class="tag">#' + esc(t) + '</span>').join(' ') +
    '</div>' +
    (p.notes ? '<div class="notiz">' + esc(p.notes) + '</div>' : '') +
    (quelle ? '<div class="quelle">Quelle: ' + quelle + '</div>' : '') +
  '</article>';
}

function zeichne() {
  const suche = document.getElementById('suche').value.toLowerCase().trim();
  const treffer = PROMPTS.filter(p => {
    if (katFilter && p.category !== katFilter) return false;
    if (modellFilter && p.model !== modellFilter) return false;
    if (!suche) return true;
    return [p.title, p.prompt, p.tags, p.source, p.notes]
      .some(f => (f || '').toLowerCase().includes(suche));
  });

  document.getElementById('zaehler').textContent =
    treffer.length === PROMPTS.length
      ? PROMPTS.length + ' Prompts'
      : treffer.length + ' von ' + PROMPTS.length;

  const ziel = document.getElementById('liste');
  if (!treffer.length) {
    ziel.innerHTML = '<div class="leer">Kein Prompt passt zu dieser Auswahl.</div>';
    return;
  }
  const sortierung = document.getElementById('sortierung').value;
  if (sortierung === 'bewertung') {
    treffer.sort((a, b) => (b.rating || 0) - (a.rating || 0)
      || (a.title || '').localeCompare(b.title || '', 'de'));
  } else if (sortierung === 'neu' || sortierung === 'alt') {
    const vz = sortierung === 'neu' ? -1 : 1;
    treffer.sort((a, b) => vz * ((a.datum || '').localeCompare(b.datum || '') || a.id - b.id));
  }
  if (sortierung !== 'kategorie') {
    ziel.innerHTML = '<div class="raster">' + treffer.map(karte).join('') + '</div>';
    return;
  }

  const gruppen = {};
  treffer.forEach(p => { (gruppen[p.category] = gruppen[p.category] || []).push(p); });
  ziel.innerHTML = KATEGORIEN.filter(k => gruppen[k]).map(k =>
    '<section class="gruppe"><div class="gruppe-kopf"><h2>' + esc(k) + '</h2>' +
    '<span class="n">' + gruppen[k].length + '</span></div>' +
    '<div class="raster">' + gruppen[k].map(karte).join('') + '</div></section>').join('');
}

/* Kopieren muss auch dort gehen, wo die Clipboard-API fehlt. */
function kopiere(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(() => true, () => altmodisch(text));
  }
  return Promise.resolve(altmodisch(text));
}
function altmodisch(text) {
  const feld = document.createElement('textarea');
  feld.value = text;
  feld.setAttribute('readonly', '');
  feld.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
  document.body.appendChild(feld);
  try {
    if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
      const bereich = document.createRange();
      bereich.selectNodeContents(feld);
      const auswahl = window.getSelection();
      auswahl.removeAllRanges(); auswahl.addRange(bereich);
      feld.setSelectionRange(0, 999999);
    } else { feld.select(); }
    return document.execCommand('copy');
  } catch (e) { return false; }
  finally { document.body.removeChild(feld); }
}

let hinweisZeit;
function hinweis(text) {
  let box = document.getElementById('hinweis');
  if (!box) {
    box = document.createElement('div');
    box.id = 'hinweis';
    document.body.appendChild(box);
  }
  box.textContent = text;
  box.hidden = false;
  clearTimeout(hinweisZeit);
  hinweisZeit = setTimeout(() => { box.hidden = true; }, 2000);
}

document.addEventListener('click', ev => {
  const chip = ev.target.closest('.chip');
  if (chip) {
    if (chip.dataset.art === 'kat') katFilter = chip.dataset.wert;
    else modellFilter = chip.dataset.wert;
    baueFilter(); zeichne();
    return;
  }
  const knopf = ev.target.closest('.kopieren');
  if (knopf) {
    const p = PROMPTS.find(x => x.id === Number(knopf.dataset.id));
    if (!p) return;
    kopiere(p.prompt).then(ok => {
      hinweis(ok ? 'Prompt kopiert.' : 'Kopieren nicht m\\u00f6glich \\u2014 Text von Hand markieren.');
      if (ok) {
        knopf.classList.add('fertig');
        setTimeout(() => knopf.classList.remove('fertig'), 900);
      }
    });
    return;
  }
  const bild = ev.target.closest('.bild');
  if (bild) {
    let lupe = document.getElementById('lupe');
    if (!lupe) {
      lupe = document.createElement('div');
      lupe.id = 'lupe';
      lupe.innerHTML = '<img alt="">';
      lupe.addEventListener('click', () => { lupe.hidden = true; });
      document.body.appendChild(lupe);
    }
    lupe.querySelector('img').src = bild.src;
    lupe.hidden = false;
  }
});

document.getElementById('suche').addEventListener('input', zeichne);
document.getElementById('sortierung').addEventListener('change', zeichne);
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  const lupe = document.getElementById('lupe');
  if (lupe && !lupe.hidden) { lupe.hidden = true; return; }
  const feld = document.getElementById('suche');
  if (feld.value) { feld.value = ''; zeichne(); }
});

baueFilter();
zeichne();
</script>
