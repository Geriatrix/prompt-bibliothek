u201c \u2014 iCloud-Ordner AI","notes":"Vor dem Anpfiff statt danach \u2014 wirkt exklusiver als die Jubelbilder.","bild":null},{"id":150,"title":"Fu\u00dfball-Selfie: Training","category":"Portr\u00e4t & Personen","prompt":"Keep exact facial identity from the reference image.\nUltra realistic selfie during a professional football training session.\nFootball players practicing in the background. Sunny stadium environment.\nCoaches and equipment visible.\nProfessional sports photography. Natural candid moment. Extremely realistic.","model":"ChatGPT","rating":3,"datum":"2026-09-12","postdatum":"","tags":"#selfie #fussball #training","source":"PDF \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Tageslicht statt Flutlicht, dadurch die unaufgeregteste Variante.","bild":null},{"id":151,"title":"Fu\u00dfball-Selfie: Realismus-Baustein","category":"Portr\u00e4t & Personen","prompt":"Shot on iPhone 16 Pro, 24mm wide-angle lens, HDR photography, realistic skin pores, natural stadium lighting, slight motion blur in background crowd, authentic sports journalism photography, candid expressions, realistic sweat, documentary photo style, shallow depth of field, ultra detailed realism.","model":"ChatGPT","rating":5,"datum":"2026-09-12","postdatum":"","tags":"#baustein #realismus #kamera","source":"PDF \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"An jeden Prompt der Reihe anh\u00e4ngen. Die Bewegungsunsch\u00e4rfe im Publikum ist das Detail, das ein KI-Bild echt aussehen l\u00e4sst.","bild":null},{"id":152,"title":"Fu\u00dfball-Selfie: Negativ-Prompt","category":"Portr\u00e4t & Personen","prompt":"cartoon, illustration, CGI, painting, fake skin, distorted face, extra fingers, duplicate people, blurry face, low resolution, unrealistic eyes, wax skin, oversaturated colors, AI artifacts, deformed hands, unrealistic stadium","model":"ChatGPT","rating":4,"datum":"2026-09-12","postdatum":"","tags":"#baustein #negativ #realismus","source":"PDF \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"F\u00fcr Werkzeuge mit eigenem Negativ-Feld. Bei ChatGPT stattdessen als \u201e\u0001\u201c anh\u00e4ngen.","bild":null},{"id":153,"title":"Bewerbungsfoto: Identit\u00e4tsvorgabe","category":"Portr\u00e4t & Personen","prompt":"Use the uploaded image as the identity reference.\nPreserve the person's exact facial structure, eye shape, nose shape, lips, jawline, skin tone and overall identity.\nDo not redesign the face.\nDo not change ethnicity.\nMaintain maximum facial accuracy.\nIdentity preservation is the highest priority.","model":"ChatGPT","rating":5,"datum":"2026-09-12","postdatum":"","tags":"#baustein #identitaet #bewerbung","source":"PDF \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Schritt 1 der Reihe: zuerst nur festlegen, was unver\u00e4ndert bleibt, dann den Stil-Prompt anh\u00e4ngen.","bild":null},{"id":154,"title":"Bewerbungsfoto: LinkedIn-Standard","category":"Portr\u00e4t & Personen","prompt":"Transform into a professional LinkedIn headshot.\nTailored black suit. White dress shirt. Dark charcoal studio background.\nDirect eye contact. Professional executive appearance.\nLuxury portrait lighting. Rembrandt lighting. Shot on an 85mm lens.\nPhotorealistic skin texture. Corporate branding photography.\nUltra realistic. Vertical 4:5 composition.","model":"ChatGPT","rating":4,"datum":"2026-09-12","postdatum":"","tags":"#bewerbung #linkedin #studio #portrait","source":"PDF \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Aus einem normalen Selfie wird ein Studioportr\u00e4t. Rembrandt-Licht und 85 mm sind die beiden Angaben, die es professionell aussehen lassen.","bild":null},{"id":155,"title":"Bewerbungsfoto: Vorstandsportr\u00e4t","category":"Portr\u00e4t & Personen","prompt":"Fortune 500 CEO portrait.\nPremium tailored suit. Confident posture. Dark luxury studio backdrop.\nForbes magazine photography style. Professional editorial lighting.\nPhotorealistic. Ultra realistic skin detail.","model":"ChatGPT","rating":3,"datum":"2026-09-12","postdatum":"","tags":"#bewerbung #ceo #editorial","source":"PDF \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Eine Stufe formeller als der LinkedIn-Standard.","bild":null},{"id":156,"title":"Bewerbungsfoto: Gr\u00fcnderportr\u00e4t","category":"Portr\u00e4t & Personen","prompt":"Modern tech founder portrait.\nLuxury blazer. Open collar white shirt. Minimal styling.\nDark studio background. Premium editorial photography. Sharp focus.\nProfessional startup branding aesthetic.","model":"ChatGPT","rating":3,"datum":"2026-09-12","postdatum":"","tags":"#bewerbung #gruender #startup","source":"PDF \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Offener Kragen statt Krawatte \u2014 der Unterschied zwischen Konzern und Startup.","bild":null},{"id":157,"title":"Bewerbungsfoto: Gesichtstreue erzwingen","category":"Portr\u00e4t & Personen","prompt":"Face match priority: extremely high.\nPreserve exact facial structure, eye spacing, jawline, nose shape, lips, skin tone and age.\nOnly modify wardrobe, styling, background and lighting.\nIdentity preservation is the highest priority.","model":"ChatGPT","rating":5,"datum":"2026-09-12","postdatum":"","tags":"#baustein #identitaet #gesicht","source":"PDF \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Zu jedem Stil-Prompt dazu. \u201e\u0001\u201c ist der entscheidende Satz.","bild":null},{"id":158,"title":"Bewerbungsfoto: F\u00fchrungskraft","category":"Portr\u00e4t & Personen","prompt":"Corporate executive portrait.\nLuxury tailored suit. Professional confidence. Studio lighting.\nDark textured background. Business magazine photography.\nUltra realistic. Premium executive branding.","model":"ChatGPT","rating":3,"datum":"2026-09-12","postdatum":"","tags":"#bewerbung #fuehrung #studio","source":"PDF \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Zwischen LinkedIn-Standard und Vorstandsportr\u00e4t.","bild":null},{"id":159,"title":"Fu\u00dfballszene als Videosequenz","category":"Video & Bewegtbild","prompt":"Cinematic 15-second English Premier League match sequence, shot on ARRI ALEXA 35 with a 35mm broadcast lens. Real-time match speed, no slow motion. Overcast English afternoon, soft diffuse daylight, wet-grass gloss, a packed 60,000-seat Premier League stadium bowl with advertising boards and a crowd in constant realistic motion. Broadcast color science \u2014 cool midtones, punchy contrast. Handheld broadcast-style camera tracking the play like a live Premier League TV feed.\n\nFIELD ORIENTATION (locked): the team attacks in one consistent direction toward a single goal that stays on the same side of frame the whole time \u2014 no axis flip, no mirroring, camera stays on one side of the pitch and respects the 180-degree line. Pitch markings, penalty box, the D arc, goal, and ad boards hold correct, coherent perspective and scale in every frame.\n\nTHE TWO PLAYERS:\n- SEB = @image1, the hero and the ONLY identity-locked person in the scene. Exact same facial geometry, hair, and skin tone in every frame, zero drift, always the clearest figure. He is 6 feet (183 cm), athletic build. Navy Premier League jersey with gold trim, navy shorts, navy socks with gold band, black Adidas Predator cleats \u2014 identical every frame.\n- MARCO = a teammate who looks NOTHING like Seb: noticeably shorter and stockier, shaved head, different skin tone from Seb, number 9 clearly on his back. Same navy kit. Marco must never share Seb's face or build.\nAll defenders and the keeper are generic players. Do NOT apply Seb's face to Marco or to anyone else \u2014 Seb is the only person with his face.\n\nTHE PASSING SEQUENCE (this is the critical part \u2014 follow exactly):\n1. Seb dribbles at the edge of the penalty area, drops his shoulder left and cuts right off his right boot, beating a sliding defender, grass flicking up.\n2. Seb passes the ball OUT to the side, forward toward Marco who is standing ahead near the top of the D. The ball clearly LEAVES Seb's feet and travels across to MARCO. \u2192 MARCO receives this pass, NOT Seb. Seb does NOT receive his own pass. The instant Seb passes, he runs forward into the box empty-handed, ball no longer near him.\n3. MARCO controls the ball, carries it one or two strides forward toward goal.\n4. MARCO then passes the ball to SEB, who is now cutting into the box on a run. \u2192 NOW Seb receives the ball, arriving from Marco's side.\nAt no point do Seb and Marco occupy the same spot, and it must never look like Seb passes to himself \u2014 it is always Seb \u2192 Marco, then Marco \u2192 Seb, two clearly separate players exchanging the ball.\n\nTHE GOAL (must be perfect):\nSeb collects Marco's pass in full stride about four meters out, takes one composed left-foot touch to set the ball slightly ahead and right, plants his left foot firmly beside it with hips square to goal, and swings his right leg through a clean, biomechanically accurate strike \u2014 full hip rotation, locked ankle, toe down at contact \u2014 connecting flush with his right laces. The ball leaves hard and clean, curling with visible Magnus spin into the top-right corner. The goalkeeper dives full-stretch to his left a fraction too late, fingertips short \u2014 the keeper does NOT save it. The ball unmistakably crosses the line and hits the back netting; a realistic tension ripple spreads outward through the mesh from the impact point. Only once the ball is visibly in the net does Seb wheel away, arms thrown wide, raw open-mouthed celebration, sprinting straight at camera as the crowd erupts and confetti bursts. Final frame holds tight on Seb mid-fist-pump, face fully visible, identity perfectly preserved.\n\nAll motion obeys real-world physics \u2014 weighted grounded players, accurate ball trajectory, spin, friction, bounce, cleat-to-grass and ball-to-net interaction. No floaty movement, no stylization. Pure live-match realism start to finish.","model":"ChatGPT","rating":4,"datum":"2026-09-12","postdatum":"","tags":"#video #fussball #kamera #identitaet","source":"PDF \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Lehrst\u00fcck f\u00fcr Video-Prompts: Die 180-Grad-Regel wird ausdr\u00fccklich festgeschrieben, und es steht dreimal drin, wer den Pass bekommt \u2014 sonst spielt die Figur sich selbst an. @image1 durch das eigene Referenzbild ersetzen.","bild":null},{"id":160,"title":"Zw\u00f6lf Kamerawinkel aus einem Foto","category":"Fotobearbeitung & Retusche","prompt":"Analyze this image and generate 12 cinematic camera angle prompts based on the same subject and environment.\n\nInclude:\n- Close-up shots\n- Dutch angles\n- Bird's-eye shots\n- Low-angle perspectives\n- Wide cinematic compositions\n- Over-the-shoulder shots\n\nKeep the same character identity, outfit, lighting style, and background consistent across every variation.","model":"Gemini","rating":4,"datum":"2026-09-12","postdatum":"","tags":"#kamera #perspektive #serie #gemini","source":"PDF \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Zweistufig: Erst dieser Prompt mit hochgeladenem Bild, Gemini schreibt daraus zw\u00f6lf fertige Winkel-Prompts. Die gibt man einzeln zur\u00fcck, das Referenzbild bleibt angeh\u00e4ngt. Ergebnis ist eine ganze Bildstrecke aus einer einzigen Aufnahme.","bild":null},{"id":161,"title":"Prompt-Ingenieur als Projektanweisung","category":"Rollen & System-Prompts","prompt":"You are an expert prompt engineer.\nYour task is to convert any basic user input into a highly optimized, structured prompt that generates the best possible output.\n\nWhenever I give you an idea, you will:\n1. Understand the intent behind the request\n2. Clearly define the goal\n3. Add necessary context and assumptions\n4. Specify the ideal output format (e.g., list, script, table)\n5. Enhance clarity, depth, and creativity\n6. Remove ambiguity and improve precision\n\nStructure your response as:\n[Optimized Prompt] \u2013 Write a detailed, high-quality prompt based on the input.\n[Optional Suggestions] \u2013 Provide tips or variations to improve the outcome.\n\nRules:\n\u2022 Keep the prompt clear yet powerful\n\u2022 Ensure outputs are practical and usable\n\u2022 Avoid vague or generic phrasing","model":"ChatGPT","rating":5,"datum":"2026-09-12","postdatum":"","tags":"#promptengineering #system #projekt","source":"PDF \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Nicht in den Chat tippen, sondern in ChatGPT unter Projekte als Projektanweisung hinterlegen. Danach reicht in jedem Chat dieses Projekts eine grobe Idee, und es kommt ein ausformulierter Prompt zur\u00fcck.","bild":null},{"id":162,"title":"Sprachausgabe nat\u00fcrlicher machen","category":"Video & Bewegtbild","prompt":"Generate this voice with:\n\n- Natural conversational pacing\n- Realistic pauses\n- Emotional variation\n- Human-like breathing patterns\n- Clear pronunciation\n- Consistent vocal identity\n\nAvoid robotic delivery.","model":"ChatGPT","rating":3,"datum":"2026-09-12","postdatum":"","tags":"#stimme #tts #vertonung","source":"PDF \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Zusatzanweisung f\u00fcr Sprachmodelle wie OpenVoice oder Coqui XTTS. Die PDF beschreibt daneben den lokalen Aufbau; wichtigster Hinweis daraus: 10\u201330 Sekunden sauberes Referenzmaterial reichen, und fremde Stimmen nur mit Erlaubnis klonen.","bild":null},{"id":163,"title":"Pers\u00f6nliches Stilbuch (Langfassung)","category":"Alltag & Produktivit\u00e4t","prompt":"LUXURY PERSONAL STYLE BOOK\n\nYou are a luxury personal stylist, celebrity image consultant, body shape expert, fashion editor, editorial designer, and wardrobe consultant.\nI am uploading multiple full-body photos of myself taken in natural light.\nYour job is to perform a complete luxury wardrobe and style consultation.\nThe finished result should feel like a personalized style book, not a fashion mood board.\n\nMOST IMPORTANT INSTRUCTION\nThe ONLY person that may appear anywhere in this style guide is ME.\nUse ONLY my uploaded photographs. Never replace me with another person. Never substitute a stock model. Never generate another face.\nEvery outfit mockup, hairstyle, styling example, body proportion example, front view, side view, back view, clothing recommendation, and wardrobe visualization must use MY ACTUAL FACE.\nMaintain my exact facial proportions, eye shape, nose, lips, eyebrows, smile, hairline, body proportions, height proportions, shoulder width, waist, legs and overall silhouette.\nDo not make me thinner. Do not make me curvier. Do not lengthen my legs. Do not change my body. Do not change my face.\nOnly change clothing, hairstyles, colors, accessories, shoes and jewelry.\n\nSTYLE ANALYSIS\nBefore designing anything, analyze body proportions, vertical line, shoulder width, waist placement, hip width, leg length, torso length, body balance, face shape, coloring, lifestyle and overall aesthetic.\nBase every recommendation on my actual body rather than generic styling rules.\n\nDESIGN STYLE\nLuxury editorial, quiet luxury, minimal, magazine quality. Warm ivory background, dark olive headings, warm taupe accents, elegant serif typography, minimal sans-serif body text, large photography, professional spacing, soft shadows, modern layouts.\nNo AI collage aesthetic. No busy graphics. No clip art.\n\nPAGE 1 \u2014 Your Style Direction\nLarge editorial title. Use MY body wearing one complete signature outfit, plus front, side, back and three-quarter angle. Determine style identity, overall aesthetic, body type, best proportions and styling direction. Finish with a colour palette that complements me.\n\nPAGE 2 \u2014 Best Tops, Layers & Necklines\nShow 4\u20136 outfit examples on my own body and explain why each silhouette flatters my proportions.\n\nPAGE 3 \u2014 Best Bottoms, Lengths & Proportions\nDress me in different rises, inseams, cuts and skirts. Explain best rise, best hem, best lengths and why each works.\n\nPAGE 4 \u2014 Outfit Formulas That Actually Work\nComplete outfits for everyday occasions, each including shoes, jewellery, bag, layers and accessories.\n\nPAGE 5 \u2014 Your Capsule Wardrobe\nA beautifully organized capsule wardrobe where everything coordinates: tops, layers, trousers, dresses, shoes, outerwear, jewellery, bags, belts.\n\nPAGE 6 \u2014 My Signature Style\nA luxury editorial mood board with three complete signature outfits, then my style formula: colour season, style identity, best silhouettes, fabrics, necklines, accessories and signature outfit formula.\n\nIMAGE QUALITY REQUIREMENTS\nEvery image must feature MY ACTUAL FACE and MY body proportions across every page. Realistic editorial photography, no beauty filters, no generic models, no unrealistic body changes.","model":"ChatGPT","rating":4,"datum":"2026-09-12","postdatum":"","tags":"#stil #mode #garderobe #beratung","source":"PDF \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Braucht Vorarbeit: ein Selfie ohne Make-up und Ganzk\u00f6rperaufnahmen von vorn, seitlich und hinten in enganliegender Kleidung, bei Tageslicht, ohne Filter und ohne Weitwinkel. Der lange Sperrblock gegen fremde Modelle ist kein Beiwerk \u2014 ohne ihn zeigt die KI fremde Personen in den Outfits.","bild":null},{"id":164,"title":"Stilberatung mit R\u00fcckfragen","category":"Alltag & Produktivit\u00e4t","prompt":"Act as an expert personal stylist, body-proportion analyst, and visual style-guide creator.\nI want a highly specific visual style guide based on my real body proportions, lifestyle, and personal style goals.\nThe goal is not to make me look like a model. The goal is to show what is most flattering on my actual body.\n\nStep 1: Ask for my photos\nFirst, ask me to upload 3 fitted body reference photos: front view, side view, and back view.\nPause and wait for the photos before continuing.\n\nStep 2: Ask me these questions\nWhat is your lifestyle right now?\nWhat season of life are you in?\nWhat 5 style words describe what you want?\nWhat do you want your style to communicate?\nWhat pieces do you love wearing?\nWhat never feels right on you?\nWhat has to be practical about your wardrobe?\nWhat climate or season are you dressing for?\nDo you have any modesty, comfort, or body concerns you want considered?\nIf you know it, what is your color season or preferred color palette?\nPause and wait for my answers before creating the guide.\n\nNon-negotiable body accuracy rules\nUse my body reference photos to preserve my real proportions as closely as possible.\nDo not make me taller, thinner, wider, curvier, more balanced, more model-like, more polished, or more symmetrical than I am.\nDo not shrink my waist, widen my shoulders, widen my hips, lengthen my legs, change my torso length, or give me a generic body.\nBody accuracy matters more than making the images look perfect.\n\nBefore creating the visual guide, analyze\nshoulder width; torso length; leg length relative to torso; vertical balance; shoulder-to-hip balance; natural waist placement; overall frame scale; best neckline shapes; best top hems; best layer lengths; best jean rise and hem length; best shorts length; best skirt and dress lengths; best fabrics, detail level, and silhouettes; what overwhelms my frame; what makes my body look most balanced.\n\nVisual guide requirements\nCreate a clean, modern, editorial carousel-style guide.\nSlide 1: Style Direction \u2014 style identity, summary, most important balancing principle, mini colour palette, 5 style essentials.\nSlide 2: Best Tops, Layers and Necklines \u2014 with short notes explaining why each works.\nSlide 3: Best Bottoms and Proportions \u2014 jean shape, rise, hem length, shorts length.\nSlide 4: Outfit Formulas That Work \u2014 2 casual and 2 slightly dressy.\nSlide 5: Dress Options That Work for You \u2014 necklines, shaping placement, hem length, sleeves.\nSlide 6: Your Best Proportion Chart \u2014 one large chart slide using clean clothing diagrams instead of people.\nOptional Slide 7: What to Skip for Now \u2014 what fights my proportions and what to choose instead. Keep it kind and practical.\n\nImportant output rules\nDo not give generic body-type advice. Base everything on my actual proportions.\nDo not make every look beige basics. Do not overcorrect into boring safe styling.","model":"ChatGPT","rating":4,"datum":"2026-09-12","postdatum":"","tags":"#stil #mode #proportionen #beratung","source":"DOCX \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Die k\u00fcrzere Schwester der Langfassung. Unterschied: Sie stellt erst zehn Fragen zu Alltag und Vorlieben, bevor sie etwas entwirft \u2014 dadurch trifft das Ergebnis besser. Slide 6 mit Kleidungsdiagrammen statt Personen ist der eigentlich n\u00fctzliche Teil.","bild":null},{"id":165,"title":"Second Brain: erst recherchieren, dann bauen","category":"Agenten & Automatisierung","prompt":"research how people are building second brain / memory systems for claude code right now - reddit, x, youtube, hacker news, the lot. whats actually working, whats hype. then scan my whole workspace and describe how my files, folders and memory are organised today. combine the two into a short plan for a second brain that fits THIS workspace. before you build anything, ask me at least 3 questions about how i actually work.","model":"Claude","rating":4,"datum":"2026-09-12","postdatum":"","tags":"#secondbrain #memory #recherche #claudecode","source":"PDF \u201e\u0001\u201c, RoboNuggets \u2014 iCloud-Ordner AI","notes":"Erster von f\u00fcnf Schritten. Der Kniff ist der Schlusssatz: Die R\u00fcckfragen zwingen dazu, die eigene Arbeitsweise offenzulegen \u2014 daran scheitern sonst alle Standardl\u00f6sungen.","bild":null},{"id":166,"title":"Second Brain: bestehende Projekte auswerten","category":"Agenten & Automatisierung","prompt":"before building, study these four open source memory projects: karpathy's llm wiki (gist.github.com/karpathy/442a6bf555914893e9891c11519de94f), qmd by tobi lutke (github.com/tobi/qmd), garry tan's gbrain (github.com/garrytan/gbrain), and graphify (github.com/safishamsi/graphify). for each one tell me what idea is worth stealing for MY setup and what to skip - with reasons. dont copy any of them wholesale. then update the build plan. ask me 3 questions if anything about my workspace is unclear.","model":"Claude","rating":4,"datum":"2026-09-12","postdatum":"","tags":"#secondbrain #memory #vorbilder","source":"PDF \u201e\u0001\u201c, RoboNuggets \u2014 iCloud-Ordner AI","notes":"Vier Vorbilder: Karpathys LLM-Wiki (schlichtes Markdown mit kleinem Index), qmd (Suche nach Bedeutung), gbrain (Antworten mit Quellenangabe), Graphify (Notizen als Graph).","bild":null},{"id":167,"title":"Second Brain: Suche als Code statt als Modellaufruf","category":"Agenten & Automatisierung","prompt":"build the retrieval path as plain deterministic code, not model calls. it should: strip my question to keywords, score every candidate source from the index WITHOUT opening files, open only the single best file, pull only the section that answers, and follow one pointer if that section points elsewhere. the model only gets involved at the very end, with the evidence already attached. also give me one simple command that stores a new memory - writes the file and updates the index in one step, no model needed.","model":"Claude","rating":5,"datum":"2026-09-12","postdatum":"","tags":"#secondbrain #retrieval #kosten #claudecode","source":"PDF \u201e\u0001\u201c, RoboNuggets \u2014 iCloud-Ordner AI","notes":"Hier liegt die Ersparnis: Der Suchweg braucht keine Intelligenz und l\u00e4uft als normaler Code in Millisekunden. Das Modell wird genau einmal aufgerufen, ganz am Ende, mit den Belegen schon im Gep\u00e4ck.","bild":null},{"id":168,"title":"Second Brain: kleiner Index \u00fcber alles","category":"Agenten & Automatisierung","prompt":"set up a single small index file that catalogues every memory in one line each - name, link, one-sentence description. make saving a new memory automatically add its index line so the catalogue can never drift from reality. then add a short routing note to my claude md so every session knows: check the index first, open files second.","model":"Claude","rating":5,"datum":"2026-09-12","postdatum":"","tags":"#secondbrain #index #memory","source":"PDF \u201e\u0001\u201c, RoboNuggets \u2014 iCloud-Ordner AI","notes":"Die eine Gewohnheit, die alles tr\u00e4gt: Jede neue Tatsache bekommt eine Datei und eine Zeile im Verzeichnis. Nur weil das Verzeichnis immer stimmt, kann Code raten, wo eine Antwort liegen m\u00fcsste, ohne Dateien zu \u00f6ffnen.","bild":null},{"id":169,"title":"Second Brain: sich selbst beweisen lassen","category":"Agenten & Automatisierung","prompt":"now prove the system works. design a fair test: the same real questions from my workspace answered by a fresh default session vs the second brain path. compare tokens with /context and wall time for both sides, and check the answers are actually correct. if the brain doesnt clearly win, keep optimising and retesting until it does. show me the results in a simple table.","model":"Claude","rating":5,"datum":"2026-09-12","postdatum":"","tags":"#secondbrain #test #nachweis","source":"PDF \u201e\u0001\u201c, RoboNuggets \u2014 iCloud-Ordner AI","notes":"Ehrliches Ergebnis laut Guide: Bei Tatsachen, die ohnehin im geladenen Index stehen, ist die Standardsitzung genauso schnell. Der Vorsprung entsteht bei Dingen tief in Dateien, bei Fragen \u00fcber mehrere Dateien hinweg und beim Speichern.","bild":null},{"id":170,"title":"Selbstpr\u00fcfung per /goal erzwingen","category":"Agenten & Automatisierung","prompt":"/goal make sure that moving things around and switching views in the interface never lags for me. actually load it and check your own work - dont just assume. keep optimising until its smooth.\n\n/goal every time i reload this it has to be ready in under ten seconds. verify by reloading it yourself and timing it, and continuously optimise the whole thing until it consistently hits that.\n\n/goal dont stop until the retrieval system is clearly faster and cheaper than default, verified by real tests you run yourself - and have the test prompts ready for me so i can rerun them anytime.","model":"Claude","rating":4,"datum":"2026-09-12","postdatum":"","tags":"#goal #qualitaet #selbsttest #claudecode #shortcut","source":"PDF \u201e\u0001\u201c, RoboNuggets \u2014 iCloud-Ordner AI","notes":"Drei Beispiele f\u00fcr denselben Kniff: eine harte Bestehensgrenze plus die Erlaubnis weiterzuarbeiten, bis sie erreicht ist. Laut Guide der Handgriff mit dem gr\u00f6\u00dften Qualit\u00e4tssprung, vor allem bei allem Anklickbaren.","bild":null},{"id":171,"title":"Anthropics Finance-Agents einrichten","category":"Agenten & Automatisierung","prompt":"Richte mir Anthropics Finance-Agents f\u00fcr Claude Code ein und bring den ersten davon zum Laufen. Arbeite die f\u00fcnf Schritte der Reihe nach ab. Sprich Deutsch mit mir, Befehle bleiben englisch.\n\nSCHRITT 1: AKTUELLEN STAND SELBST NACHSEHEN\nDie Sammlung wird weiterentwickelt, Namen und Befehle \u00e4ndern sich. Arbeite deshalb nicht aus dem Ged\u00e4chtnis, sondern hol dir zuerst den echten Stand:\n- Lies die README des offiziellen Repos anthropics/financial-services auf GitHub, Branch main.\n- Lies zus\u00e4tzlich die Datei .claude-plugin/marketplace.json in diesem Repo. Dort stehen die Plugins mit ihren exakten Namen und der Name des Marketplace selbst.\n- Halte fest: der genaue Befehl zum Hinzuf\u00fcgen des Marketplace, die exakte Schreibweise der Plugin-Namen und wie der Marketplace hinter dem @-Zeichen heisst.\n- Fasse mir in zwei S\u00e4tzen zusammen, was du gefunden hast, BEVOR du irgendetwas installierst.\n\nSCHRITT 2: MEINEN RECHNER PR\u00dcFEN\n- Pr\u00fcfe, ob Claude Code installiert ist und in welcher Version.\n- Pr\u00fcfe, ob der Befehl claude plugin verf\u00fcgbar ist.\nFehlt etwas, sag mir in einfachen Worten, was ich tun muss, und warte auf meine Antwort. Installiere nichts Grosses ungefragt.\n\nSCHRITT 3: EINRICHTEN\n- F\u00fcge den Marketplace hinzu.\n- Installiere zuerst das Kern-Skill-Bundle mit den Finanzmodellen, danach die drei Agents, die f\u00fcr Privatanleger wirklich sinnvoll sind: Market Researcher, Earnings Reviewer und Model Builder.\n- Nimm die Plugin-Namen exakt so, wie du sie in Schritt 1 gefunden hast.\n- Sag mir vor jedem Befehl in einem Satz, was er bewirkt. Dann f\u00fchr ihn aus.\n- Pr\u00fcfe danach, ob die Plugins wirklich registriert sind, und zeig mir das Ergebnis.\n\nSCHRITT 4: DEN ERSTEN AGENT LAUFEN LASSEN\nFrag mich nach einer Aktie, die mich interessiert. Nutze dann den Market Researcher f\u00fcr genau diese Aktie.\n\nSCHRITT 5: ABNAHME\nZeig mir zum Schluss: welche Plugins installiert sind, welche Slash-Befehle mir zur Verf\u00fcgung stehen, die zwei bis drei Befehle f\u00fcr den Alltag in einfachen Worten, und was ich tun muss, wenn ich sp\u00e4ter weitere Agents dazunehmen will.\n\nREGELN F\u00dcR DICH\n- Erfinde keine Plugin-Namen und keine Befehle. Was du nicht in der offiziellen Quelle aus Schritt 1 gefunden hast, f\u00fchrst du nicht aus.\n- Sag vor jedem Befehl, der etwas installiert oder ver\u00e4ndert, in einem Satz was er tut.\n- Wenn etwas fehlschl\u00e4gt: lies die Fehlermeldung, schau in die README, und probier den dokumentierten Weg. Rate nicht.\n- Denk daran und sag es mir auch: Diese Agents liefern Entw\u00fcrfe zur Pr\u00fcfung, keine Anlageberatung.","model":"Claude","rating":4,"datum":"2026-09-12","postdatum":"","tags":"#finanzen #agents #claudecode #einrichtung","source":"PDF \u201e\u0001\u201c, rockAI \u2014 iCloud-Ordner AI","notes":"Von Hand sind es f\u00fcnf Zeilen: claude plugin marketplace add anthropics/financial-services, dann install financial-analysis@, market-researcher@, earnings-reviewer@ und model-builder@claude-for-financial-services. Ohne das Bundle financial-analysis fehlt den Agents das Handwerkszeug.","bild":null},{"id":172,"title":"Nachrichtenlage zu einer Aktie","category":"Analyse & Recherche","prompt":"Nutze den Market Researcher Agent f\u00fcr [AKTIE ODER TICKER].\nGeh die Nachrichtenlage der letzten 30 Tage durch und gib mir:\n1. Die 5 wichtigsten Meldungen, je einen Satz\n2. Pro Meldung: zieht das den Kurs eher nach oben oder nach unten, und warum\n3. Eine Gesamteinsch\u00e4tzung der Stimmung in einem Satz\n4. Welche Termine in den n\u00e4chsten 4 Wochen anstehen\nSchreib in einfachem Deutsch, ohne Finanzjargon. Wenn du etwas nicht sicher belegen kannst, schreib das ausdr\u00fccklich dazu.","model":"Claude","rating":4,"datum":"2026-09-12","postdatum":"","tags":"#finanzen #aktien #nachrichten #agent","source":"PDF \u201e\u0001\u201c, rockAI \u2014 iCloud-Ordner AI","notes":"Braucht den installierten Market-Researcher-Agent. Ohne Anbindung an einen Profi-Datenanbieter arbeitet er mit dem, was Claude sonst erreicht.","bild":null},{"id":173,"title":"Quartalszahlen verst\u00e4ndlich zusammenfassen","category":"Analyse & Recherche","prompt":"Nutze den Earnings Reviewer Agent f\u00fcr die letzten Quartalszahlen von [AKTIE ODER TICKER].\nGib mir:\n1. Die drei wichtigsten Zahlen und ob sie \u00fcber oder unter den Erwartungen lagen\n2. Was das Management zum Ausblick gesagt hat\n3. Die Kernfrage in einem Satz: muss ich mir Sorgen machen oder kann ich entspannt bleiben?\n4. Zwei Dinge, auf die ich beim n\u00e4chsten Quartal achten sollte\nErkl\u00e4r es so, als w\u00e4re ich kein Analyst. Keine Empfehlung zum Kaufen oder Verkaufen, nur Einordnung.","model":"Claude","rating":4,"datum":"2026-09-12","postdatum":"","tags":"#finanzen #quartalszahlen #earnings #agent","source":"PDF \u201e\u0001\u201c, rockAI \u2014 iCloud-Ordner AI","notes":"Arbeitet sich durch Bericht und Earnings-Call. Punkt 3 ist der eigentliche Nutzen: eine klare Antwort statt einer Zahlenwand.","bild":null},{"id":174,"title":"DCF-Bewertungsmodell in Excel","category":"Analyse & Recherche","prompt":"Nutze den Model Builder Agent und bau mir ein DCF-Modell f\u00fcr [AKTIE ODER TICKER] in Excel.\nAnforderungen:\n- Alle Annahmen in eigene, klar beschriftete Zellen (Wachstum, Marge, Abzinsungssatz)\n- Sensitivit\u00e4ts-Tabelle: fairer Wert bei verschiedenen Wachstums- und Zinsannahmen\n- Ein Blatt \"Zusammenfassung\" mit dem Ergebnis in zwei S\u00e4tzen auf Deutsch\n- Quellen f\u00fcr jede Eingangszahl in einer Kommentarspalte\nSag mir am Ende ehrlich, wie belastbar das Modell ist und welche Annahme das Ergebnis am st\u00e4rksten verschiebt.","model":"Claude","rating":5,"datum":"2026-09-12","postdatum":"","tags":"#finanzen #dcf #bewertung #excel","source":"PDF \u201e\u0001\u201c, rockAI \u2014 iCloud-Ordner AI","notes":"Sagt nicht, was eine Aktie wert ist, sondern was sie unter den eingetragenen Annahmen wert w\u00e4re. Die Sensitivit\u00e4ts-Tabelle ist der Teil, der das ehrlich macht.","bild":null},{"id":175,"title":"Urlaub: alle Buchungswege vergleichen","category":"Alltag & Produktivit\u00e4t","prompt":"Vergleiche f\u00fcr [ZIEL, z.B. Gardasee], [PERSONEN, z.B. 4], [DAUER, z.B. 7 N\u00e4chte] die realistischen Buchungswege: Pauschalreise, Hotel und Anreise getrennt, Direktbuchung beim Hotel, kleinere Anbieter. Pro Weg in dieser Struktur: wann er sich lohnt, wann nicht, welche Kosten typisch dazukommen, welche Stolperfalle es gibt. Schliesse mit einer klaren Empfehlung, welcher Weg f\u00fcr meinen Fall am ehesten passt und warum.","model":"ChatGPT","rating":4,"datum":"2026-09-12","postdatum":"","tags":"#reise #urlaub #buchung #vergleich","source":"DOCX \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Setzt vor die Hotelsuche die Frage, \u00fcber welchen Weg \u00fcberhaupt gebucht werden sollte.","bild":null},{"id":176,"title":"Urlaub: g\u00fcnstigere Unterkunft mit gleichem Komfort","category":"Alltag & Produktivit\u00e4t","prompt":"Finde mir g\u00fcnstigere Unterk\u00fcnfte f\u00fcr [ZIEL, z.B. Gardasee], [PERSONEN, z.B. 2 Erwachsene, 2 Kinder], [DAUER, z.B. 7 N\u00e4chte], die [REFERENZHOTEL oder WUNSCH, z.B. ein Hotel am See mit Pool] im Komfort nahekommen. Wichtig sind mir: [z.B. Familienzimmer, Fr\u00fchst\u00fcck, ruhige Lage]. Zeig mir die Top 3 nach Preis und Leistung. Pro Option in dieser Struktur: Name und Lage, was vergleichbar ist, wo es Abstriche gibt, warum sie trotzdem auf der Liste steht. Gib am Ende deine Empfehlung.","model":"ChatGPT","rating":4,"datum":"2026-09-12","postdatum":"","tags":"#reise #hotel #preis #vergleich","source":"DOCX \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Funktioniert am besten mit einem konkreten Referenzhotel als Messlatte.","bild":null},{"id":177,"title":"Urlaub: besten Reisezeitpunkt finden","category":"Alltag & Produktivit\u00e4t","prompt":"Du bist ein erfahrener Reiseplaner. Hilf mir, den g\u00fcnstigsten Reisezeitpunkt zu finden. Mein Plan: [ZIEL, z.B. Gardasee] mit [PERSONEN, z.B. 2 Erwachsene, 2 Kinder]. Ich bin flexibel im Zeitfenster von [X TAGEN, z.B. 14 Tagen] rund um [ZIELDATUM, z.B. Anfang August]. Zeig mir die 3 g\u00fcnstigsten Zeitfenster. Pro Fenster in dieser Struktur: Zeitraum, warum g\u00fcnstiger (Nebensaison, Wochentag, Ferien anderer L\u00e4nder), Wetter und Andrang, f\u00fcr wen geeignet. Nenne danach 1 Zeitfenster, das die meisten Familien \u00fcbersehen. Wenn dir aktuelle Preise fehlen, sag das offen und arbeite mit typischen Saisonmustern.","model":"ChatGPT","rating":4,"datum":"2026-09-12","postdatum":"","tags":"#reise #zeitpunkt #nebensaison","source":"DOCX \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Der Schlusssatz ist wichtig: Ohne ihn erfindet die KI Preise, statt mit Saisonmustern zu arbeiten.","bild":null},{"id":178,"title":"Urlaub: versteckte Kosten aufdecken","category":"Alltag & Produktivit\u00e4t","prompt":"Du bist ein kritischer Reise-Pr\u00fcfer. Schl\u00fcssele f\u00fcr diese Reise [DETAILS, z.B. 1 Woche Hotel am Gardasee, 4 Personen, eigenes Auto] alle Zusatzkosten auf, die im beworbenen Preis oft fehlen: Kurtaxe, Endreinigung, Parken, Gep\u00e4ck, Transfers, Verpflegung, Storno. Pro Posten: \u00fcblicher Preisrahmen und eine legale Strategie, ihn zu senken oder zu vermeiden. Stelle am Ende beworbenen Preis und realistischen Endpreis gegen\u00fcber und nenne die 3 Kostenfallen, die Anbieter am liebsten verstecken.","model":"ChatGPT","rating":5,"datum":"2026-09-12","postdatum":"","tags":"#reise #kosten #nebenkosten","source":"DOCX \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Die Gegen\u00fcberstellung von beworbenem und realistischem Endpreis am Schluss ist der eigentliche Ertrag.","bild":null},{"id":179,"title":"Urlaub: echte Angebote von Lockmitteln unterscheiden","category":"Alltag & Produktivit\u00e4t","prompt":"Erkl\u00e4re mir zwei Dinge f\u00fcr [ZIEL oder ANBIETER, z.B. ein Hotel am Gardasee]: erstens, wo ich seri\u00f6s nach aktuellen Rabatten und Aktionen suche. Zweitens, woran ich ein echtes Angebot von einem Lockmittel unterscheide. Nenne die typischen Fake-Muster, die Reiseportale zeigen, aber die nie funktionieren, und woran ich sie sofort erkenne. Falls du \u00fcber die Suche aktuelle Aktionen findest, liste sie mit Quelle und Bedingung und kennzeichne klar, was du nicht verifizieren konntest.","model":"ChatGPT","rating":4,"datum":"2026-09-12","postdatum":"","tags":"#reise #angebote #rabatt #skepsis","source":"DOCX \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Verlangt ausdr\u00fccklich die Kennzeichnung dessen, was nicht \u00fcberpr\u00fcft werden konnte.","bild":null},{"id":180,"title":"Urlaub: Ziele zum Budget statt Budget zum Ziel","category":"Alltag & Produktivit\u00e4t","prompt":"Dreh die Reiseplanung um. Ich nenne dir mein Budget, du nennst mir die besten Ziele. Mein Rahmen: Budget gesamt: [z.B. 1.200 Euro f\u00fcr alles]. Personen: [z.B. 2 Erwachsene]. Dauer und Zeitraum: [z.B. 1 Woche im Oktober]. Start: [z.B. ab Frankfurt]. Was mir wichtig ist: [z.B. W\u00e4rme, Strand, kurze Flugzeit, gutes Essen]. Schlag mir 4 Ziele vor, vom g\u00fcnstigsten aufw\u00e4rts. Pro Ziel in dieser Struktur: Ziel und warum es ins Budget passt, grobe Aufteilung in Anreise, Unterkunft und Vor Ort, was den Preis dr\u00fcckt, ein ehrlicher Haken. Nenne zum Schluss das Ziel mit dem besten Verh\u00e4ltnis aus Erlebnis und Preis. Wenn dir aktuelle Preise fehlen, arbeite mit typischen Richtwerten und sag das.","model":"ChatGPT","rating":4,"datum":"2026-09-12","postdatum":"","tags":"#reise #budget #ziele","source":"DOCX \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Umgekehrte Reiseplanung: Budget rein, Zielvorschl\u00e4ge raus. Der \u201e\u0001\u201c pro Ziel verhindert Hochglanzantworten.","bild":null},{"id":181,"title":"Thermomix TM7: Rezepte umbauen (Master-Prompt)","category":"Rollen & System-Prompts","prompt":"Du bist mein pers\u00f6nlicher Thermomix TM7 Rezept-Assistent. Ich gebe dir normale Rezepte aus Websites, Kochb\u00fcchern, Screenshots, Fotos oder als freien Text. Deine Aufgabe ist nicht, das urspr\u00fcngliche Rezept lediglich mit Thermomix-Einstellungen zu erg\u00e4nzen. Entwickle daraus einen vollst\u00e4ndigen, logisch aufgebauten und komfortablen TM7-Workflow, der von der ersten Zutat bis zum Servieren funktioniert.\n\nPRIORIT\u00c4TEN\nTechnisch korrekt und sicher. Geschmack, Konsistenz und Kochlogik des Originals bewahren. Wenig Geschirr und unn\u00f6tige Arbeit. Effiziente Reihenfolge und sinnvolle Parallelisierung. Kurze, scanbare Darstellung.\n\nZUERST DEN GESAMTEN WORKFLOW PLANEN\nAnalysiere intern das vollst\u00e4ndige Rezept, bevor du die Anleitung ausgibst. Plane Zust\u00e4nde und \u00dcberg\u00e4nge: Was ist im Mixtopf? Was bleibt darin? Was muss heraus? Wann muss gesp\u00fclt oder getrocknet werden? Welches Zubeh\u00f6r ist wann eingesetzt? Welche Zutaten k\u00f6nnen gemeinsam verarbeitet werden? Welche m\u00fcssen ihre Struktur behalten, ist Linkslauf n\u00f6tig? Wann muss mit dem Spatel nach unten geschoben werden? Was kann w\u00e4hrend einer laufenden Garzeit vorbereitet werden? Kann ein Kapazit\u00e4tsproblem durch Mehr-Ebenen-Garen mit Mixtopf, Gareinsatz und Varoma gel\u00f6st werden, bevor ein zweiter Kochdurchgang geplant wird?\n\nORIGINALREZEPT BEWAHREN\nZutaten und Mengen vollst\u00e4ndig \u00fcbernehmen. Geschmacksprofil, Garziel und Konsistenz erhalten. Nur das Verfahren anpassen. Zutaten oder Mengen nie stillschweigend ver\u00e4ndern. Bei echter Unklarheit nachfragen.\n\nEIGENST\u00c4NDIGE SCHRITTE\nBeginne immer direkt mit # Zutaten, danach # Zubereitung. Jeder Schritt enth\u00e4lt alles, was genau jetzt gebraucht wird: Menge, Zutat, Vorbereitung, Zielbeh\u00e4lter, Zubeh\u00f6r, Modus, Zeit, Temperatur, Stufe oder Intensit\u00e4t, Linkslauf und Folgehandlung.\nNicht: \"Zwiebel und Knoblauch in den Mixtopf geben.\"\nSondern: \"120 g Zwiebel, halbiert, und 2 Knoblauchzehen in den Mixtopf geben.\"\n\nMIXTOPF-STATUS L\u00dcCKENLOS F\u00dcHREN\nHalte \u00fcber das ganze Rezept fest, ob der Inhalt bleibt, umgef\u00fcllt, geleert, gesp\u00fclt oder gesp\u00fclt und getrocknet wird und welches Zubeh\u00f6r ein- oder abgesetzt ist. Wenn etwas heraus muss, geh\u00f6rt das direkt in die Handlung.\n\nDEN RICHTIGEN MODUS W\u00c4HLEN\nPr\u00fcfe bei jedem maschinellen Schritt zuerst, ob ein TM7-Spezialmodus passt: Anbraten, Offenes Kochen, Dampfgaren, Teig kneten, P\u00fcrieren, Reis kochen, Andicken, Wasser erhitzen, Eier kochen, Slow Cooking, Sous-vide, Fermentieren. Manuelle Einstellungen nur, wenn kein Spezialmodus passt.\nModi und manuelle Einstellungen nicht vermischen: Werte niemals zwischen ihnen \u00fcbertragen. Nenne ausschlie\u00dflich Werte, die in diesem Modus tats\u00e4chlich w\u00e4hlbar sind.\n\nFACHREGELN\nAnbraten: Modus zuerst pr\u00fcfen, Tomatenmark vor Fl\u00fcssigkeitszugabe anr\u00f6sten, sehr wasserhaltige Zutaten getrennt verarbeiten.\nLinkslauf: bei Reis, Pasta, Gem\u00fcsew\u00fcrfeln, Pilzen, H\u00fclsenfr\u00fcchten und empfindlichen Einlagen erw\u00e4gen, nicht automatisch einsetzen.\nZerkleinern: Vorbereitungsarbeit in den Workflow integrieren statt fein geschnittene Zutaten vorauszusetzen. Wenn gleichm\u00e4\u00dfige St\u00fccke wirklich relevant sind, zwei Wege anbieten (von Hand schneiden vs. TM7 kurz zerkleinern).\nTeig kneten nur f\u00fcr echte Knetteige. R\u00fchrteige und Cremes nur kurz vermischen.\nDampfgaren: den vollst\u00e4ndigen Aufbau beschreiben und Dampf\u00f6ffnungen nicht blockieren.\nMehr-Ebenen-Garen vor mehreren Kochdurchg\u00e4ngen pr\u00fcfen \u2014 aber nur, wenn die Zutaten keinen direkten Fl\u00fcssigkeitskontakt brauchen.\n\nAUSGABEFORMAT\n# Zutaten als Liste, dann # Zubereitung mit nummerierten Schritten. Pro Schritt: die Handlung im Klartext, darunter der TM7-Pfad, darunter die Einstellung (Zeit | Temperatur | Stufe), optional ein kurzer Hinweis. Schritte ohne Ger\u00e4teeinstellung bekommen keinen k\u00fcnstlichen TM7-Block. Icons sparsam und konsistent, pro Schritt m\u00f6glichst nur eines.\nSprache: kurz, eindeutig, handlungsorientiert. Keine Einleitung, kein Fazit, keine Begr\u00fcndungen f\u00fcr Modusentscheidungen.\n\nTECHNISCHE SICHERHEIT\nKeine TM7-Funktion, Einstellung, Temperatur, Geschwindigkeit oder Zubeh\u00f6rverwendung erfinden. Zuerst die offizielle Bedienungsanleitung pr\u00fcfen. Wenn daraus nicht eindeutig hervorgeht, ob ein Modus verf\u00fcgbar ist oder welche Werte erlaubt sind: nicht raten, sondern nachfragen.\n\nWICHTIGSTE GRUNDREGEL\nDenke nicht: \"Wie \u00fcbersetze ich diesen Satz in eine Thermomix-Einstellung?\" Denke: \"Wenn dieses Gericht ein professionell entwickeltes TM7-Rezept w\u00e4re, wie s\u00e4he der vollst\u00e4ndige, einfachste und logischste Ablauf von der ersten Zutat bis zum Servieren aus?\"","model":"ChatGPT","rating":5,"datum":"2026-09-12","postdatum":"","tags":"#thermomix #tm7 #kochen #rezepte #system","source":"PDF \u201e\u0001\u201c \u2014 iCloud-Ordner AI","notes":"Als Wissensdatei in ein eigenes KI-Rezeptprojekt legen, zusammen mit der offiziellen TM7-Bedienungsanleitung \u2014 ohne die r\u00e4t das Modell bei Modi und Werten. Kernidee: nicht Satz f\u00fcr Satz \u00fcbersetzen, sondern den Ablauf neu denken. Unabh\u00e4ngig und inoffiziell, nicht von Vorwerk.","bild":null},{"id":182,"title":"Designfehler im Raumfoto finden und beheben","category":"Interior & Raumdesign","prompt":"Analyze this uploaded room photo like a professional interior designer doing a full design audit.\n\nIdentify the biggest visual problems, including awkward furniture placement, clutter, poor scale, weak lighting, empty areas, mismatched colors, bad proportions, and anything making the room feel unfinished or outdated.\n\nThen redesign the space while keeping the actual architecture, doors, windows, dimensions, and fixed elements realistic.\n\nPrioritize the changes that would make the biggest visual difference first, and explain exactly what should change and why.","model":"ChatGPT","rating":4,"datum":"2026-09-12","postdatum":"2026-09-11","tags":"#interior #raumdesign #inneneinrichtung #raumfoto #redesign","source":"Instagram @getintoai - https://www.instagram.com/p/DdJvfkFmEPA/","notes":"Einstieg des Sets: erst Bestandsaufnahme, dann Umgestaltung. Bewahrt bewusst Architektur, T\u00fcren, Fenster und Ma\u00dfe. Quelle nennt als Modell GPT-6 Astra (Slide 1); die Prompts sind modellunabh\u00e4ngig nutzbar.","bild":"prompt_images/interior_astra_01.jpg"},{"id":183,"title":"Raum premium wirken lassen ohne Showroom-Effekt","category":"Interior & Raumdesign","prompt":"Redesign this uploaded room so it feels significantly more premium and professionally designed without making it flashy or unrealistic.\n\nUse refined materials, layered lighting, better furniture proportions, sophisticated color combinations, richer textures, elevated decor, and one or two tasteful statement pieces.\n\nKeep the existing structure of the room intact and reuse anything that already works.\n\nThe final result should feel like an expensive designer home, not a showroom.","model":"ChatGPT","rating":4,"datum":"2026-09-12","postdatum":"2026-09-11","tags":"#interior #raumdesign #inneneinrichtung #raumfoto #redesign","source":"Instagram @getintoai - https://www.instagram.com/p/DdJvfkFmEPA/","notes":"Gleiches Ziel wie #101 aus dem Post DcdvYJ8lY1Z, aber anders formuliert: hier ohne Budgetfokus, daf\u00fcr mit der Vorgabe, Vorhandenes weiterzuverwenden. Quelle nennt als Modell GPT-6 Astra (Slide 1); die Prompts sind modellunabh\u00e4ngig nutzbar.","bild":"prompt_images/interior_astra_02.jpg"},{"id":184,"title":"M\u00f6belanordnung wie ein Raumplaner optimieren","category":"Interior & Raumdesign","prompt":"Study this room photo like an expert space planner.\n\nIdentify wasted space, blocked walkways, awkward furniture placement, poor spacing, oversized or undersized pieces, and anything hurting the flow of the room.\n\nThen create a better furniture arrangement that improves comfort, functionality, openness, and visual balance.\n\nKeep all visible walls, doors, windows, and actual room proportions unchanged.","model":"ChatGPT","rating":4,"datum":"2026-09-12","postdatum":"2026-09-11","tags":"#interior #raumdesign #inneneinrichtung #raumfoto #redesign","source":"Instagram @getintoai - https://www.instagram.com/p/DdJvfkFmEPA/","notes":"Reiner Layout-Prompt ohne Farb- oder Materialthemen. Verwandt mit #104 (Post DcdvYJ8lY1Z). Quelle nennt als Modell GPT-6 Astra (Slide 1); die Prompts sind modellunabh\u00e4ngig nutzbar.","bild":"prompt_images/interior_astra_03.jpg"},{"id":185,"title":"Komplette Farbpalette f\u00fcr einen Raum entwickeln","category":"Interior & Raumdesign","prompt":"Analyze this room and create a complete interior color palette specifically for the space.\n\nConsider the existing flooring, furniture, natural light, room size, architecture, and overall mood.\n\nRecommend the main wall color, secondary colors, accent tones, furniture finishes, curtain colors, rug tones, and decor accents.\n\nExplain how each color should be distributed throughout the room so everything feels cohesive, polished, and intentionally designed.","model":"ChatGPT","rating":4,"datum":"2026-09-12","postdatum":"2026-0 ave, what tools or access it would need, the main risks, and the easiest low-risk way to test it this week. Rank the opportunities by fastest win, biggest time savings, and lowest risk.","model":"ChatGPT","rating":4,"datum":"2026-09-12","postdatum":"2026-09-11","tags":"#produktivitaet #buero #automatisierung #agent #workflow","source":"Instagram @getintoai - https://www.instagram.com/p/DdIGtOuAU9R/","notes":"Einstiegs-Prompt des Sets: sortiert die eigenen Aufgaben nach Automatisierungspotenzial statt blind loszulegen. Die Sortierung nach schnellster Wirkung und geringstem Risiko ist der n\u00fctzliche Teil. Quelle nennt als Modell GPT-6 Astra (Slide 1); der Prompt ist modellunabh\u00e4ngig nutzbar. Setzt voraus, dass das Modell Zugriff auf die genannten Daten hat (Postfach, Kalender, Browser) \u2013 ohne Anbindung liefert es nur eine Struktur.","bild":"prompt_images/admin_astra_01.jpg"},{"id":190,"title":"Postfach sortieren und Antworten vorbereiten","category":"Alltag & Produktivit\u00e4t","prompt":"Open my inbox and review recent emails. Group them into urgent, important, low priority, newsletters, receipts, spam, and messages that need a reply. Highlight anything time-sensitive, unsubscribe me from low-value newsletters where it is safe to do so, draft reply suggestions for the messages that matter, and recommend folders or labels so the inbox stays organized going forward. End with a short summary of what needs my attention today.","model":"ChatGPT","rating":3,"datum":"2026-09-12","postdatum":"2026-09-11","tags":"#produktivitaet #buero #automatisierung #agent #workflow","source":"Instagram @getintoai - https://www.instagram.com/p/DdIGtOuAU9R/","notes":"Vorsicht beim Abmelden von Newslettern \u2013 das ist eine schreibende Aktion. Wer das nicht will, streicht den Satz zu unsubscribe vor dem Absenden. Quelle nennt als Modell GPT-6 Astra (Slide 1); der Prompt ist modellunabh\u00e4ngig nutzbar. Setzt voraus, dass das Modell Zugriff auf die genannten Daten hat (Postf
