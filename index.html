<html lang="de">
<head>
<meta charset="utf-8">

<meta name="description" content="Gesammelte KI-Prompts für Bild, Text, Analyse und Automatisierung — durchsuchbar nach Kategorie.">

<title>Prompt-Bibliothek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --papier:       #FAF9F7;
  --karte:        #FFFFFF;
  --rand:         #E3E0D9;
  --rand-stark:   #CFCBC1;
  --schrift:      #1E2026;
  --schrift-leise:#6B6A66;
  --akzent:       #0F6E6E;
  --auf-akzent:   #FFFFFF;
  --akzent-weich: #E4F0EE;
  --platzhalter:  #B0651F;
  --code-grund:   #F4F2ED;
  --schatten:     0 1px 2px rgba(30,32,38,.05);
  --lupe-grund:   rgba(12,13,16,.88);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier:       #14161A;
    --karte:        #1B1E24;
    --rand:         #2A2E36;
    --rand-stark:   #3A3F49;
    --schrift:      #E8E6E1;
    --schrift-leise:#9A988F;
    --akzent:       #4FC2B8;
    --auf-akzent:   #0B1B1A;
    --akzent-weich: #12302E;
    --platzhalter:  #E0A05A;
    --code-grund:   #15181D;
    --schatten:     0 1px 2px rgba(0,0,0,.3);
    --lupe-grund:   rgba(4,5,7,.92);
  }
}
:root[data-theme="dark"] {
  --papier:       #14161A;
  --karte:        #1B1E24;
  --rand:         #2A2E36;
  --rand-stark:   #3A3F49;
  --schrift:      #E8E6E1;
  --schrift-leise:#9A988F;
  --akzent:       #4FC2B8;
  --auf-akzent:   #0B1B1A;
  --akzent-weich: #12302E;
  --platzhalter:  #E0A05A;
  --code-grund:   #15181D;
  --schatten:     0 1px 2px rgba(0,0,0,.3);
  --lupe-grund:   rgba(4,5,7,.92);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--papier);
  color: var(--schrift);
  font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.55;
}
:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; border-radius: 3px; }

header {
  position: sticky; top: 0; z-index: 20;
  background: var(--papier);
  border-bottom: 1px solid var(--rand);
}
.kopf-innen { max-width: 1280px; margin: 0 auto; padding: 16px 24px 14px; }
.kopf-zeile { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
h1 {
  font-family: Archivo, "IBM Plex Sans", sans-serif;
  font-weight: 700; font-size: 21px; letter-spacing: -.015em;
  margin: 0; text-wrap: balance;
}
.zaehler { font-size: 13px; color: var(--schrift-leise); font-variant-numeric: tabular-nums; }
.suchfeld {
  flex: 1 1 260px; min-width: 220px;
  padding: 9px 13px;
  border: 1px solid var(--rand-stark); border-radius: 7px;
  background: var(--karte); color: var(--schrift);
  font: inherit; font-size: 14px;
}
.suchfeld::placeholder { color: var(--schrift-leise); }

.filter { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.filter + .filter { margin-top: 7px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 32px; padding: 5px 11px;
  border: 1px solid var(--rand-stark); border-radius: 6px;
  background: var(--karte); color: var(--schrift);
  font: inherit; font-size: 12.5px; cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.chip:hover { border-color: var(--akzent); }
.chip[aria-pressed="true"] {
  background: var(--akzent); border-color: var(--akzent);
  color: var(--auf-akzent); font-weight: 500;
}
.chip .n { font-variant-numeric: tabular-nums; opacity: .65; font-size: 11.5px; }
.reihe-titel {
  font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--schrift-leise); align-self: center; margin-right: 4px;
}

main { max-width: 1280px; margin: 0 auto; padding: 26px 24px 80px; }
.gruppe { margin-bottom: 40px; }
.gruppe-kopf {
  display: flex; align-items: baseline; gap: 10px;
  padding-bottom: 8px; margin-bottom: 16px;
  border-bottom: 2px solid var(--akzent);
}
.gruppe-kopf h2 {
  font-family: Archivo, sans-serif; font-weight: 600; font-size: 15px;
  letter-spacing: .01em; margin: 0;
}
.gruppe-kopf .n { font-size: 12.5px; color: var(--schrift-leise); font-variant-numeric: tabular-nums; }

.raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; align-items: start; }

.karte {
  background: var(--karte);
  border: 1px solid var(--rand);
  border-radius: 8px;
  box-shadow: var(--schatten);
  padding: 15px 16px 14px;
  display: flex; flex-direction: column; gap: 11px;
}
.karte-kopf { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.karte h3 {
  font-family: Archivo, sans-serif; font-weight: 600; font-size: 14.5px;
  line-height: 1.3; margin: 0; letter-spacing: -.005em; text-wrap: balance;
}
.kopieren {
  flex-shrink: 0; min-width: 34px; min-height: 32px;
  border: 1px solid var(--rand-stark); border-radius: 6px;
  background: transparent; color: var(--schrift-leise);
  cursor: pointer; font-size: 14px; line-height: 1;
  transition: border-color .12s, color .12s, background .12s;
}
.kopieren:hover { border-color: var(--akzent); color: var(--akzent); }
.kopieren.fertig { background: var(--akzent); border-color: var(--akzent); color: var(--auf-akzent); }

.bild {
  width: 100%; display: block; border-radius: 5px;
  border: 1px solid var(--rand); cursor: zoom-in;
}
pre.text {
  margin: 0;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 12px; line-height: 1.6;
  white-space: pre-wrap; word-break: break-word;
  background: var(--code-grund);
  border: 1px solid var(--rand);
  border-radius: 6px;
  padding: 11px 12px;
  max-height: 240px; overflow-y: auto;
  color: var(--schrift);
}
pre.text .ph { color: var(--platzhalter); font-weight: 500; }

.zeile { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; }
.modell {
  padding: 2px 8px; border-radius: 4px;
  background: var(--akzent-weich); color: var(--akzent);
  font-weight: 500; font-size: 11.5px;
}
.tag { color: var(--schrift-leise); }
.notiz { font-size: 12.5px; color: var(--schrift-leise); line-height: 1.5; }
.quelle { font-size: 11.5px; color: var(--schrift-leise); word-break: break-word; }
.quelle a { color: var(--akzent); text-decoration: none; }
.quelle a:hover { text-decoration: underline; }

.leer { padding: 60px 20px; text-align: center; color: var(--schrift-leise); }

#lupe {
  position: fixed; inset: 0; z-index: 50;
  background: var(--lupe-grund);
  display: flex; align-items: center; justify-content: center;
  padding: 28px; cursor: zoom-out;
}
#lupe img { max-width: 100%; max-height: 100%; border-radius: 6px; }

#hinweis {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: var(--schrift); color: var(--papier);
  padding: 9px 18px; border-radius: 7px; font-size: 13px; z-index: 60;
  box-shadow: 0 4px 18px rgba(0,0,0,.22);
}

@media (max-width: 640px) {
  .kopf-innen { padding: 14px 16px 12px; }
  main { padding: 20px 16px 60px; }
  .raster { grid-template-columns: 1fr; }
  .chip { min-height: 34px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="kopf-innen">
    <div class="kopf-zeile">
      <h1>Prompt-Bibliothek</h1>
      <span class="zaehler" id="zaehler"></span>
      <input type="search" class="suchfeld" id="suche" placeholder="Titel, Text, Schlagwort oder Quelle suchen&#8230;" aria-label="Prompts durchsuchen">
    </div>
    <div class="filter" id="filter-kat"></div>
    <div class="filter" id="filter-modell"></div>
  </div>
</header>

<main id="liste"></main>

ce":"Instagram @sifuyik \u2014 https://www.instagram.com/p/DcoLumEGIqE/","notes":"Warum es funktioniert: Vier konkrete Stellschrauben statt einer vagen Bitte um \u201ebesser\u201c.","bild":"prompt_images/chatgpt_photo_04.jpg"},{"id":5,"title":"St\u00f6rende Objekte entfernen","category":"Fotobearbeitung & Retusche","prompt":"Remove the [object/person] from this image and naturally fill the empty space so there are no visible editing traces.","model":"ChatGPT","rating":0,"tags":"retusche, entfernen, objekte","source":"Instagram @sifuyik \u2014 https://www.instagram.com/p/DcoLumEGIqE/","notes":"Warum es funktioniert: \u201eNo visible traces\u201c erzwingt echtes Nachbauen statt eines sichtbaren Flickens.","bild":"prompt_images/chatgpt_photo_05.jpg"},{"id":6,"title":"Text sauber ins Bild legen","category":"Fotobearbeitung & Retusche","prompt":"Add the text '[YOUR TEXT]' to this image using a bold, modern font. Position it professionally and ensure it complements the design.","model":"ChatGPT","rating":0,"tags":"text, typografie, overlay","source":"Instagram @sifuyik \u2014 https://www.instagram.com/p/DcoLumEGIqE/","notes":"Warum es funktioniert: Schriftart und Platzierung vorzugeben verhindert willkuerlich gesetzten Text.","bild":"prompt_images/chatgpt_photo_06.jpg"},{"id":7,"title":"Objekt umf\u00e4rben","category":"Fotobearbeitung & Retusche","prompt":"Change the color of [object] to [new color] while maintaining realistic lighting, reflections, textures, and shadows.","model":"ChatGPT","rating":0,"tags":"farbe, produkt, textur","source":"Instagram @sifuyik \u2014 https://www.instagram.com/p/DcoLumEGIqE/","notes":"Warum es funktioniert: Textur und Glanz bleiben erhalten, statt dass Farbe flach darueber gemalt wird.","bild":"prompt_images/chatgpt_photo_07.jpg"},{"id":8,"title":"Format f\u00fcr jede Plattform","category":"Fotobearbeitung & Retusche","prompt":"Resize this image to [dimensions/aspect ratio] while maintaining maximum quality, sharpness, and proper composition.","model":"ChatGPT","rating":0,"tags":"format, seitenverh\u00e4ltnis, social media","source":"Instagram @sifuyik \u2014 https://www.instagram.com/p/DcoLumEGIqE/","notes":"Warum es funktioniert: Der Hinweis auf die Komposition verhindert seltsame Anschnitte beim Skalieren.","bild":"prompt_images/chatgpt_photo_08.jpg"},{"id":9,"title":"Realistische Schatten erg\u00e4nzen","category":"Fotobearbeitung & Retusche","prompt":"Add realistic shadows to the subject so it blends naturally into the scene with accurate lighting direction and depth.","model":"ChatGPT","rating":0,"tags":"schatten, licht, montage","source":"Instagram @sifuyik \u2014 https://www.instagram.com/p/DcoLumEGIqE/","notes":"Warum es funktioniert: Schatten sind das, was ein Motiv ueberhaupt erst echt in einer Szene wirken laesst.","bild":"prompt_images/chatgpt_photo_09.jpg"},{"id":10,"title":"Bildstil komplett \u00e4ndern","category":"Fotobearbeitung & Retusche","prompt":"Transform this image into a [cinematic/anime/3D render/oil painting/illustration] style while preserving the subject and key details.","model":"ChatGPT","rating":0,"tags":"stil, anime, illustration","source":"Instagram @sifuyik \u2014 https://www.instagram.com/p/DcoLumEGIqE/","notes":"Warum es funktioniert: \u201ePreserving key details\u201c h\u00e4lt die Identitaet des Motivs fest.","bild":"prompt_images/chatgpt_photo_10.jpg"},{"id":11,"title":"Hintergrund unscharf stellen","category":"Fotobearbeitung & Retusche","prompt":"Blur the background of this image like it was shot with a professional camera lens, keeping the subject fully sharp and in focus.","model":"ChatGPT","rating":0,"tags":"bokeh, tiefensch\u00e4rfe, portrait","source":"Instagram @sifuyik \u2014 https://www.instagram.com/p/DcoLumEGIqE/","notes":"Warum es funktioniert: Der Verweis auf ein echtes Objektiv erzeugt echte Tiefensch\u00e4rfe statt eines Filters.","bild":"prompt_images/chatgpt_photo_11.jpg"},{"id":12,"title":"Alte Fotos restaurieren","category":"Fotobearbeitun 7HXtnRgw/","notes":"Anders als reines Restaurieren: Das Bild soll wirken, als w\u00e4re es heute mit guter Kamera entstanden.","bild":null},{"id":83,"title":"Ortswechsel bei gleicher Person","category":"Portr\u00e4t & Personen","prompt":"Keep me exactly recognizable from the uploaded photo, but completely change the environment to [location]. Make the lighting, shadows, perspective, reflections, atmosphere, clothing interaction, and background naturally match the new location. Photograph me as if I was genuinely there with a professional DSLR camera. Preserve realistic skin texture and natural facial details","model":"ChatGPT","rating":0,"tags":"hintergrund, ortswechsel, montage","source":"Instagram \u2014 https://www.instagram.com/p/Dcb7HXtnRgw/","notes":"Nur die Umgebung tauschen. Der Prompt z\u00e4hlt auf, was mitwandern muss: Licht, Schatten, Spiegelungen, sogar der Faltenwurf der Kleidung.","bild":null},{"id":84,"title":"Bewerbungsfoto f\u00fcr LinkedIn","category":"Portr\u00e4t & Personen","prompt":"Transform my uploaded photo into a professional headshot suitable for LinkedIn, a company website, or a personal brand. Keep my face, facial structure, skin tone, hairstyle, and identity recognizable and natural. Use clean professional lighting, realistic skin texture, natural expression, subtle background separation, sharp facial details, and polished composition. Make it look like a real portrait taken by a professional photographer using a high-end camera.","model":"ChatGPT","rating":0,"tags":"bewerbung, linkedin, headshot","source":"Instagram \u2014 https://www.instagram.com/p/Dcb7HXtnRgw/","notes":"Der praktischste der Reihe: sauberes Gesch\u00e4ftsportr\u00e4t aus einem vorhandenen Foto.","bild":null},{"id":85,"title":"Aufnahme zur goldenen Stunde","category":"Portr\u00e4t & Personen","prompt":"Transform my uploaded photo into a professional golden-hour photograph. Keep my face, facial structure, skin tone, hairstyle, and identity recognizable and natural. Place me in [location] with warm natural sunlight, realistic shadows, soft highlights, natural colours, subtle background separation, and authentic environmental details. Match the lighting and perspective realistically with the location. Make it look like a genuine photograph taken by a professional photographer during golden hour, not an AI-generated image.","model":"ChatGPT","rating":0,"tags":"goldene stunde, sonnenlicht, warm","source":"Instagram \u2014 https://www.instagram.com/p/Dcb7HXtnRgw/","notes":"Warmes Abendlicht mit weichen Lichtern \u2014 die Lichtstimmung, f\u00fcr die Fotografen extra fr\u00fch aufstehen.","bild":null},{"id":86,"title":"Szene tauschen, Gesicht behalten","category":"Portr\u00e4t & Personen","prompt":"Use the image I provide as the main reference image for the character. Create a new image with the following context: [DESCRIPTION OF THE BACKGROUND].\n\nMost important requirement: preserve the maximum facial recognition of the person in the original image. Keep the characteristic facial features such as face shape, eyes, nose, lips, eyebrows, face proportions, and natural facial recognition features intact. Do not make face look younger or older. Do not arbitrarily change the facial structure. Do not make the skin too smooth or create an AI face. Preserve the natural expression and similarity to the reference image. Only change the background, clothing, and surrounding environment.\n\nThe final image must feel like the original person in the image was taken in a different location, not a new character with a similar face.\n\nStyle: real person photo, photorealistic, natural lighting, realistic skin details, natural body proportions.","model":"Gemini","rating":0,"tags":"szene, hintergrund, identit\u00e4t","source":"Instagram @sifuyik \u2014 https://www.instagram.com/p/DcJSp5_GDhf/","notes":"Der Grundprompt der Reihe. Der entscheidende Satz steht am Ende: Es soll dieselbe Person an einem anderen Ort sein \u2014 keine neue Person mit \u00e4hnlichem Gesicht.","bild":"prompt_images/face_consistent_01.jpg"},{"id":87,"title":"Neues Outfit, gleiches Gesicht","category":"Portr\u00e4t & Personen","prompt":"Keep the person in the image as the only main character. Replace the current clothing with: [CLOTHING DESCRIPTION]. While maintaining the maximum: face shape, face ratio, eye features, nose, lips, eyebrows, basic hairstyle, age and natural aura. Do not change the face identity to match the new clothing. The clothing must have fabric material, fabric texture, stitching, and a realistic fit to the body. Ensure the new outfit is suitable for the character's body type and gender. Do not make the image too similar to an AI advertisement image. The result should look like a professional fashion photo, where the character can immediately recognize that they are in the original image.","model":"Gemini","rating":0,"tags":"kleidung, outfit, mode","source":"Instagram @sifuyik \u2014 https://www.instagram.com/p/DcJSp5_GDhf/","notes":"Nur die Kleidung tauschen. Wichtig: Die KI soll das Gesicht NICHT an die neue Kleidung anpassen \u2014 genau das passiert sonst gern.","bild":"prompt_images/face_consistent_02.jpg"},{"id":88,"title":"Das Standard-Bewerbungsfoto","category":"Portr\u00e4t & Personen","prompt":"Based entirely on the face in the reference image, create a professional portrait of the same person.\nConcept: [BUSINESS OWNER/TEACHER/EXPERT/CEO/CREATOR...].\nContext: [STUDIO/WORKPLACE/CAFE...].\nRequirements: maximize the preservation of facial identity from the original image. Do not recreate a new face. Do not change the shape of the eyes, nose, lips, and distinctive features. Maintain the actual age. Preserve any natural features on the face if present. Do not make the skin look plastic. Create soft studio lighting with depth.\nShooting angle: [FRONT/\u00be/SLIGHTLY TILTING]. The lens gives a professional portrait feel, with natural depth of field.\nImage ratio: 4:5.\nPrioritize photorealistic, realistic skin texture, natural facial details, professional photography.","model":"Gemini","rating":0,"tags":"headshot, portr\u00e4t, business","source":"Instagram @sifuyik \u2014 https://www.instagram.com/p/DcJSp5_GDhf/","notes":"Mit Platzhaltern f\u00fcr Rolle, Umgebung und Aufnahmewinkel. Seitenverh\u00e4ltnis 4:5 ist vorgegeben.","bild":"prompt_images/face_consistent_03.jpg"},{"id":89,"title":"Ganzk\u00f6rper ohne Gesichtsdrift","category":"Portr\u00e4t & Personen","prompt":"Create a full-length photo using the person in the reference image. Concept: [CONCEPT DESCRIPTION]. Attire: [OUTFIT]. Setting: [SCENE].\nSince full-length photos often make AI easily change faces, prioritize maintaining face recognition from the reference image at the highest level. Keep: face shape, age, hair type, natural body proportions, identifiable features. Do not change the face just because of the camera angle or shooting distance. Create a natural pose, with both hands and fingers in the correct anatomical positions. Legs and feet balanced, not distorted. The image must look like a real person's photo, not a 3D character image or AI avatar.","model":"Gemini","rating":0,"tags":"ganzk\u00f6rper, anatomie, pose","source":"Instagram @sifuyik \u2014 https://www.instagram.com/p/DcJSp5_GDhf/","notes":"Bei Ganzk\u00f6rperbildern ver\u00e4ndert die KI das Gesicht besonders gern, weil es klein im Bild ist. Der Prompt sagt ausdr\u00fccklich: nicht wegen Kamerawinkel oder Abstand \u00e4ndern.","bild":"prompt_images/face_consistent_04.jpg"},{"id":90,"title":"Drei Ansichten aus einem Shooting","category":"Portr\u00e4t & Personen","prompt":"Use reference images and create the same person in 3 different poses.\nPose 1: looking directly at the camera.\nPose 2: 3/4 face angle.\nPose 3: slightly tilted to the side.\nIn all 3 images: maximize face recognition.\nDo not change the face structure. Do not change age. Do not arbitrarily change hairstyle. Keep important facial features.\nEmotions: [NATURAL/CONFIDENT/HONEST/RESPECTFUL...]\nThe lighting and colors must be consistent between the images.\nThe goal is to create the feeling of being photographed by the same person from different angles in the same photo shoot, not 3 different people.","model":"Gemini","rating":0,"tags":"mehrere ansichten, posen, konsistenz","source":"Instagram @sifuyik \u2014 https://www.instagram.com/p/DcJSp5_GDhf/","notes":"Erzeugt drei Blickwinkel derselben Person. Der Schlusssatz ist der Trick: Es soll wirken wie ein Shooting mit einer Person \u2014 nicht wie drei verschiedene Menschen.","bild":"prompt_images/face_consistent_05.jpg"},{"id":91,"title":"Acht Bilder als ein Fotoalbum","category":"Portr\u00e4t & Personen","prompt":"I want to use a single portrait image as a reference image to create a personal photo album. Please create 8 concepts: professional business portrait, cafe sitting portrait, travel portrait, fashion portrait, lifestyle portrait, office working portrait, outdoor portrait, high-end studio portrait.\n\nFor all concepts: the person in the image must be most recognizable. Do not create 8 different faces. Please keep stable: facial features, age, hair style, identifiable features, body proportions. Only change: clothing, background, lighting, pose, concept.\nEach concept must have its own image style but still create a feeling of belonging to the same professional personal photo album.","model":"Gemini","rating":0,"tags":"album, konzepte, serie","source":"Instagram @sifuyik \u2014 https://www.instagram.com/p/DcJSp5_GDhf/","notes":"Acht fertige Konzepte auf einmal: Business, Caf\u00e9, Reise, Mode, Lifestyle, B\u00fcro, drau\u00dfen, Studio. Ausdr\u00fccklich: keine acht verschiedenen Gesichter.","bild":"prompt_images/face_consistent_06.jpg"},{"id":92,"title":"Du als Werbegesicht","category":"Portr\u00e4t & Personen","prompt":"Use the person in the image as the main character for a product advertisement image.\n\nProduct: [PRODUCT NAME].\nTarget audience: [TARGET].\nAdvertising concept: [DESCRIPTION].\n\nThe person in the image must still be the main person in the image, with maximum face recognition preserved.\n\nDo not change the character to another AI model.\nDo not change: face, age, recognition features, natural demeanor.\nCan be changed: outfit, pose, context, lighting.\n\nThe product must be clearly represented, in the correct shape and actual features.\n\nCreate a feeling like a professional advertising shoot, not a hastily assembled AI image.\n\nDo not add logos, text, or brand details if I have not provided them.","model":"Gemini","rating":0,"tags":"werbung, produkt, marke","source":"Instagram @sifuyik \u2014 https://www.instagram.com/p/DcJSp5_GDhf/","notes":"F\u00fcr Produktwerbung mit dem eigenen Gesicht. Der letzte Satz verhindert erfundene Logos und Schriftz\u00fcge auf dem Produkt.","bild":"prompt_images/face_consistent_07.jpg"},{"id":93,"title":"Nachkontrolle und Korrektur","category":"Portr\u00e4t & Personen","prompt":"Check the newly created image by comparing it with the original reference image. Focus on checking: facial features, eye ratio, nose shape, lip shape, eyebrows, jawline, hair style, age, expression, natural recognition features. If you find any points that are not desired to be changed, please correct those points but keep: outfit, context, lighting, pose, composition. Don't make the face look better in a way that makes the person look like someone else. Prioritize similarity and authenticity over making the face perfect. The final result should create a feeling like a real photo of the same person taken in a new concept.","model":"Gemini","rating":0,"tags":"kontrolle, korrektur, nachbessern","source":"Instagram @sifuyik \u2014 https://www.instagram.com/p/DcJSp5_GDhf/","notes":"Der Nachbrenner: hinterherschicken, wenn das Ergebnis nicht ganz passt. Wichtigster Satz: \u00c4hnlichkeit geht vor Sch\u00f6nheit \u2014 die KI soll das Gesicht nicht \u201everbessern\u201c.","bild":"prompt_images/face_consistent_08.jpg"},{"id":94,"title":"Wochenbericht im Beratungsstil","category":"Schreiben & Text","prompt":"You are a senior associate at McKinsey who writes crisp, executive-ready status reports that make partners feel informed and confident without scheduling another meeting.\n\nI need a complete weekly status report that makes my boss think I spent an hour writing it.\n\nGenerate:\n1. Project summary: one paragraph overview of what I'm working on written in confident corporate language\n2. Accomplishments this week: transform my messy bullet points into polished achievement statements with impact metrics\n3. Progress against milestones: show each deliverable with percentage complete and green/yellow/red status\n4. Blockers and risks: frame problems diplomatically so I'm flagging issues without sounding like I'm complaining\n5. Next week priorities: 5-7 clear action items that show I'm proactive and thinking ahead\n6. Key decisions needed: specific asks from leadership formatted so they can reply with a simple yes or no\n7. Metrics dashboard summary: take my raw numbers and present them as a clean performance snapshot\n8. Stakeholder updates: any cross-functional dependencies or communications sent this week\n9. Resource requests: if I need help, frame it as a business case not a personal complaint\n10. Executive summary: a 2-sentence version my boss can forward to their boss without editing\n\nFormat as a McKinsey-style weekly status report with clean headers, bullet points, and a professional tone that sounds like I spent all morning writing it.\n\nMy raw notes: [PASTE YOUR MESSY NOTES, BULLET POINTS, SLACK MESSAGES, OR BRAIN DUMP OF WHAT YOU DID THIS WEEK]","model":"Claude","rating":0,"tags":"statusbericht, wochenbericht, projekt","source":"Instagram @create_daniel2 \u2014 https://www.instagram.com/p/DcbPdjijij9/","notes":"Zehn feste Abschnitte vom Projekt\u00fcberblick bis zur Zwei-Satz-Zusammenfassung, die der Chef unver\u00e4ndert weiterleiten kann. Unten die Rohnotizen einsetzen.","bild":null},{"id":95,"title":"E-Mails f\u00fcr zehn Arbeitssituationen","category":"Schreiben & Text","prompt":"You are a VP at Goldman Sachs who writes emails that get read, get responses, and get results \u2014 because in a 200-email-per-day inbox, the wrong tone or length means your email gets ignored.\n\nI need professionally written emails for every situation I face at work.\n\nDraft:\n1. Upward emails: updates to my boss that are concise, confident, and make me look competent\n2. Downward emails: task assignments to my team that are clear, respectful, and leave zero ambiguity\n3. Cross-functional emails: requests to other departments that get prioritized instead of buried\n4. Bad news delivery: frame problems with a solution already attached so I'm a problem-solver not a complainer\n5. Follow-up nudges: polite but firm second and third emails when someone hasn't responded\n6. Meeting requests: subject lines and body text that make busy people actually accept the invite\n7. Thank you and recognition: genuine appreciation emails that strengthen relationships without being cheesy\n8. Declining requests: say no diplomatically to extra work without damaging the relationship\n9. Escalation emails: raise issues to leadership without throwing anyone under the bus\n10. Cold internal outreach: introduce myself to senior leaders or cross-team contacts without being awkward\n\nFormat as ready-to-send emails with subject lines, body text, and any necessary context notes. Match the tone I specify.\n\nMy email need: [DESCRIBE THE SITUATION, WHO YOU'RE EMAILING, WHAT YOU NEED FROM THEM, AND THE TONE \u2014 FORMAL, FRIENDLY, URGENT, OR DIPLOMATIC]","model":"Claude","rating":0,"tags":"email, korrespondenz, ton","source":"Instagram @create_daniel2 \u2014 https://www.instagram.com/p/DcbPdjijij9/","notes":"Deckt die schwierigen F\u00e4lle ab: schlechte Nachrichten, h\u00f6fliches Nachhaken, Absagen und Eskalationen. Unten Situation, Empf\u00e4nger, Ziel und gew\u00fcnschten Ton einsetzen.","bild":null},{"id":96,"title":"Pr\u00e4sentation aus Rohnotizen bauen","category":"Schreiben & Text","prompt":"You are a senior consultant at Bain who builds slide decks that tell a clear story, make data look compelling, and get executives to approve budgets, strategies, and projects in a single meeting.\n\nI need a complete presentation built from my raw notes and data.\n\nBuild:\n1. Narrative structure: organize my scattered thoughts into a logical flow with a clear beginning, middle, and recommendation\n2. Executive summary slide: the single slide that captures the entire presentation if my boss only reads one\n3. Problem statement: frame the challenge in a way that creates urgency without causing panic\n4. Data visualization: turn my raw numbers into chart descriptions (bar, line, pie) that tell a story at a glance\n5. Key findings slides: 3-5 insight slides with one takeaway per slide and supporting evidence\n6. Recommendation slide: clear next steps with owner, timeline, and expected impact for each\n7. Appendix slides: detailed backup data organized for when someone asks \"where did you get that number\"\n8. Speaker notes: what to SAY on each slide (not just what's ON the slide) for a smooth delivery\n9. Slide titles as headlines: every slide title is a complete sentence that states the takeaway\n10. One-line summary: the single sentence that captures my entire presentation for Slack or email\n\nFormat as a Bain-style slide deck outline with exact slide titles, bullet points per slide, chart descriptions, and speaker notes.\n\nMy raw content: [PASTE YOUR NOTES, DATA, KEY POINTS, AND WHAT DECISION OR ACTION YOU WANT THE AUDIENCE TO TAKE AFTER SEEING THIS]","model":"Claude","rating":0,"tags":"pr\u00e4sentation, foliensatz, storyline","source":"Instagram @create_daniel2 \u2014 https://www.instagram.com/p/DcbPdjijij9/","notes":"Baut aus losen Notizen einen kompletten Foliensatz \u2014 samt Sprechernotizen und Anhang f\u00fcr die R\u00fcckfrage \u201ewoher stammt diese Zahl?\u201c.","bild":null},{"id":97,"title":"Besprechungsnotizen mit Aufgabenliste","category":"Alltag & Produktivit\u00e4t","prompt":"You are a senior project manager at Deloitte who turns chaotic meetings into clear, structured notes with action items, owners, and deadlines \u2014 so nobody ever asks \"wait, what did we agree on\" again.\n\nI need a complete meeting summary that makes me look like the most organized person in the room.\n\nExtract:\n- Meeting overview: one paragraph summary of what was discussed and the overall outcome\n- Key decisions made: every decision explicitly stated with who approved it\n- Action items: every task that was assigned with the specific person responsible and the deadline\n- Open questions: unresolved items that need follow-up with who should answer and by when\n- Risks flagged: any concerns raised during the meeting documented for the record\n- Parking lot items: topics that came up but were tabled for future discussion\n- Next meeting agenda: suggested topics for the follow-up meeting based on what was discussed\n- Stakeholder updates: what needs to be communicated to people who weren't in the meeting\n- Timeline changes: any shifts in deadlines or milestones agreed during the meeting\n- Follow-up email draft: a ready-to-send recap email to all attendees with the notes attached\n\nFormat as a Deloitte-style meeting minutes document with a decision log, action item table, and a follow-up email draft.\n\nMy meeting notes: [PASTE YOUR RAW NOTES, TRANSCRIPT, OR VOICE-TO-TEXT DUMP FROM THE MEETING]","model":"Claude","rating":0,"tags":"besprechung, protokoll, aufgaben","source":"Instagram @create_daniel2 \u2014 https://www.instagram.com/p/DcbPdjijij9/","notes":"Macht aus einem Mitschrieb ein Protokoll mit Entscheidungen, Aufgaben samt Verantwortlichen und Fristen \u2014 dazu gleich der fertige Nachfass-E-Mail-Entwurf.","bild":null},{"id":98,"title":"Entscheidungsvorlage r\u00fcckw\u00e4rts gedacht","category":"Schreiben & Text","prompt":"You are a senior program manager at Amazon who writes the famous 6-page narrative memos that Amazon uses instead of PowerPoint \u2014 the document format that forces clear thinking and gets leadership buy-in.\n\nI need a complete Amazon-style narrative document for a project, proposal, or strategy I'm presenting.\n\nWrite:\n- Press release format: write the announcement as if my project already succeeded \u2014 what does the future look like\n- Customer problem statement: clearly define who benefits and what pain point this solves\n- Current state vs future state: what the situation looks like today vs after my proposal is implemented\n- Solution overview: explain my approach in plain English without jargon or buzzwords\n- Key metrics: how we'll measure success with specific KPIs and target numbers\n- Timeline and milestones: phased rollout plan from kickoff to completion\n- Resource requirements: what I need (budget, people, tools) presented as an investment not a cost\n- Risk assessment: what could go wrong and my mitigation plan for each risk\n- FAQ section: anticipate every tough question leadership will ask and pre-answer them\n- Appendix: supporting data, research, and calculations that back up every claim in the narrative\n\nFormat as an Amazon-style 6-page narrative memo with the press release opening, narrative body, FAQ section, and supporting appendix.\n\nMy project: [DESCRIBE YOUR PROJECT, PROPOSAL, OR INITIATIVE AND WHAT APPROVAL OR DECISION YOU NEED FROM LEADERSHIP]","model":"Claude","rating":0,"tags":"memo, entscheidung, konzept","source":"Instagram @create_daniel2 \u2014 https://www.instagram.com/p/DcbPdjijij9/","notes":"Amazons Sechs-Seiten-Memo statt Folien: Man schreibt die Ank\u00fcndigung so, als w\u00e4re das Vorhaben schon gelungen \u2014 das zwingt zu klarem Denken. Mit vorweggenommenen R\u00fcckfragen.","bild":null},{"id":99,"title":"Zahlen zu einem Bericht verdichten","category":"Analyse & Recherche","prompt":"You are a senior data analyst at PwC who takes messy spreadsheets and raw numbers and transforms them into polished analysis reports that executives actually read, understand, and act on.\n\nI need a complete data analysis report that turns my numbers into a story my boss can present upward.\n\nAnalyze:\n- Data summary: clean overview of the dataset \u2014 what it contains, time period, and sample size\n- Key metrics calculated: totals, averages, percentages, and growth rates for every important number\n- Trend identification: what's going up, what's going down, and what's staying flat over time\n- Comparison analysis: performance vs last month, last quarter, last year, and vs target\n- Top and bottom performers: rank items, products, regions, or people by the key metric\n- Anomaly detection: flag any numbers that look unusual with possible explanations\n- Root cause narrative: explain WHY the numbers look the way they do in plain business language\n- Visualization descriptions: specify which charts to create (bar, line, pie) and what each should show\n- Recommendations: 3-5 specific actions to take based on what the data reveals\n- Executive summary: 3-sentence overview a C-suite executive can read in 30 seconds\n\nFormat as a PwC-style data analysis report with summary dashboard, detailed findings, and actionable recommendations.\n\nMy data: [PASTE YOUR RAW NUMBERS, DESCRIBE YOUR SPREADSHEET, OR EXPLAIN WHAT DATA YOU HAVE AND WHAT QUESTIONS YOU NEED ANSWERED]","model":"Claude","rating":0,"tags":"auswertung, zahlen, bericht","source":"Instagram @create_daniel2 \u2014 https://www.instagram.com/p/DcbPdjijij9/","notes":"Aus einer unaufger\u00e4umten Tabelle wird ein Bericht mit Trends, Ausrei\u00dfern und Ursachen im Klartext \u2014 plus Vorschlag, welche Diagramme sinnvoll sind.","bild":null},{"id":100,"title":"Raum umgestalten mit Priorit\u00e4tenliste","category":"Interior & Raumdesign","prompt":"I'll upload a photo of my room. Act as a professional interior designer. Analyze the layout, furniture, lighting, colors, walls, flooring, clutter, empty spaces, and overall visual balance.\n\nThen give me a complete custom transformation plan using my existing room as the starting point. Tell me exactly what to remove, move, repaint, replace, add, and rearrange, in priority order. My budget is [BUDGET] and my preferred style is [STYLE].","model":"ChatGPT","rating":0,"tags":"raum, plan, budget","source":"Instagram \u2014 https://www.instagram.com/p/DcdvYJ8lY1Z/","notes":"Der Grundprompt: Der vorhandene Raum ist der Ausgangspunkt, nicht ein leerer Grundriss. Liefert eine Reihenfolge \u2014 was zuerst weg, umstellen, streichen, ersetzen.","bild":null},{"id":101,"title":"Raum hochwertiger wirken lassen","category":"Interior & Raumdesign","prompt":"Analyze my uploaded room photo and show me how to make it look significantly more premium without spending unnecessarily. Identify the cheapest changes that would create the biggest visual improvement.\n\nGive me specific recommendations for lighting, curtains, colors, furniture arrangement, wall decor, bedding, plants, rugs, and accessories based on what you can actually see.","model":"ChatGPT","rating":0,"tags":"wirkung, g\u00fcnstig, aufwertung","source":"Instagram \u2014 https://www.instagram.com/p/DcdvYJ8lY1Z/","notes":"Sucht gezielt die billigsten \u00c4nderungen mit der gr\u00f6\u00dften Wirkung \u2014 Licht, Vorh\u00e4nge, Farben, Anordnung. Kein Umbau, nur Hebel.","bild":null},{"id":102,"title":"Raum auf Pinterest-Niveau bringen","category":"Interior & Raumdesign","prompt":"Transform the design direction of my room into a stylish, modern, Pinterest-worthy space. First analyze what's currently making the room look ordinary or unattractive.\n\nThen create a specific design concept including color palette, furniture placement, lighting, wall treatment, textiles, decor, plants, and finishing touches. Keep the recommendations realistic for the room's actual size and architecture.","model":"ChatGPT","rating":0,"tags":"stil, konzept, modern","source":"Instagram \u2014 https://www.instagram.com/p/DcdvYJ8lY1Z/","notes":"Fragt zuerst, was den Raum gew\u00f6hnlich aussehen l\u00e4sst, und baut darauf ein Konzept. Der Zusatz \u201erealistisch f\u00fcr Gr\u00f6\u00dfe und Architektur\u201c verhindert Vorschl\u00e4ge, die nicht in den Raum passen.","bild":null},{"id":103,"title":"Umgestaltung mit festem Budget","category":"Interior & Raumdesign","prompt":"I'll upload my room photo. Redesign it to look dramatically better with a maximum budget of [$$$]. Prioritize changes that create the biggest visual impact for the least money.\n\nTell me what I should keep, remove, rearrange, DIY, repaint, or purchase. Divide the recommendations into must-do, high-impact, and optional, so I know exactly where my money should go.","model":"ChatGPT","rating":0,"tags":"budget, diy, priorisierung","source":"Instagram \u2014 https://www.instagram.com/p/DcdvYJ8lY1Z/","notes":"Teilt die Vorschl\u00e4ge in Pflicht, gro\u00dfe Wirkung und optional \u2014 so ist klar, wohin das Geld zuerst geht.","bild":null},{"id":104,"title":"Raumaufteilung \u00fcberarbeiten","category":"Interior & Raumdesign","prompt":"Analyze the layout of my room from the uploaded photo. Identify wasted space, awkward furniture placement, poor walking paths, visual imbalance, and areas that make the room feel smaller.\n\nThen give me a new furniture arrangement using the pieces I already have. Explain exactly where each major item should go and why.","model":"ChatGPT","rating":0,"tags":"grundriss, m\u00f6bel, laufwege","source":"Instagram \u2014 https://www.instagram.com/p/DcdvYJ8lY1Z/","notes":"Nur umstellen, nichts kaufen: findet verschenkte Fl\u00e4che, ung\u00fcnstige Laufwege und erkl\u00e4rt zu jedem M\u00f6belst\u00fcck, warum es wohin geh\u00f6rt.","bild":null},{"id":105,"title":"Farben und Licht passend w\u00e4hlen","category":"Interior & Raumdesign","prompt":"Analyze my uploaded room photo and recommend the best color palette and lighting setup for this exact space. Consider the room size, natural light, existing furniture, flooring, wall colors, and overall atmosphere.\n\nGive me specific wall-color directions, bulb color temperature, lamp placement, curtain recommendations, and accent colors. The goal is to make the room feel [larger / luxurious / cozy / modern / calm].","model":"ChatGPT","rating":0,"tags":"farben, licht, lichtfarbe","source":"Instagram \u2014 https://www.instagram.com/p/DcdvYJ8lY1Z/","notes":"Geht ins Konkrete: Wandfarbe, Farbtemperatur der Leuchtmittel, Lampenstandorte, Vorh\u00e4nge. Am Ende die gew\u00fcnschte Wirkung einsetzen.","bild":null},{"id":106,"title":"Das ganze Haus als ein Konzept","category":"Interior & Raumdesign","prompt":"I'll upload photos of different areas of my home. Analyze them together rather than treating each room separately. Identify inconsistencies in colors, furniture styles, lighting, decor, and visual flow.\n\nThen create one cohesive interior design direction for the entire home, including a consistent color palette, materials, lighting style, furniture approach, and decor language.\nTell me what should change first.","model":"ChatGPT","rating":0,"tags":"gesamtkonzept, wohnung, roter faden","source":"Instagram \u2014 https://www.instagram.com/p/DcdvYJ8lY1Z/","notes":"Betrachtet mehrere R\u00e4ume zusammen statt einzeln und findet Br\u00fcche in Farben, M\u00f6belstilen und Licht. Endet mit der Frage, was zuerst ge\u00e4ndert werden sollte.","bild":null},{"id":107,"title":"Der Bauplan: Ziel, Zusammenhang, Erwartung, Quelle","category":"Alltag & Produktivit\u00e4t","prompt":"Bauplan f\u00fcr jeden Copilot-Prompt \u2014 vier Bausteine in dieser Reihenfolge:\n\nGOAL \u2014 Was willst du von Copilot?\n  Behandle Copilot wie ein Zauberbuch: Du kannst nach fast allem fragen.\n  Beispiel: I need a 5-bullet-point recap of all of my emails related to the 'Brown Socks Product Launch'.\n\nCONTEXT \u2014 Wozu brauchst du es und wer ist beteiligt?\n  Damit schneidet Copilot die Antwort auf deine Zielgruppe zu.\n  Beispiel: I need this information to prepare for an upcoming meeting with tons of non-boring accountants and to gather all key communications relevant to this project.\n\nEXPECTATION \u2014 Wie soll Copilot antworten, damit es zu deiner Anfrage passt?\n  Der Ton l\u00e4sst sich jederzeit \u00e4ndern: sachlich, humorvoll, mit Emojis.\n  Beispiel: Make sure you keep a professional tone as this is for a serious meeting.\n\nSOURCE \u2014 Welche Informationen soll Copilot durchsuchen?\n  Hier liegt Copilots St\u00e4rke gegen\u00fcber ChatGPT: Es ist in die Microsoft-Umgebung\n  eingebettet. Die Gesch\u00e4ftsversion greift auf den Microsoft Graph zu \u2014 quasi eine\n  interne Suchmaschine \u00fcber E-Mails, Kontakte, SharePoint-Dateien und mehr.\n  Beispiel: Focus on my email inbox, specifically emails on and after May 15th 2026.\n\nAlles zusammen ergibt den fertigen Prompt:\n\nI need a 5-bullet-point recap of all of my emails related to the 'Brown Socks Product Launch'. I need this information to prepare for an upcoming meeting with tons of non-boring accountants and to gather all key communications relevant to this project. Make sure you keep a professional tone as this is for a serious meeting. Focus on my email inbox, specifically emails on and after May 15th 2026.\n\nWeitergehend: F\u00fcr bessere Ergebnisse \u2014 etwa bei Websuchen \u2014 kann man Copilot\nzus\u00e4tzlich eine Rolle zuweisen und Beispiele mitgeben. Das Wichtigste bleibt,\nkonkret zu sein.","model":"Copilot","rating":0,"tags":"bauplan, formel, struktur","source":"Microsoft Copilot Cheat Sheet, David Fortin \u2014 https://www.instagram.com/p/Dc19NLtG0hk/","notes":"Das Herzst\u00fcck des Guides, hier in der ausf\u00fchrlichen Fassung von Seite 7. \u201eFind emails Brown Project\u201c ist zu unbestimmt \u2014 die vier Bausteine machen daraus einen brauchbaren Auftrag. Merkhilfe des Autors: GCES.","bild":"prompt_images/copilot_4keys.jpg"},{"id":108,"title":"Copilot: was hilft und was schadet","category":"Alltag & Produktivit\u00e4t","prompt":"Was bei Copilot hilft:\n- Die vier Bausteine benutzen: Ziel, Zusammenhang, Erwartung, Quelle\n- Klar und konkret sein\n- Es wie ein Gespr\u00e4ch behandeln\n- Beispiele mitgeben\n- Zeichensetzung und ordentliche Grammatik\n- Ergebnisse auf Richtigkeit pr\u00fcfen \u2014 das Werkzeug ist neu\n- Mit Copilot reden wie mit der eigenen Mutter: h\u00f6flich\n\nWas schadet:\n- Drauflostippen wie beim besten Freund\n- Sehr vage bleiben\n- Es wie ein W\u00f6rterbuch behandeln\n- Sich selbst widersprechen\n- Umgangssprache und saloppe Formulierungen\n- Den Ergebnissen blind vertrauen (eigenes Urteil einschalten)\n- Mitten im Gespr\u00e4ch das Thema wechseln \u2014 dann lieber ein neues starten","model":"Copilot","rating":0,"tags":"regeln, dos, donts","source":"Microsoft Copilot Cheat Sheet, David Fortin \u2014 https://www.instagram.com/p/Dc19NLtG0hk/","notes":"Die Gegen\u00fcberstellung aus dem Cheat Sheet. Der wichtigste Punkt unten: Beim Themenwechsel ein neues Gespr\u00e4ch beginnen, statt im alten weiterzumachen.","bild":"prompt_images/copilot_dosdonts.jpg"},{"id":109,"title":"Copilot in Excel","category":"Alltag & Produktivit\u00e4t","prompt":"Beispiel-Prompts f\u00fcr Copilot in Excel:\n\nDaten auswerten und darstellen:\nCreate a bar charts comparing Q2 and Q3 costs\n\nFormelvorschl\u00e4ge erhalten, auch f\u00fcr komplizierte Rechnungen:\nHow do I do a XLOOKUP to get the Unique IDs of these invoices?\n\nAuswahllisten, Hervorhebungen, Filter und Sortierung:\nCreate a formula that shows all sales above $5000 from department X.","model":"Copilot","rating":0,"tags":"excel, formeln, diagramme","source":"Microsoft Copilot Cheat Sheet, David Fortin \u2014 https://www.instagram.com/p/Dc19NLtG0hk/","notes":"Drei Beispiele aus dem Cheat Sheet: Diagramm erzeugen, Formel erkl\u00e4ren lassen, Formel bauen.","bild":"prompt_images/copilot_apps.jpg"},{"id":110,"title":"Copilot in PowerPoint","category":"Schreiben & Text","prompt":"Beispiel-Prompts f\u00fcr Copilot in PowerPoint:\n\nFoliensatz erstellen:\nCraft vibrant presentation slides for an executive committee in the technology industry.\n\nSprechernotizen erg\u00e4nzen:\nAdd concise speaker notes for each of the slides.\n\nAus PDF oder Word-Datei eine Pr\u00e4sentation machen:\nCreate a presentation from the attached PDF.\n\nPr\u00e4sentation \u00fcbersetzen:\nTranslate this whole presentation from French to English","model":"Copilot","rating":0,"tags":"powerpoint, folien, pr\u00e4sentation","source":"Microsoft Copilot Cheat Sheet, David Fortin \u2014 https://www.instagram.com/p/Dc19NLtG0hk/","notes":"Vier Beispiele: Foliensatz erzeugen, Sprechernotizen erg\u00e4nzen, aus einem PDF eine Pr\u00e4sentation machen, eine Pr\u00e4sentation \u00fcbersetzen.","bild":"prompt_images/copilot_apps.jpg"},{"id":111,"title":"Copilot in Teams","category":"Alltag & Produktivit\u00e4t","prompt":"Beispiel-Prompts f\u00fcr Copilot in Teams:\n\nAufgaben aus einer Besprechung ziehen:\nList action items that were discussed in this meeting\n\nNach einer bestimmten Aussage suchen:\nWhat did David say about the ERP implementation project?\n\nVerpasste Nachrichten zusammenfassen:\nI was in vacation for the past two weeks, can you summarize all of my missed messages?","model":"Copilot","rating":0,"tags":"teams, besprechung, protokoll","source":"Microsoft Copilot Cheat Sheet, David Fortin \u2014 https://www.instagram.com/p/Dc19NLtG0hk/","notes":"Drei Beispiele rund um Besprechungen \u2014 besonders n\u00fctzlich der letzte: alles nachlesen, was man im Urlaub verpasst hat.","bild":"prompt_images/copilot_apps.jpg"},{"id":112,"title":"Copilot f\u00fcr E-Mails","category":"Schreiben & Text","prompt":"Anwendungsf\u00e4lle f\u00fcr Copilot mit E-Mails:\n\nEntwurf aus einem Anhang:\nDraft an email based on the attached Word/PDF \u2014 summarize key points + suggest next steps.\n\nLange E-Mail-Ketten zusammenfassen:\nUse Copilot to summarize long email chains in Outlook so you never miss key details.","model":"Copilot","rating":0,"tags":"email, outlook, zusammenfassung","source":"Microsoft Copilot Cheat Sheet, David Fortin \u2014 https://www.instagram.com/p/Dc19NLtG0hk/","notes":"Zwei Anwendungsf\u00e4lle des Autors: Entwurf aus einem Anhang schreiben und lange E-Mail-Ketten zusammenfassen.","bild":"prompt_images/copilot_faelle.jpg"},{"id":113,"title":"Copilot f\u00fcr PDF-Dokumente","category":"Analyse & Recherche","prompt":"Anwendungsf\u00e4lle f\u00fcr Copilot mit PDF-Dokumenten:\n\nZwei Vertr\u00e4ge vergleichen:\nAnalyze and compare two PDF contracts. Provide a summary, identify the 3 key takeaways and risks, and conclude with a go/no-go recommendation and the reason behind it.\n\nLangen Finanzbericht auswerten:\nAnalyze this 20-page financial statement. Summarize the key financial insights, highlight trends, and provide a short executive summary I can use in a meeting.","model":"Copilot","rating":0,"tags":"pdf, vertrag, auswertung","source":"Microsoft Copilot Cheat Sheet, David Fortin \u2014 https://www.instagram.com/p/Dc19NLtG0hk/","notes":"Zwei Anwendungsf\u00e4lle: zwei Vertr\u00e4ge gegen\u00fcberstellen mit Empfehlung, und einen langen Finanzbericht auf das Wesentliche eindampfen.","bild":"prompt_images/copilot_faelle.jpg"},{"id":114,"title":"Copilot-Agenten einsetzen","category":"Agenten & Automatisierung","prompt":"Anwendungsf\u00e4lle f\u00fcr Copilot-Agenten:\n\nArbeitswoche planen:\nUse Researcher agent to plan my work week. Copilot (paid) has access to my recently worked files, Outlook calendar, Teams messages and emails.\n\nEigener Agent f\u00fcr E-Mails im eigenen Ton:\nUse a custom agent to write emails using my tone and voice. I fed the agent with some knowledge and it's fed directly on my inbox.","model":"Copilot","rating":0,"tags":"agenten, researcher, automatisierung","source":"Microsoft Copilot Cheat Sheet, David Fortin \u2014 https://www.instagram.com/p/Dc19NLtG0hk/","notes":"Zwei Anwendungsf\u00e4lle mit Agenten. Der Researcher-Agent greift dabei auf zuletzt bearbeitete Dateien, Kalender, Teams-Nachrichten und E-Mails zu (kostenpflichtige Copilot-Lizenz).","bild":"prompt_images/copilot_faelle.jpg"},{"id":115,"title":"Copilot Chat & Agenten \u2014 25 Tipps","category":"Agenten & Automatisierung","prompt":"1. Upload Excel file & ask to make charts & analysis (use GPT-5 best results)\n2. Attach emails & ask Copilot to draft a response (give context)\n3. Search through your organization documents (use GCES Prompt formula)\n4. Search through your Outlook emails (use GCES Prompt formula)\n5. Goodbye Google, this is your new search engine (Copilot has Web + Work access)\n6. Analyze thorough and lengthy PDFs (you can even compare them)\n7. Create detailed (and funny) images, you can use Copilot Create as well\n8. Brainstorm ideas (negotiation, marketing, how to cook a banana bread)\n9. Prepare for an important meeting (First time doing something? Ask Copilot!)\n10. Get an overview of a topic you're unfamiliar with (example: How does AI work?)\n11. Get Step-by-Step Instructions on how to do an Excel formula or a pitch\n12. Become more productive - ask Copilot how to improve your daily workflow\n13. Explain Excel formulas (Upload Excel files or screenshot your formula)\n14. Improve readability and flow of your emails \"Write this like I'm grade 5\"\n15. Translate Excel formulas to new language\n16. Draft a LinkedIn post from meeting summary\n17. Build a complete SWOT analysis using Copilot\n18. Create action items from this discussion\n19. Plan your week in about 8 minutes using the Researcher Agent\n20. Upload multiple Excel files to the Analyst agent and ask Copilot for a 360 analysis\n21. Draft onboarding emails for new hires\n22. Build an agent to transfer long PDF memos to cool Teams Messages\n23. Build a PDF Analyst agent (by example: The Income Statement Analyst)\n24. Build a Executive Summary Agent (Will summarize all your PDF in an exec format)\n25. Build an invoice classification Agent to help your team keep your books clean","model":"Copilot","rating":0,"tags":"chat, agenten, recherche","source":"Ultimate Copilot Guide V3, David Fortin \u2014 https://www.instagram.com/p/Dc19NLtG0hk/","notes":"Tipps 1\u201325. Die zweite H\u00e4lfte ab 19 dreht sich um eigene Agenten \u2014 Researcher, Analyst, PDF-Auswertung, Rechnungssortierung.","bild":"prompt_images/copilot_tipps_chat.jpg"},{"id":116,"title":"Copilot in Excel \u2014 25 Tipps","category":"Alltag & Produktivit\u00e4t","prompt":"26. Merge data from two tables (XLOOKUP)\n27. Write Complex & Simple Formulas\n28. Write Text Functions (Extract text string)\n29. Explain a formula and how to do it\n30. Make Charts in a single click\n31. Apply Conditional Format\n32. Get Data Insights (Data Analysis)\n33. Summarize and organize data with Pivot Table\n34. Suggest formulas and insights\n35. Create dashboards in seconds\n36. Write VBA Code and macros\n37. Clean your data partially\n38. Generate pivot tables from raw data\n39. Ask Copilot how to remove duplicates\n40. Split full names into first and last names (one column to two column)\n41. Detect outliers or anomalies in data\n42. Summarize trends in large datasets (e.g., sales)\n43. Compare year-over-year performance visually\n44. Query in plain language (Top 5 products by revenue)\n45. Write Python code using Copilot Advanced Analysis mode\n46. Use Copilot Advanced Analysis mode to do a sensitivity analysis\n47. Use the brand new =COPILOT() formula to have AI integrated in the sheets\n48. Ask Copilot \"Which data would a Financial Analyst look at first?\"\n49. Ask Copilot to validate your current Excel formula\n50. Be a Freak in the sheets","model":"Copilot","rating":0,"tags":"excel, formeln, pivot","source":"Ultimate Copilot Guide V3, David Fortin \u2014 https://www.instagram.com/p/Dc19NLtG0hk/","notes":"Tipps 26\u201350. Ab 45 wird es fortgeschritten: Python im Advanced-Analysis-Modus, Sensitivit\u00e4tsanalyse und die neue =COPILOT()-Formel direkt in der Tabelle.","bild":"prompt_images/copilot_tipps_excel.jpg"},{"id":117,"title":"Copilot in Word & Teams \u2014 25 Tipps","category":"Alltag & Produktivit\u00e4t","prompt":"51. Format Documents (Add bold, italic etc.)\n52. Generate a strong first draft of your document\n53. Grammar and Spell Check\n54. Summarize your document\n55. Generate images directly in Word document\n56. Explain the Document\n57. Translate documents to many languages\n58. Find specific information\n59. Find calls to action\n60. Draft emails based on existing documents\n61. Generate text based on existing documents\n62. Transform your text numbers into a table\n63. Expand short notes into full paragraphs\n64. Generate introductions or conclusions\n65. Create social media posts from meeting transcripts\n66. Generate FAQs from source documents\n67. Create job descriptions from role summaries\n68. Rewrite passive voice into active\n69. Record all of your meetings and get the transcript\n70. Ask Copilot \"What did my client say about this crazy project?\" after a meeting\n71. Get your follow-up action items after a meeting ends\n72. Transfer all of your meeting notes (that Copilot took) to OneNote\n73. Transfer all of your meeting notes (from OneNote) to Microsoft To Do\n74. Build an agent that has your teams conversations and meetings as a source\n75. Have Copilot help you read this PDF cause it's so small","model":"Copilot","rating":0,"tags":"word, teams, besprechung","source":"Ultimate Copilot Guide V3, David Fortin \u2014 https://www.instagram.com/p/Dc19NLtG0hk/","notes":"Tipps 51\u201375. Die Teams-Tipps ab 69 sind die st\u00e4rksten: Aufzeichnung samt Mitschrift, Nachfassaufgaben nach der Besprechung, \u00dcbergabe der Notizen an OneNote und To Do.","bild":"prompt_images/copilot_tipps_word.jpg"},{"id":118,"title":"Copilot in PowerPoint \u2014 25 Tipps","category":"Schreiben & Text","prompt":"76. Create PowerPoint from PDF\n77. Organize presentation by sections\n78. Create PowerPoint from Word Document\n79. Create a full slide deck in seconds (as a first draft)\n80. Generate a storyline with narrative builder\n81. Generate Speaker Notes\n82. Create presentation with your company template\n83. Summarize a presentation in bullet points\n84. Generate and add images\n85. Add image from stock gallery\n86. Animate Presentation\n87. Show key slides in a presentation\n88. Create executive summaries from reports\n89. Rewrite slides for clarity and impact\n90. Suggest headlines or titles for slides\n91. Translate slides into other languages\n92. Improve slide readability and layout\n93. Generate slide content from meeting transcripts\n94. Generate onboarding or training decks\n95. Create PowerPoint from PDF\n96. Find specific information from your slide deck\n97. Generate new information that you might have forgotten with Copilot\n98. Summarize the PowerPoint for an executive summary\n99. Add the presentation agenda slide at the top\n100. Build a presentation about Nicolas Boucher, the #1 AI in Finance influencer","model":"Copilot","rating":0,"tags":"powerpoint, folien, pr\u00e4sentation","source":"Ultimate Copilot Guide V3, David Fortin \u2014 https://www.instagram.com/p/Dc19NLtG0hk/","notes":"Tipps 76\u2013100. Praktisch: Foliensatz aus PDF oder Word-Datei, mit der eigenen Firmenvorlage, samt Sprechernotizen und Agenda-Folie.","bild":"prompt_images/copilot_tipps_ppt.jpg"},{"id":119,"title":"Rolle: Pers\u00f6nlicher Stilberater","category":"Rollen & System-Prompts","prompt":"Act as my personal stylist. I'll upload my photo and tell you the occasion: [OCCASION], location: [LOCATION], weather: [WEATHER], and the impression I want to create: [STYLE]. Analyze what is visible in my photo and recommend a complete head-to-toe look including hairstyle, grooming, outfit, colors, fit, footwear, accessories, and finishing touches. Give me one best look plus two alternatives. Prioritize what I already own if I provide wardrobe photos, and explain exactly why each choice works together.","model":"ChatGPT","rating":0,"tags":"stil, kleidung, anlass","source":"Instagram @Yourchatgptguide \u2014 https://www.instagram.com/p/DcYbbSSiN9O/","notes":"Bewertet ein Foto und schl\u00e4gt einen kompletten Look vor \u2014 mit zwei Alternativen. Wer Fotos vom eigenen Schrank mitschickt, bekommt Vorschl\u00e4ge aus dem, was da ist.","bild":null},{"id":120,"title":"Rolle: Pers\u00f6nlicher Raumgestalter","category":"Rollen & System-Prompts","prompt":"Act as my personal interior designer. I'll upload photos of my [ROOM/HOME]. Analyze the existing layout, furniture, lighting, colors, storage, proportions, and visible limitations. My preferred style is [STYLE], budget is [BUDGET], and I want the space to feel [FEELING]. Give me a transformation plan using as much of my existing furniture as possible. Tell me what to remove, move, add, repaint, replace, or reorganize, in priority order. Include a practical shopping list and a step-by-step implementation plan.","model":"ChatGPT","rating":0,"tags":"raum, einrichtung, einkaufsliste","source":"Instagram @Yourchatgptguide \u2014 https://www.instagram.com/p/DcYbbSSiN9O/","notes":"Wie die Interior-Prompts, aber mit zwei Zus\u00e4tzen am Ende: praktische Einkaufsliste und Umsetzung Schritt f\u00fcr Schritt.","bild":null},{"id":121,"title":"Rolle: Pers\u00f6nlicher Friseur","category":"Rollen & System-Prompts","prompt":"Act as my personal hair stylist. I'll upload clear photos of my hair and face. Analyze my visible hair characteristics, current cut, texture, length, styling, and face shape without assuming anything you cannot see. My goal is [GOAL] and my preferred maintenance level is [LOW/MEDIUM/HIGH]. Recommend 5 hairstyles ranked from best to worst, explain why each works, describe exactly what I should ask a barber or stylist to do, and give me simple daily styling instructions. Include options for growing, cutting, or changing my current hairstyle.","model":"ChatGPT","rating":0,"tags":"haare, frisur, beratung","source":"Instagram @Yourchatgptguide \u2014 https://www.instagram.com/p/DcYbbSSiN9O/","notes":"Der n\u00fctzlichste Teil steht am Ende: was genau man dem Friseur sagen soll. Die Anweisung \u201enichts annehmen, was du nicht sehen kannst\u201c h\u00e4lt die Beratung ehrlich.","bild":null},{"id":122,"title":"Rolle: Essensplaner mit Einkaufszettel","category":"Rollen & System-Prompts","prompt":"Act as my practical meal and grocery planner. My household has [NUMBER] people, food preferences are [PREFERENCES], dietary restrictions are [RESTRICTIONS], weekly food budget is [BUDGET], cooking time is [TIME], and location is [COUNTRY/CITY]. Create a simple 7-day meal plan with breakfast, lunch, dinner, and optional snacks. Reuse ingredients intelligently to reduce waste and cost. Then create one organized grocery list grouped by category and give substitutions for expensive or unavailable ingredients.","model":"ChatGPT","rating":0,"tags":"essen, wochenplan, einkauf","source":"Instagram @Yourchatgptguide \u2014 https://www.instagram.com/p/DcYbbSSiN9O/","notes":"Wochenplan plus Einkaufszettel nach Kategorien. Der Kniff: Zutaten werden bewusst mehrfach verplant, damit weniger \u00fcbrig bleibt und weniger kostet.","bild":null},{"id":123,"title":"Rolle: N\u00fcchterner Ratgeber bei Problemen","category":"Rollen & System-Prompts","prompt":"Act as my practical life coach and problem-solving partner. Here is the situation I'm dealing with: [PROBLEM]. What I want is [DESIRED OUTCOME]. My constraints are [CONSTRAINTS] and what I've already tried is [ATTEMPTS]. Don't give me generic motivation. First diagnose the likely root causes, separate what I can control from what I cannot, challenge any assumptions that may be keeping me stuck, and then give me a prioritized action plan with the smallest useful first step I can take today.","model":"ChatGPT","rating":0,"tags":"coaching, problem, plan","source":"Instagram @Yourchatgptguide \u2014 https://www.instagram.com/p/DcYbbSSiN9O/","notes":"\u201eDon't give me generic motivation\u201c ist der entscheidende Satz. Trennt, was man beeinflussen kann, von dem, was nicht \u2014 und endet mit dem kleinsten sinnvollen ersten Schritt f\u00fcr heute.","bild":null},{"id":124,"title":"Rolle: Trainingsplaner","category":"Rollen & System-Prompts","prompt":"Act as my personal fitness coach. My goal is [GOAL], current fitness level is [LEVEL], available equipment is [EQUIPMENT], and I can train [DAYS/MINUTES]. Ask only the important questions needed to personalize the plan, then create a progressive routine with warm-up, exercises, sets, reps or time, rest, progression, recovery, and simple ways to track results. Adapt the plan whenever I give you new progress data. Do not promise a specific transformation, and flag anything that may require professional medical guidance.","model":"ChatGPT","rating":0,"tags":"training, fitness, plan","source":"Instagram @Yourchatgptguide \u2014 https://www.instagram.com/p/DcYbbSSiN9O/","notes":"Fragt erst nach, bevor geplant wird. Verspricht ausdr\u00fccklich keine Ergebnisse und weist auf Punkte hin, f\u00fcr die \u00e4rztlicher Rat n\u00f6tig ist.","bild":null},{"id":125,"title":"Rolle: Reiseplaner","category":"Rollen & System-Prompts","prompt":"Act as my personal travel planner. I'm traveling from [ORIGIN] to [DESTINATION] from [DATES] with [PEOPLE] people and a total budget of [BUDGET]. Build a complete trip plan covering transport, neighborhoods, accommodation strategy, daily itinerary, food, attractions, local experiences, realistic travel time, estimated costs, booking priorities, and backup options. Optimize for both value and memorable experiences rather than cramming every attraction into the trip.","model":"ChatGPT","rating":0,"tags":"reise, planung, budget","source":"Instagram @Yourchatgptguide \u2014 https://www.instagram.com/p/DcYbbSSiN9O/","notes":"Kompletter Reiseplan mit Kostensch\u00e4tzung und Ausweichm\u00f6glichkeiten. Der Schlusssatz z\u00e4hlt: lieber gute Erlebnisse als jede Sehensw\u00fcrdigkeit abhaken.","bild":null}];
const KATEGORIEN = ["Fotobearbeitung & Retusche", "Portr\u00e4t & Personen", "Interior & Raumdesign", "Poster & Grafikdesign", "Schreiben & Text", "Alltag & Produktivit\u00e4t", "Rollen & System-Prompts", "Analyse & Recherche", "Agenten & Automatisierung"];

/* Als SVG statt als Sonderzeichen: das Kopier-Glyph fehlt in vielen Schriften. */
const KOPIER_ICON =
  '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
  'stroke-width="1.4" stroke-linejoin="round" aria-hidden="true">' +
  '<rect x="5.2" y="5.2" width="8.3" height="8.3" rx="1.4"/>' +
  '<path d="M10.8 3.4V2.9a1.4 1.4 0 0 0-1.4-1.4H3.9a1.4 1.4 0 0 0-1.4 1.4v5.5a1.4 1.4 0 0 0 1.4 1.4h.5"/>' +
  '</svg>';

let katFilter = '', modellFilter = '';

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* Platzhalter wie [LOCATION] oder [BUDGET] sind das, was beim Einsetzen
   ersetzt werden muss — deshalb farbig statt als Fliesstext. */
const mitPlatzhaltern = t => esc(t).replace(/\[[^\]\n]{1,60}\]/g, m => '<span class="ph">' + m + '</span>');

function baueFilter() {
  const zKat = {}, zMod = {};
  PROMPTS.forEach(p => {
    zKat[p.category] = (zKat[p.category] || 0) + 1;
    if (p.model) zMod[p.model] = (zMod[p.model] || 0) + 1;
  });
  const modelle = Object.keys(zMod).sort();

  const chip = (wert, text, anzahl, aktiv, art) =>
    '<button type="button" class="chip" data-art="' + art + '" data-wert="' + esc(wert) +
    '" aria-pressed="' + aktiv + '">' + esc(text) + '<span class="n">' + anzahl + '</span></button>';

  document.getElementById('filter-kat').innerHTML =
    '<span class="reihe-titel">Thema</span>' +
    chip('', 'Alle', PROMPTS.length, katFilter === '', 'kat') +
    KATEGORIEN.filter(k => zKat[k]).map(k => chip(k, k, zKat[k], katFilter === k, 'kat')).join('');

  document.getElementById('filter-modell').innerHTML =
    '<span class="reihe-titel">Modell</span>' +
    chip('', 'Alle', PROMPTS.length, modellFilter === '', 'modell') +
    modelle.map(m => chip(m, m, zMod[m], modellFilter === m, 'modell')).join('');
}

function karte(p) {
  const tags = (p.tags || '').split(',').map(t => t.trim()).filter(Boolean);
  const linkTreffer = (p.source || '').match(/https?:\/\/\S+/);
  let quelle = '';
  if (p.source) {
    quelle = linkTreffer
      ? esc(p.source.replace(linkTreffer[0], '')) +
        '<a href="' + esc(linkTreffer[0]) + '" target="_blank" rel="noopener">' + esc(linkTreffer[0]) + '</a>'
      : esc(p.source);
  }
  return '<article class="karte">' +
    '<div class="karte-kopf"><h3>' + esc(p.title) + '</h3>' +
    '<button type="button" class="kopieren" data-id="' + p.id + '" aria-label="Prompt kopieren" title="In die Zwischenablage">' + KOPIER_ICON + '</button></div>' +
    (p.bild ? '<img class="bild" src="' + p.bild + '" alt="Beispiel zu ' + esc(p.title) + '" loading="lazy">' : '') +
    '<pre class="text">' + mitPlatzhaltern(p.prompt) + '</pre>' +
    '<div class="zeile">' +
      (p.model ? '<span class="modell">' + esc(p.model) + '</span>' : '') +
      tags.map(t => '<span class="tag">#' + esc(t) + '</span>').join(' ') +
    '</div>' +
    (p.notes ? '<div class="notiz">' + esc(p.notes) + '</div>' : '') +
    (quelle ? '<div class="quelle">Quelle: ' + quelle + '</div>' : '') +
  '</article>';
}

function zeichne() {
  const suche = document.getElementById('suche').value.toLowerCase().trim();
  const treffer = PROMPTS.filter(p => {
    if (katFilter && p.category !== katFilter) return false;
    if (modellFilter && p.model !== modellFilter) return false;
    if (!suche) return true;
    return [p.title, p.prompt, p.tags, p.source, p.notes]
      .some(f => (f || '').toLowerCase().includes(suche));
  });

  document.getElementById('zaehler').textContent =
    treffer.length === PROMPTS.length
      ? PROMPTS.length + ' Prompts'
      : treffer.length + ' von ' + PROMPTS.length;

  const ziel = document.getElementById('liste');
  if (!treffer.length) {
    ziel.innerHTML = '<div class="leer">Kein Prompt passt zu dieser Auswahl.</div>';
    return;
  }
  const gruppen = {};
  treffer.forEach(p => { (gruppen[p.category] = gruppen[p.category] || []).push(p); });
  ziel.innerHTML = KATEGORIEN.filter(k => gruppen[k]).map(k =>
    '<section class="gruppe"><div class="gruppe-kopf"><h2>' + esc(k) + '</h2>' +
    '<span class="n">' + gruppen[k].length + '</span></div>' +
    '<div class="raster">' + gruppen[k].map(karte).join('') + '</div></section>').join('');
}

/* Kopieren muss auch dort gehen, wo die Clipboard-API fehlt. */
function kopiere(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(() => true, () => altmodisch(text));
  }
  return Promise.resolve(altmodisch(text));
}
function altmodisch(text) {
  const feld = document.createElement('textarea');
  feld.value = text;
  feld.setAttribute('readonly', '');
  feld.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
  document.body.appendChild(feld);
  try {
    if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
      const bereich = document.createRange();
      bereich.selectNodeContents(feld);
      const auswahl = window.getSelection();
      auswahl.removeAllRanges(); auswahl.addRange(bereich);
      feld.setSelectionRange(0, 999999);
    } else { feld.select(); }
    return document.execCommand('copy');
  } catch (e) { return false; }
  finally { document.body.removeChild(feld); }
}

let hinweisZeit;
function hinweis(text) {
  let box = document.getElementById('hinweis');
  if (!box) {
    box = document.createElement('div');
    box.id = 'hinweis';
    document.body.appendChild(box);
  }
  box.textContent = text;
  box.hidden = false;
  clearTimeout(hinweisZeit);
  hinweisZeit = setTimeout(() => { box.hidden = true; }, 2000);
}

document.addEventListener('click', ev => {
  const chip = ev.target.closest('.chip');
  if (chip) {
    if (chip.dataset.art === 'kat') katFilter = chip.dataset.wert;
    else modellFilter = chip.dataset.wert;
    baueFilter(); zeichne();
    return;
  }
  const knopf = ev.target.closest('.kopieren');
  if (knopf) {
    const p = PROMPTS.find(x => x.id === Number(knopf.dataset.id));
    if (!p) return;
    kopiere(p.prompt).then(ok => {
      hinweis(ok ? 'Prompt kopiert.' : 'Kopieren nicht m\\u00f6glich \\u2014 Text von Hand markieren.');
      if (ok) {
        knopf.classList.add('fertig');
        setTimeout(() => knopf.classList.remove('fertig'), 900);
      }
    });
    return;
  }
  const bild = ev.target.closest('.bild');
  if (bild) {
    let lupe = document.getElementById('lupe');
    if (!lupe) {
      lupe = document.createElement('div');
      lupe.id = 'lupe';
      lupe.innerHTML = '<img alt="">';
      lupe.addEventListener('click', () => { lupe.hidden = true; });
      document.body.appendChild(lupe);
    }
    lupe.querySelector('img').src = bild.src;
    lupe.hidden = false;
  }
});

document.getElementById('suche').addEventListener('input', zeichne);
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  const lupe = document.getElementById('lupe');
  if (lupe && !lupe.hidden) { lupe.hidden = true; return; }
  const feld = document.getElementById('suche');
  if (feld.value) { feld.value = ''; zeichne(); }
});

baueFilter();
zeichne();
</script>
</body>
</html>
